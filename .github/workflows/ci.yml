name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Major tags verified from official repositories on 2026-09-04:
# https://github.com/actions/checkout
# https://github.com/actions/setup-python
# https://github.com/actions/upload-artifact
# https://github.com/pnpm/setup

jobs:
  catalog:
    name: 1. Catalog and comparison schema/export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Install JavaScript dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm catalog:validate
      - run: pnpm exec vitest run tests/catalog
      - run: pnpm catalog:build
      - run: pnpm comparisons:validate
      - run: pnpm exec vitest run tests/comparisons
      - run: pnpm comparisons:build

  web:
    name: 2. TypeScript, Astro, and static build
    needs: catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check uv
      - name: Sync Python dependencies for site figures and tests
        run: |
          if [ -f uv.lock ]; then
            UV_CACHE_DIR=.cache/uv uv sync --locked --group dev
          else
            UV_CACHE_DIR=.cache/uv uv sync --group dev
          fi
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Install JavaScript dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm catalog:build
      - run: pnpm comparisons:validate
      - run: pnpm comparisons:build
      - run: pnpm exec tsc --noEmit
      - run: pnpm --dir site check
      - run: pnpm --dir site build
      - run: pnpm test:unit

  links-and-citations:
    name: 3. Internal links and citations
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check uv
      - name: Sync Python dependencies for site figures and tests
        run: |
          if [ -f uv.lock ]; then
            UV_CACHE_DIR=.cache/uv uv sync --locked --group dev
          else
            UV_CACHE_DIR=.cache/uv uv sync --group dev
          fi
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Install JavaScript dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm catalog:build
      - run: pnpm comparisons:build
      - run: pnpm --dir site build
      - run: pnpm links:internal
      - run: pnpm citations:check

  python-labs:
    name: 4. Python tests, lint, types, and CPU notebook
    needs: links-and-citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check uv
      - name: Sync locked or lockless Python environment
        run: |
          if [ -f uv.lock ]; then
            UV_CACHE_DIR=.cache/uv uv sync --locked --group dev
          else
            UV_CACHE_DIR=.cache/uv uv sync --group dev
          fi
      - run: UV_CACHE_DIR=.cache/uv uv run pytest labs/tests
      - run: UV_CACHE_DIR=.cache/uv uv run ruff check labs
      - run: UV_CACHE_DIR=.cache/uv uv run mypy

  browser-and-accessibility:
    name: 5. Desktop/mobile browser and accessibility smoke
    needs: python-labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check uv
      - name: Sync Python dependencies for site figures and tests
        run: |
          if [ -f uv.lock ]; then
            UV_CACHE_DIR=.cache/uv uv sync --locked --group dev
          else
            UV_CACHE_DIR=.cache/uv uv sync --group dev
          fi
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Install JavaScript dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm catalog:build
      - run: pnpm comparisons:build
      - run: pnpm --dir site build
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:e2e

  release-hygiene:
    name: 6. Curated release and hygiene
    needs: browser-and-accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check uv
      - name: Sync Python dependencies for site figures and tests
        run: |
          if [ -f uv.lock ]; then
            UV_CACHE_DIR=.cache/uv uv sync --locked --group dev
          else
            UV_CACHE_DIR=.cache/uv uv sync --group dev
          fi
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Install JavaScript dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Build and scan a temporary curated release
        run: |
          release_root="$(mktemp -d "${RUNNER_TEMP}/aidd-release.XXXXXX")"
          echo "RELEASE_ROOT=$release_root" >> "$GITHUB_ENV"
          pnpm catalog:build
          pnpm comparisons:validate
          pnpm comparisons:build
          pnpm exec tsx scripts/release/build.ts --source . --destination "$release_root/public-release" --inventory "$release_root/inventory.txt"
          pnpm exec tsx scripts/release/hygiene.ts "$release_root/public-release" --report artifacts/release-hygiene.json
          test -s "$release_root/inventory.txt"
          for data_file in resources.v1.json resources.v1.csv openness.v1.json comparison.v1.json comparison.v1.csv; do
            test -s "$release_root/public-release/site/public/data/$data_file"
          done
      - name: Test the export against its own code
        run: |
          UV_CACHE_DIR="${RUNNER_TEMP}/uv-cache" uv sync --group dev
          UV_CACHE_DIR="${RUNNER_TEMP}/uv-cache" uv run --no-sync python -m pytest labs/tests -q
        working-directory: ${{ env.RELEASE_ROOT }}/public-release
        env:
          PYTHONPATH: ${{ env.RELEASE_ROOT }}/public-release/labs/src
      - name: Test the export JavaScript gates
        working-directory: ${{ env.RELEASE_ROOT }}/public-release
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --dir site build
          pnpm test:unit
      - name: Build the Pages site from the curated export
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.RELEASE_ROOT }}/public-release
        env:
          AIDD_SITE_URL: https://${{ github.repository_owner }}.github.io
          AIDD_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          pnpm --dir site build
          pnpm exec tsx scripts/quality/check-internal-links.ts site/dist "$AIDD_BASE_PATH"
          touch site/dist/.nojekyll
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.RELEASE_ROOT }}/public-release/site/dist
          include-hidden-files: true
      - name: Upload hygiene report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-hygiene-report
          path: artifacts/release-hygiene.json
          if-no-files-found: warn

  deploy-pages:
    name: 7. Publish verified static site
    needs: release-hygiene
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
