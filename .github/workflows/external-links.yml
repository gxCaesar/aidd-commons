name: External link availability

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Major tags verified from official repositories on 2026-09-04:
# https://github.com/actions/checkout
# https://github.com/actions/upload-artifact
# https://github.com/pnpm/setup

jobs:
  external-link-availability:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Install JavaScript dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Write availability-only report
        run: pnpm links:external -- --report artifacts/external-links.json
      - name: Upload availability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-link-availability
          path: artifacts/external-links.json
          if-no-files-found: warn
