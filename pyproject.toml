[project]
name = "aidd-commons-labs"
version = "0.3.1"
description = "Reproducible teaching labs for AIDD Commons"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "h5py==3.16.0",
  "jupyter==1.1.1",
  "matplotlib==3.11.1",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "rdkit==2025.9.6",
  "scikit-learn==1.9.0",
  "scipy==1.17.1",
]

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["labs/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks under labs/ are build outputs of the build_notebooks.py generators,
# not hand-written source. Their code cells are emitted verbatim from those
# generators, which are linted, and editing notebook JSON to satisfy a linter
# would desynchronise the English and Chinese pair that a test compares.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aidd_commons"]
mypy_path = "labs/src"

# scipy and h5py ship no type information, so strict mode reports every
# import of them as untyped. The project's own code stays strict; only the
# third-party import noise is silenced.
[[tool.mypy.overrides]]
module = ["scipy.*", "h5py.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labs/src/aidd_commons"]
