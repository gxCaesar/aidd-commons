    learning_outcomes: [map-discovery-decisions, identify-experimental-feedback]
    prerequisites: [basic-chemistry, basic-cell-biology]
    cross_track_prerequisites: [foundations]
    pipeline_stages: [disease-mechanism, target-discovery, hit-discovery]
    coverage_state: curated-intro-core-source
    lessons:
      - id: discovery-context
        order: 1
        title: Drug discovery context
        title_zh: 药物发现语境
