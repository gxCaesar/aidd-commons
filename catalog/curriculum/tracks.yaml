        source_ids: [db-chembl, db-pubchem]
        prerequisites: [discovery-context]
        capabilities: [explanation, worked-example, exercise]
      - id: product-profile-and-series
        order: 3
        title: "Target product profiles and chemical-series feedback"
        title_zh: "目标产品概况与化学系列反馈"
        type: lesson
        sections:
          [learning-goals, mechanism, worked-example, exercise, limitations]
        source_ids: [db-chembl, db-pubchem]
