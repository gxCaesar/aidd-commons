units:
  - id: evidence-claim-boundaries
    track_id: foundations
    title: Evidence claim boundaries
    title_zh: 证据与主张边界
    learning_objective: Separate direct observations from inferences and unresolved unknowns in an AIDD question.
    learning_objective_zh: 在 AIDD 问题中区分直接观察、推断与未解决的未知。
    layer: core
    prerequisites: []
    historical_topic_ids: [t01-evidence-claim-unknown]
    lesson_id: foundations/getting-started
  - id: aidd-decision-framing
    track_id: foundations
    title: AIDD decision framing
    title_zh: AIDD 决策框定
    learning_objective: Define the scientific object, intended action, consequence, and unit of inference before selecting a method.
    learning_objective_zh: 在选择方法前明确科学对象、预期行动、后果与推断单位。
    layer: core
    prerequisites: []
    historical_topic_ids: [t01-aidd-decision-unit]
    lesson_id: foundations/decision-unit
  - id: source-scope-review
    track_id: foundations
    lesson_id: foundations/source-and-entity-literacy
    title: Source scope review
    title_zh: 来源范围审查
    learning_objective: State what a reviewed source directly supports and what remains outside its scope.
    learning_objective_zh: 说明已审查来源直接支持的内容及其范围之外仍未知的内容。
    layer: research
    prerequisites: [evidence-claim-boundaries]
    historical_topic_ids: [t01-source-review-scope]
  - id: entity-vocabulary-and-identity
    track_id: foundations
    lesson_id: foundations/source-and-entity-literacy
    title: Entity vocabulary and identity
    title_zh: 实体术语与身份
    learning_objective: Distinguish molecules, compounds, assays, targets, complexes, cell states, patients, and candidates.
    learning_objective_zh: 区分分子、化合物、测定、靶点、复合物、细胞状态、患者与候选项。
    layer: core
    prerequisites: [aidd-decision-framing]
    historical_topic_ids: [t01-entity-glossary]
  - id: comparison-reading-practice
    track_id: foundations
    title: Comparison reading practice
    title_zh: 比较结果阅读练习
    learning_objective: Read a completed comparison while identifying its inputs, claim boundary, and remaining uncertainty.
    learning_objective_zh: 阅读一个已完成的比较，同时识别其输入、主张边界和剩余不确定性。
    layer: practice
    prerequisites: [evidence-claim-boundaries, source-scope-review]
    historical_topic_ids: [t01-evidence-claim-unknown, t01-source-review-scope]
    lesson_id: foundations/first-session

  - id: therapeutic-decision-framing
    track_id: drug-discovery-foundations
    title: Therapeutic decision framing
    title_zh: 治疗决策框定
    learning_objective: Link disease need, intervention hypothesis, modality, evidence, and the next falsifiable decision.
    learning_objective_zh: 连接疾病需求、干预假设、模态、证据与下一项可证伪决策。
    layer: core
    prerequisites: [aidd-decision-framing]
    historical_topic_ids: [t02-therapeutic-decision-context]
    lesson_id: drug-discovery-foundations/discovery-context
  - id: target-product-profile-design
    track_id: drug-discovery-foundations
    lesson_id: drug-discovery-foundations/product-profile-and-series
    title: Target product profile design
    title_zh: 目标产品概况设计
    learning_objective: Specify population, route, efficacy, safety, exposure, and developability constraints before optimization.
    learning_objective_zh: 在优化前明确人群、给药途径、疗效、安全性、暴露与可开发性约束。
    layer: core
    prerequisites: [therapeutic-decision-framing]
    historical_topic_ids: [t02-target-product-profile]
  - id: assay-readout-and-controls
    track_id: drug-discovery-foundations
    title: Assay readout and controls
    title_zh: 测定读出与对照
    learning_objective: Match a biological system, readout, controls, error source, and decision-relevant endpoint.
    learning_objective_zh: 匹配生物体系、读出、对照、误差来源和与决策相关的终点。
    layer: core
    prerequisites: [therapeutic-decision-framing]
    historical_topic_ids: [t02-assay-endpoint-controls]
    lesson_id: drug-discovery-foundations/assay-controls-dose-response
  - id: dose-response-and-assay-windows
    track_id: drug-discovery-foundations
    title: Dose response and assay windows
    title_zh: 剂量反应与测定窗口
    learning_objective: Interpret response ranges, controls, and assay windows without treating a single readout as mechanism proof.
    learning_objective_zh: 解读反应范围、对照和测定窗口，而不将单一读出视为机制证明。
    layer: research
    prerequisites: [assay-readout-and-controls]
    historical_topic_ids: [t02-assay-endpoint-controls]
    lesson_id: drug-discovery-foundations/assay-controls-dose-response
  - id: chemical-series-feedback
    track_id: drug-discovery-foundations
    lesson_id: drug-discovery-foundations/product-profile-and-series
    title: Chemical series feedback
    title_zh: 化学系列反馈
    learning_objective: Use analogue series and experimental feedback to revise a discovery hypothesis.
    learning_objective_zh: 使用类似物系列和实验反馈修订药物发现假设。
    layer: practice
    prerequisites: [target-product-profile-design, assay-readout-and-controls]
    historical_topic_ids: [t02-chemical-series-feedback]

  - id: scientific-computing-environments
    track_id: machine-learning
    title: Scientific computing environments
    title_zh: 科学计算环境
    learning_objective: Identify the data, code, numerical, and compute assumptions needed to reproduce a bounded modelling exercise.
    learning_objective_zh: 识别复现受限建模练习所需的数据、代码、数值与计算假设。
    layer: core
    prerequisites: [aidd-decision-framing]
    historical_topic_ids: [t03-computational-uncertainty]
    lesson_id: machine-learning/scientific-computing
  - id: endpoint-and-loss-design
    track_id: machine-learning
    lesson_id: machine-learning/probability-loss-and-checkpoints
    title: Endpoint and loss design
    title_zh: 终点与损失设计
    learning_objective: Translate a scientific endpoint into model inputs, targets, losses, and mismatch risks.
    learning_objective_zh: 将科学终点转化为模型输入、目标、损失与失配风险。
    layer: core
    prerequisites: [aidd-decision-framing]
    historical_topic_ids: [t03-prediction-target-loss]
  - id: ridge-fitting-and-validation-selection
    track_id: machine-learning
    title: Ridge fitting and validation selection
    title_zh: 岭回归拟合与验证集选择
    learning_objective: Fit a Ridge baseline, choose regularization on validation data, and reserve final holdout results for interpretation.
    learning_objective_zh: 拟合岭回归基线，在验证数据上选择正则化，并将最终留出集结果保留给解释。
    layer: core
    prerequisites: [endpoint-and-loss-design, scientific-computing-environments]
    historical_topic_ids: [t03-training-validation-selection]
    lesson_id: machine-learning/baseline-training-validation
  - id: gnn-message-passing
    track_id: machine-learning
    lesson_id: machine-learning/neural-representations
    title: GNN message passing
    title_zh: 图神经网络消息传递
    learning_objective: Explain how node and edge messages aggregate local graph information and what they cannot identify.
    learning_objective_zh: 解释节点与边消息如何聚合局部图信息，以及其无法识别的内容。
    layer: research
    prerequisites: [endpoint-and-loss-design]
    historical_topic_ids: [t03-inductive-bias-selection]
  - id: transformer-attention
    track_id: machine-learning
    lesson_id: machine-learning/neural-representations
    title: Transformer attention
    title_zh: Transformer 注意力
    learning_objective: Explain attention as content-dependent aggregation and distinguish it from evidence of causal importance.
    learning_objective_zh: 将注意力解释为依内容而变的聚合，并将其与因果重要性的证据区分开来。
    layer: research
    prerequisites: [endpoint-and-loss-design]
    historical_topic_ids: [t03-inductive-bias-selection]
  - id: geometric-equivariance
    track_id: machine-learning
    lesson_id: machine-learning/neural-representations
    title: Geometric equivariance
    title_zh: 几何等变性
    learning_objective: Match rotational and translational symmetry assumptions to a molecular geometry task.
    learning_objective_zh: 将旋转和平移对称性假设与分子几何任务相匹配。
    layer: research
    prerequisites: [endpoint-and-loss-design]
    historical_topic_ids: [t03-inductive-bias-selection]
  - id: gaussian-processes
    track_id: machine-learning
    lesson_id: machine-learning/probability-loss-and-checkpoints
    title: Gaussian processes
    title_zh: 高斯过程
    learning_objective: Use a Gaussian-process view to relate kernel assumptions, interpolation, and predictive uncertainty.
    learning_objective_zh: 使用高斯过程视角关联核假设、插值与预测不确定性。
    layer: research
    prerequisites: [endpoint-and-loss-design]
    historical_topic_ids: [t03-computational-uncertainty]
  - id: validation-checkpoint-and-uncertainty
    track_id: machine-learning
    lesson_id: machine-learning/probability-loss-and-checkpoints
    title: Validation checkpoint and uncertainty
    title_zh: 验证集检查点与不确定性
    learning_objective: Separate fitting, validation selection, checkpoint choice, and uncertainty reporting under a fixed rule.
    learning_objective_zh: 在固定规则下区分拟合、验证集选择、检查点选择与不确定性报告。
    layer: core
    prerequisites: [ridge-fitting-and-validation-selection]
    historical_topic_ids:
      [t03-training-validation-selection, t03-computational-uncertainty]
  - id: fitting-selection-and-error-sandbox
    track_id: machine-learning
    title: Fitting selection and error sandbox
    title_zh: 拟合选择与误差沙箱
    learning_objective: Run a synthetic teaching example that keeps validation choice separate from final holdout interpretation.
    learning_objective_zh: 运行一个合成教学示例，将验证集选择与最终留出集解释保持分离。
    layer: practice
    prerequisites:
      [
        model-table-construction,
        ridge-fitting-and-validation-selection,
        regression-and-classification-errors,
      ]
    historical_topic_ids: [t03-training-validation-selection]
    lesson_id: machine-learning/student-modelling-sandbox

  - id: entity-resolution-workflow
    track_id: data-governance
    lesson_id: data-governance/identity-lineage-and-reuse
    title: Entity resolution workflow
    title_zh: 实体解析流程
    learning_objective: Resolve chemical, protein, assay, disease, and sample identifiers while retaining ambiguity.
    learning_objective_zh: 解析化学、蛋白、测定、疾病和样本标识符，同时保留歧义。
    layer: core
    prerequisites: [entity-vocabulary-and-identity]
    historical_topic_ids: [t04-entity-identity-resolution]
  - id: data-contract-assembly
    track_id: data-governance
    title: Data contract assembly
    title_zh: 数据契约组装
    learning_objective: Declare producer, version, entities, labels, exclusions, inference unit, split, and expected output.
    learning_objective_zh: 声明生产者、版本、实体、标签、排除、推断单位、划分与预期输出。
    layer: core
    prerequisites: [entity-resolution-workflow]
    historical_topic_ids: [t04-data-contract]
    lesson_id: data-governance/data-contracts
  - id: provenance-lineage
    track_id: data-governance
    lesson_id: data-governance/identity-lineage-and-reuse
    title: Provenance lineage
    title_zh: 来源谱系
    learning_objective: Trace records and transformations to a dated source release and processing stage.
    learning_objective_zh: 将记录和转换追溯到带日期的来源版本和处理阶段。
    layer: research
    prerequisites: [data-contract-assembly, source-scope-review]
    historical_topic_ids: [t04-provenance-versioning]
  - id: record-normalization-and-exclusion
    track_id: data-governance
    lesson_id: data-governance/records-to-model-table
    title: Record normalization and exclusion
    title_zh: 记录标准化与排除
    learning_objective: Define duplicate, normalization, censoring, missingness, conflict, and exclusion rules before modelling.
    learning_objective_zh: 在建模前定义重复、标准化、删失、缺失、冲突和排除规则。
    layer: practice
    prerequisites: [data-contract-assembly]
    historical_topic_ids: [t04-cleaning-exclusion-rules]
  - id: model-table-construction
    track_id: data-governance
    title: Model table construction
    title_zh: 建模表构建
    learning_objective: Transform aligned records into a model table with an explicit row unit and retained exclusions.
    learning_objective_zh: 将对齐记录转换为建模表，并明确行单位和保留的排除项。
    layer: core
    prerequisites:
      [
        entity-resolution-workflow,
        data-contract-assembly,
        record-normalization-and-exclusion,
      ]
    historical_topic_ids: [t04-data-contract, t04-cleaning-exclusion-rules]
    lesson_id: data-governance/records-to-model-table
  - id: licence-and-permitted-use
    track_id: data-governance
    lesson_id: data-governance/identity-lineage-and-reuse
    title: Licence and permitted use
    title_zh: 许可证与允许用途
    learning_objective: Separate data access from licence, redistribution, commercial use, privacy, consent, and unresolved fields.
    learning_objective_zh: 将数据访问与许可证、再分发、商业用途、隐私、同意和未解决字段区分开来。
    layer: research
    prerequisites: [provenance-lineage]
    historical_topic_ids: [t04-permitted-use-legal-scope]

  - id: molecular-representation-choice
    track_id: representations
    title: Molecular representation choice
    title_zh: 分子表示选择
    learning_objective: Compare line notations, descriptors, fingerprints, graphs, and conformers by the chemical information they retain.
    learning_objective_zh: 按保留的化学信息比较线性符号、描述符、指纹、图和构象。
    layer: core
    prerequisites: [entity-resolution-workflow]
    historical_topic_ids: [t05-small-molecule-representation]
    lesson_id: representations/small-molecule-representations
  - id: protein-sequence-and-structure-encoding
    track_id: representations
    title: Protein sequence and structure encoding
    title_zh: 蛋白序列与结构编码
    learning_objective: Relate sequence, alignment, residue, geometry, surface, and ensemble encodings to a protein question.
    learning_objective_zh: 将序列、比对、残基、几何、表面和集合编码与蛋白问题关联起来。
    layer: core
    prerequisites: [entity-resolution-workflow]
    historical_topic_ids: [t05-protein-sequence-structure-representation]
    lesson_id: representations/complex-cell-and-knowledge-graphs
  - id: complex-contact-and-pose-graphs
    track_id: representations
    lesson_id: representations/complex-cell-and-knowledge-graphs
    title: Complex contact and pose graphs
    title_zh: 复合物接触与构象图
    learning_objective: Represent complexes, interfaces, contacts, and poses without collapsing distinct physical states.
    learning_objective_zh: 表示复合物、界面、接触和构象，而不合并不同物理状态。
    layer: research
    prerequisites:
      [molecular-representation-choice, protein-sequence-and-structure-encoding]
    historical_topic_ids: [t05-complex-interaction-representation]
  - id: cell-state-and-perturbation-encoding
    track_id: representations
    lesson_id: representations/complex-cell-and-knowledge-graphs
    title: Cell state and perturbation encoding
    title_zh: 细胞状态与扰动编码
    learning_objective: Encode molecular profiles, cell states, perturbations, time, and context at the relevant biological unit.
    learning_objective_zh: 在相关生物单位上编码分子谱、细胞状态、扰动、时间和语境。
    layer: research
    prerequisites: [data-contract-assembly]
    historical_topic_ids: [t05-omics-perturbation-representation]
  - id: knowledge-graph-schema-and-evidence
    track_id: representations
    lesson_id: representations/complex-cell-and-knowledge-graphs
    title: Knowledge graph schema and evidence
    title_zh: 知识图谱模式与证据
    learning_objective: Model typed entities, relations, evidence provenance, and missing edges without equating connectivity with causality.
    learning_objective_zh: 建模带类型的实体、关系、证据来源和缺失边，而不将连通性等同于因果性。
    layer: research
    prerequisites: [entity-resolution-workflow]
    historical_topic_ids: [t05-relational-knowledge-graph-representation]
  - id: representation-loss-and-invariance
    track_id: representations
    lesson_id: representations/complex-cell-and-knowledge-graphs
    title: Representation loss and invariance
    title_zh: 表示损失与不变性
    learning_objective: Identify information lost by an encoding and state which transformations should leave a prediction unchanged.
    learning_objective_zh: 识别编码丢失的信息，并说明哪些变换应使预测保持不变。
    layer: core
    prerequisites:
      [molecular-representation-choice, protein-sequence-and-structure-encoding]
    historical_topic_ids:
      [
        t05-small-molecule-representation,
        t05-protein-sequence-structure-representation,
      ]

  - id: phenotype-context-definition
    track_id: mechanism-targets
    title: Phenotype context definition
    title_zh: 表型语境定义
    learning_objective: Define indication, phenotype, tissue, cell state, population, and temporal context for a target question.
    learning_objective_zh: 为靶点问题定义适应症、表型、组织、细胞状态、人群和时间语境。
    layer: core
    prerequisites: [therapeutic-decision-framing, data-contract-assembly]
    historical_topic_ids: [t06-disease-state-definition]
    lesson_id: mechanism-targets/disease-state-definition
  - id: mechanism-hypothesis-and-counterevidence
    track_id: mechanism-targets
    lesson_id: mechanism-targets/perturbation-to-target-validation
    title: Mechanism hypothesis and counterevidence
    title_zh: 机制假设与反证
    learning_objective: Connect a disease mechanism to supporting evidence, alternatives, and a falsifying observation.
    learning_objective_zh: 将疾病机制与支持证据、替代解释和可证伪观察连接起来。
    layer: core
    prerequisites: [evidence-claim-boundaries, phenotype-context-definition]
    historical_topic_ids: [t06-mechanism-hypothesis-counterevidence]
  - id: gwas-fine-mapping
    track_id: mechanism-targets
    title: GWAS fine mapping
    title_zh: GWAS 精细定位
    learning_objective: Distinguish an associated locus from a credible causal variant set and its assumptions.
    learning_objective_zh: 区分关联位点与可信因果变异集合及其假设。
    layer: research
    prerequisites: [phenotype-context-definition]
    historical_topic_ids: [t06-causal-target-evidence]
    lesson_id: mechanism-targets/genetics-to-target-evidence
  - id: colocalization-and-mendelian-randomization
    track_id: mechanism-targets
    title: Colocalization and Mendelian randomization
    title_zh: 共定位与孟德尔随机化
    learning_objective: Compare shared-signal and instrumental-variable assumptions when prioritizing a target.
    learning_objective_zh: 在靶点优先级排序时比较共享信号和工具变量假设。
    layer: research
    prerequisites: [gwas-fine-mapping]
    historical_topic_ids: [t06-causal-target-evidence]
    lesson_id: mechanism-targets/genetics-to-target-evidence
  - id: crispr-and-perturb-seq
    track_id: mechanism-targets
    lesson_id: mechanism-targets/perturbation-to-target-validation
    title: CRISPR and Perturb-seq
    title_zh: CRISPR 与 Perturb-seq
    learning_objective: Define perturbation, cell, donor, and context units when interpreting genetic perturbation responses.
    learning_objective_zh: 在解读遗传扰动响应时定义扰动、细胞、供体和语境单位。
    layer: practice
    prerequisites:
      [phenotype-context-definition, cell-state-and-perturbation-encoding]
    historical_topic_ids: [t06-perturbation-genetic-validation]
  - id: perturbation-context-generalization
    track_id: mechanism-targets
    title: Perturbation context generalization
    title_zh: 扰动语境泛化
    learning_objective: Test whether a perturbation prediction transports across cell contexts without interpreting transfer as validation.
    learning_objective_zh: 检验扰动预测能否跨细胞语境迁移，而不将迁移解释为验证。
    layer: research
    prerequisites: [crispr-and-perturb-seq]
    historical_topic_ids: [t06-perturbation-genetic-validation]
    lesson_id: mechanism-targets/perturbation-context-generalization
  - id: target-tractability-and-risk
    track_id: mechanism-targets
    lesson_id: mechanism-targets/perturbation-to-target-validation
    title: Target tractability and risk
    title_zh: 靶点可成药性与风险
    learning_objective: Assess modality access, selectivity, safety liabilities, and translational uncertainty for a target hypothesis.
    learning_objective_zh: 评估靶点假设的模态可及性、选择性、安全负担和转化不确定性。
    layer: core
    prerequisites:
      [
        target-product-profile-design,
        colocalization-and-mendelian-randomization,
      ]
    historical_topic_ids: [t06-tractability-target-risk]

  - id: property-endpoint-contract
    track_id: qsar-properties
    title: Property endpoint contract
    title_zh: 性质终点契约
    learning_objective: Specify property, assay, unit, censoring, aggregation, and prediction unit before fitting a model.
    learning_objective_zh: 在拟合模型前明确性质、测定、单位、删失、聚合和预测单位。
    layer: core
    prerequisites: [assay-readout-and-controls]
    historical_topic_ids: [t07-endpoint-definition]
    lesson_id: qsar-properties/property-prediction
  - id: chemical-standardization
    track_id: qsar-properties
    lesson_id: qsar-properties/chemical-series-and-domains
    title: Chemical standardization
    title_zh: 化学标准化
    learning_objective: Freeze salt, charge, tautomer, stereochemistry, duplicate, mixture, and identifier rules for a dataset.
    learning_objective_zh: 为数据集冻结盐型、电荷、互变异构、立体化学、重复、混合物和标识符规则。
    layer: core
    prerequisites: [model-table-construction]
    historical_topic_ids: [t07-chemical-standardisation]
  - id: representation-selection-for-properties
    track_id: qsar-properties
    lesson_id: qsar-properties/chemical-series-and-domains
    title: Representation selection for properties
    title_zh: 性质任务表示选择
    learning_objective: Select representations from the endpoint, data regime, and information that must be retained.
    learning_objective_zh: 根据终点、数据规模和必须保留的信息选择表示。
    layer: core
    prerequisites: [property-endpoint-contract, molecular-representation-choice]
    historical_topic_ids: [t07-property-representation-selection]
  - id: regression-and-classification-errors
    track_id: qsar-properties
    title: Regression and classification errors
    title_zh: 回归与分类误差
    learning_objective: Compare residuals, thresholds, label noise, and error costs before converting an endpoint into a task.
    learning_objective_zh: 在将终点转化为任务前比较残差、阈值、标签噪声和误差代价。
    layer: core
    prerequisites:
      [property-endpoint-contract, ridge-fitting-and-validation-selection]
    historical_topic_ids:
      [t07-regression-formulation, t07-classification-formulation]
    lesson_id: qsar-properties/regression-classification-errors
  - id: scaffold-time-and-group-splits
    track_id: qsar-properties
    lesson_id: qsar-properties/chemical-series-and-domains
    title: Scaffold time and group splits
    title_zh: 骨架时间与分组划分
    learning_objective: Choose a split that matches the intended prospective, scaffold, group, or time generalization claim.
    learning_objective_zh: 选择与预期前瞻、骨架、分组或时间泛化主张相匹配的划分。
    layer: core
    prerequisites: [chemical-standardization, property-endpoint-contract]
    historical_topic_ids: [t07-property-task-split-design]
  - id: calibrated-predictive-uncertainty
    track_id: qsar-properties
    lesson_id: qsar-properties/uncertainty-to-decisions
    title: Calibrated predictive uncertainty
    title_zh: 校准的预测不确定性
    learning_objective: Check whether stated uncertainty aligns with observed error at the decision-relevant unit.
    learning_objective_zh: 检查陈述的不确定性是否与决策相关单位上的实际误差一致。
    layer: research
    prerequisites: [regression-and-classification-errors]
    historical_topic_ids: [t07-calibration]
  - id: applicability-domain-diagnostics
    track_id: qsar-properties
    lesson_id: qsar-properties/chemical-series-and-domains
    title: Applicability domain diagnostics
    title_zh: 适用域诊断
    learning_objective: Identify when a query differs from training support and what that limits in a prediction.
    learning_objective_zh: 识别查询何时偏离训练支持集，以及这对预测施加的限制。
    layer: research
    prerequisites:
      [
        representation-selection-for-properties,
        regression-and-classification-errors,
      ]
    historical_topic_ids: [t07-applicability-domain]
  - id: sar-explanations-and-counterfactuals
    track_id: qsar-properties
    lesson_id: qsar-properties/chemical-series-and-domains
    title: SAR explanations and counterfactuals
    title_zh: 构效关系解释与反事实
    learning_objective: Form a bounded structure activity explanation and state the analogue evidence that could challenge it.
    learning_objective_zh: 形成有边界的构效关系解释，并说明可挑战它的类似物证据。
    layer: research
    prerequisites: [applicability-domain-diagnostics]
    historical_topic_ids: [t07-interpretability-sar]
  - id: ranking-and-decision-thresholds
    track_id: qsar-properties
    lesson_id: qsar-properties/uncertainty-to-decisions
    title: Ranking and decision thresholds
    title_zh: 排序与决策阈值
    learning_objective: Relate calibrated predictions and uncertainty to a screening or follow-up decision threshold.
    learning_objective_zh: 将校准预测和不确定性与筛选或后续实验的决策阈值关联起来。
    layer: practice
    prerequisites:
      [calibrated-predictive-uncertainty, applicability-domain-diagnostics]
    historical_topic_ids: [t07-property-decision-use]

  - id: exposure-and-endpoint-contract
    track_id: admet-pk
    title: Exposure and endpoint contract
    title_zh: 暴露与终点契约
    learning_objective: Define an exposure endpoint, route, sampling context, and decision use before interpreting a prediction.
    learning_objective_zh: 在解读预测前定义暴露终点、给药途径、采样语境和决策用途。
    layer: core
    prerequisites: [property-endpoint-contract]
    historical_topic_ids: [t08-exposure-pk-endpoint]
    lesson_id: admet-pk/admet-evaluation
  - id: clearance-exposure-and-pkpd
    track_id: admet-pk
    title: Clearance exposure and PK PD
    title_zh: 清除率、暴露与 PK PD
    learning_objective: Relate clearance, concentration time profiles, pharmacodynamics, and translational assumptions.
    learning_objective_zh: 关联清除率、浓度时间曲线、药效学和转化假设。
    layer: core
    prerequisites:
      [exposure-and-endpoint-contract, dose-response-and-assay-windows]
    historical_topic_ids:
      [t08-exposure-pk-endpoint, t08-pkpd-translational-assumption]
    lesson_id: admet-pk/exposure-clearance-pkpd
  - id: metabolism-and-ddi-mechanisms
    track_id: admet-pk
    lesson_id: admet-pk/metabolism-to-safety
    title: Metabolism and DDI mechanisms
    title_zh: 代谢与 DDI 机制
    learning_objective: Distinguish metabolism hypotheses, enzyme context, and drug drug interaction risk from a generic score.
    learning_objective_zh: 将代谢假设、酶语境和药物相互作用风险与通用评分区分开来。
    layer: research
    prerequisites: [exposure-and-endpoint-contract]
    historical_topic_ids: [t08-metabolism-ddi-risk]
  - id: toxicity-endpoints-and-transfer
    track_id: admet-pk
    lesson_id: admet-pk/metabolism-to-safety
    title: Toxicity endpoints and transfer
    title_zh: 毒性终点与迁移
    learning_objective: Match a toxicity endpoint and biological system to the population and exposure context of a decision.
    learning_objective_zh: 将毒性终点和生物体系与决策的人群和暴露语境相匹配。
    layer: core
    prerequisites: [property-endpoint-contract]
    historical_topic_ids: [t08-safety-toxicity-endpoint]
  - id: multi-parameter-admet-optimization
    track_id: admet-pk
    lesson_id: admet-pk/metabolism-to-safety
    title: Multi-parameter ADMET optimization
    title_zh: 多参数 ADMET 优化
    learning_objective: Compare efficacy, exposure, metabolism, and safety tradeoffs without reducing them to one score.
    learning_objective_zh: 比较疗效、暴露、代谢和安全性权衡，而不将其缩减为一个分数。
    layer: practice
    prerequisites:
      [
        clearance-exposure-and-pkpd,
        metabolism-and-ddi-mechanisms,
        toxicity-endpoints-and-transfer,
      ]
    historical_topic_ids: [t08-multiendpoint-tradeoff]
  - id: screening-unit-and-assay-design
    track_id: dti-screening
    title: Screening unit and assay design
    title_zh: 筛选单位与测定设计
    learning_objective: Define target, assay, compound set, control, and screening unit before comparing methods.
    learning_objective_zh: 在比较方法前定义靶点、测定、化合物集合、对照和筛选单位。
    layer: core
    prerequisites: [assay-readout-and-controls]
    historical_topic_ids: [t09-target-assay-screen-unit]
    lesson_id: dti-screening/screening-and-affinity
  - id: binding-mode-and-pose-hypotheses
    track_id: dti-screening
    lesson_id: dti-screening/screening-prevalence-and-transfer
    title: Binding mode and pose hypotheses
    title_zh: 结合模式与构象假设
    learning_objective: Treat a predicted pose as a hypothesis with explicit alternatives and experimental checks.
    learning_objective_zh: 将预测构象视为具有明确替代解释和实验检验的假设。
    layer: research
    prerequisites: [complex-contact-and-pose-graphs]
    historical_topic_ids: [t09-binding-mode-pose-hypothesis]
  - id: binder-classification-and-decoys
    track_id: dti-screening
    lesson_id: dti-screening/screening-prevalence-and-transfer
    title: Binder classification and decoys
    title_zh: 结合体分类与诱饵
    learning_objective: Define positive, negative, and decoy construction choices before interpreting a binder classifier.
    learning_objective_zh: 在解读结合体分类器前定义阳性、阴性和诱饵构建选择。
    layer: core
    prerequisites: [screening-unit-and-assay-design]
    historical_topic_ids: [t09-binder-classification]
  - id: affinity-scales-and-ranking
    track_id: dti-screening
    lesson_id: dti-screening/screening-prevalence-and-transfer
    title: Affinity scales and ranking
    title_zh: 亲和力尺度与排序
    learning_objective: Relate affinity units, assay conditions, rank order, and uncertainty to a ranking claim.
    learning_objective_zh: 将亲和力单位、测定条件、排序和不确定性与排序主张关联起来。
    layer: core
    prerequisites:
      [screening-unit-and-assay-design, regression-and-classification-errors]
    historical_topic_ids: [t09-affinity-ranking]
  - id: virtual-screening-and-repurposing-transfer
    track_id: dti-screening
    lesson_id: dti-screening/screening-prevalence-and-transfer
    title: Virtual screening and repurposing transfer
    title_zh: 虚拟筛选与再利用迁移
    learning_objective: Evaluate enrichment and transfer claims against the target, assay, decoy, and follow-up context.
    learning_objective_zh: 根据靶点、测定、诱饵和后续实验语境评估富集与迁移主张。
    layer: research
    prerequisites:
      [binder-classification-and-decoys, affinity-scales-and-ranking]
    historical_topic_ids: [t09-screening-selection-repurposing-transfer]

  - id: structure-evidence-and-state
    track_id: structure-and-pockets
    title: Structure evidence and state
    title_zh: 结构证据与状态
    learning_objective: Identify the experimental or predicted structural state and its relevant missing context.
    learning_objective_zh: 识别实验或预测结构状态及其相关的缺失语境。
    layer: core
    prerequisites: [protein-sequence-and-structure-encoding]
    historical_topic_ids: [t10-structure-evidence-state]
    lesson_id: structure-and-pockets/cofolding-frontier
  - id: pocket-definition-and-cryptic-sites
    track_id: structure-and-pockets
    lesson_id: structure-and-pockets/pocket-states-and-confidence
    title: Pocket definition and cryptic sites
    title_zh: 口袋定义与隐蔽位点
    learning_objective: Define a binding site boundary and distinguish observed pockets from hypothesized cryptic sites.
    learning_objective_zh: 定义结合位点边界，并区分观察到的口袋与假设的隐蔽位点。
    layer: core
    prerequisites: [structure-evidence-and-state]
    historical_topic_ids: [t10-binding-site-pocket-definition]
  - id: cofolding-state-hypotheses
    track_id: structure-and-pockets
    title: Cofolding state hypotheses
    title_zh: 共折叠状态假设
    learning_objective: Interpret a cofolded complex as one structural hypothesis rather than a direct affinity measurement.
    learning_objective_zh: 将共折叠复合物解读为一种结构假设，而非直接亲和力测量。
    layer: research
    prerequisites:
      [structure-evidence-and-state, pocket-definition-and-cryptic-sites]
    historical_topic_ids: [t10-complex-cofolding-hypothesis]
    lesson_id: structure-and-pockets/cofolding-frontier
  - id: structural-confidence-and-alternatives
    track_id: structure-and-pockets
    lesson_id: structure-and-pockets/pocket-states-and-confidence
    title: Structural confidence and alternatives
    title_zh: 结构置信度与替代解释
    learning_objective: Compare confidence signals, alternative states, and experimental information that could resolve a structural ambiguity.
    learning_objective_zh: 比较置信度信号、替代状态和可解决结构歧义的实验信息。
    layer: research
    prerequisites: [cofolding-state-hypotheses]
    historical_topic_ids: [t10-structural-confidence-alternatives]
  - id: open-structural-assets-and-reuse
    track_id: structure-and-pockets
    lesson_id: structure-and-pockets/pocket-states-and-confidence
    title: Open structural assets and reuse
    title_zh: 开放结构资产与复用
    learning_objective: Check model, weights, code, input, output, and licence availability before claiming a workflow is reproducible.
    learning_objective_zh: 在声称工作流可复现前检查模型、权重、代码、输入、输出和许可证的可用性。
    layer: practice
    prerequisites: [structure-evidence-and-state, licence-and-permitted-use]
    historical_topic_ids: [t10-asset-openness-reproducibility]
  - id: pose-affinity-and-binder-separation
    track_id: structure-and-pockets
    title: Pose affinity and binder separation
    title_zh: 构象、亲和力与结合体判定分离
    learning_objective: Separate coordinate confidence, binder probability, and affinity prediction from causal energetic proof.
    learning_objective_zh: 将坐标置信度、结合体概率和亲和力预测与因果能量证明分开。
    layer: research
    prerequisites: [cofolding-state-hypotheses, docking-score-and-rescoring]
    historical_topic_ids:
      [t10-complex-cofolding-hypothesis, t10-structural-confidence-alternatives]
    lesson_id: structure-and-pockets/structure-affinity-mechanisms

  - id: system-state-and-boundary-conditions
    track_id: physics-based-modeling
    title: System state and boundary conditions
    title_zh: 体系状态与边界条件
    learning_objective: Specify components, protonation, solvent, temperature, restraints, and observables for a physical model.
    learning_objective_zh: 为物理模型明确组分、质子化、溶剂、温度、约束和观测量。
    layer: core
    prerequisites: [structure-evidence-and-state]
    historical_topic_ids: [t11-physical-model-system-state]
    lesson_id: physics-based-modeling/physical-model-system-state
  - id: force-fields-and-solvent
    track_id: physics-based-modeling
    lesson_id: physics-based-modeling/force-fields-and-sampling
    title: Force fields and solvent
    title_zh: 力场与溶剂
    learning_objective: Explain how force-field choice and solvent treatment define a model rather than a universal physical truth.
    learning_objective_zh: 解释力场选择和溶剂处理如何定义一个模型，而非普遍物理真相。
    layer: core
    prerequisites: [system-state-and-boundary-conditions]
    historical_topic_ids: [t11-physical-model-system-state]
  - id: docking-score-and-rescoring
    track_id: physics-based-modeling
    title: Docking score and rescoring
    title_zh: 对接打分与重打分
    learning_objective: Separate pose generation, scoring, rescoring, and experimental binding evidence.
    learning_objective_zh: 区分构象生成、打分、重打分和实验结合证据。
    layer: core
    prerequisites: [pocket-definition-and-cryptic-sites]
    historical_topic_ids: [t11-docking-scoring-protocol]
    lesson_id: physics-based-modeling/docking-to-fep
  - id: molecular-dynamics-and-sampling
    track_id: physics-based-modeling
    lesson_id: physics-based-modeling/force-fields-and-sampling
    title: Molecular dynamics and sampling
    title_zh: 分子动力学与采样
    learning_objective: Relate trajectories, sampling limits, observables, and correlated frames to a dynamical claim.
    learning_objective_zh: 将轨迹、采样限制、观测量和相关帧与动态主张关联起来。
    layer: research
    prerequisites: [force-fields-and-solvent]
    historical_topic_ids: [t11-dynamic-simulation-observable]
  - id: relative-and-absolute-binding-free-energy
    track_id: physics-based-modeling
    lesson_id: physics-based-modeling/free-energy-cycles-and-convergence
    title: Relative and absolute binding free energy
    title_zh: 相对与绝对结合自由能
    learning_objective: Distinguish alchemical relative and absolute free-energy endpoints, their networks, and their assumptions.
    learning_objective_zh: 区分炼金相对与绝对自由能终点、其网络及其假设。
    layer: core
    prerequisites: [molecular-dynamics-and-sampling]
    historical_topic_ids: [t11-free-energy-endpoint-network]
  - id: qm-mm-boundaries
    track_id: physics-based-modeling
    lesson_id: physics-based-modeling/qm-mm-and-reactive-events
    title: QM MM boundaries
    title_zh: QM MM 边界
    learning_objective: Choose a quantum and molecular-mechanics boundary that matches the chemical event and state the approximation.
    learning_objective_zh: 选择与化学事件相匹配的量子与分子力学边界，并说明该近似。
    layer: research
    prerequisites: [system-state-and-boundary-conditions]
    historical_topic_ids: [t11-physical-model-system-state]
  - id: thermodynamic-cycle-design
    track_id: physics-based-modeling
    lesson_id: physics-based-modeling/free-energy-cycles-and-convergence
    title: Thermodynamic cycle design
    title_zh: 热力学循环设计
    learning_objective: Construct a thermodynamic cycle whose edge definitions support the desired free-energy comparison.
    learning_objective_zh: 构建边定义支持所需自由能比较的热力学循环。
    layer: research
    prerequisites: [relative-and-absolute-binding-free-energy]
    historical_topic_ids: [t11-free-energy-endpoint-network]
  - id: convergence-and-replica-diagnostics
    track_id: physics-based-modeling
    lesson_id: physics-based-modeling/free-energy-cycles-and-convergence
    title: Convergence and replica diagnostics
    title_zh: 收敛与重复诊断
    learning_objective: Diagnose convergence, replica agreement, and sensitivity before interpreting a physical estimate.
    learning_objective_zh: 在解读物理估计前诊断收敛、重复一致性和敏感性。
    layer: practice
    prerequisites:
      [
        molecular-dynamics-and-sampling,
        relative-and-absolute-binding-free-energy,
      ]
    historical_topic_ids: [t11-convergence-protocol-uncertainty]

  - id: design-objective-and-constraints
    track_id: molecular-generation
    title: Design objective and constraints
    title_zh: 设计目标与约束
    learning_objective: Write an explicit design objective with property, novelty, synthesis, safety, and experimental constraints.
    learning_objective_zh: 写出包含性质、新颖性、合成、安全和实验约束的明确设计目标。
    layer: core
    prerequisites: [target-product-profile-design]
    historical_topic_ids: [t12-design-objective-constraints]
    lesson_id: molecular-generation/generation-and-search
  - id: candidate-space-and-fragment-grammar
    track_id: molecular-generation
    lesson_id: molecular-generation/flows-and-constrained-search
    title: Candidate space and fragment grammar
    title_zh: 候选空间与片段语法
    learning_objective: Define the molecular space and construction grammar before interpreting generated candidates.
    learning_objective_zh: 在解读生成候选项前定义分子空间和构建语法。
    layer: core
    prerequisites: [molecular-representation-choice]
    historical_topic_ids: [t12-candidate-design-space]
  - id: autoregressive-generation
    track_id: molecular-generation
    title: Autoregressive generation
    title_zh: 自回归生成
    learning_objective: Explain conditional token factorization and distinguish likelihood from a downstream experimental objective.
    learning_objective_zh: 解释条件词元分解，并将似然与下游实验目标区分开来。
    layer: research
    prerequisites: [candidate-space-and-fragment-grammar]
    historical_topic_ids: [t12-candidate-design-space]
    lesson_id: molecular-generation/generative-model-mechanisms
  - id: variational-autoencoders
    track_id: molecular-generation
    title: Variational autoencoders
    title_zh: 变分自编码器
    learning_objective: Relate latent variables, reconstruction, and regularization to a constrained molecular generation task.
    learning_objective_zh: 将潜变量、重构和正则化与受约束的分子生成任务关联起来。
    layer: research
    prerequisites: [candidate-space-and-fragment-grammar]
    historical_topic_ids: [t12-candidate-design-space]
    lesson_id: molecular-generation/generative-model-mechanisms
  - id: diffusion-generation
    track_id: molecular-generation
    title: Diffusion generation
    title_zh: 扩散生成
    learning_objective: Explain iterative denoising and conditional generation without treating a generated sample as validated.
    learning_objective_zh: 解释迭代去噪和条件生成，而不将生成样本视为已验证。
    layer: research
    prerequisites: [candidate-space-and-fragment-grammar]
    historical_topic_ids: [t12-candidate-design-space]
    lesson_id: molecular-generation/generative-model-mechanisms
  - id: normalizing-flows
    track_id: molecular-generation
    lesson_id: molecular-generation/flows-and-constrained-search
    title: Normalizing flows
    title_zh: 归一化流
    learning_objective: Explain invertible transformations and density change terms before using a flow-based design model.
    learning_objective_zh: 在使用基于流的设计模型前解释可逆变换和密度变化项。
    layer: research
    prerequisites: [candidate-space-and-fragment-grammar]
    historical_topic_ids: [t12-candidate-design-space]
  - id: flow-matching
    track_id: molecular-generation
    title: Flow matching
    title_zh: 流匹配
    learning_objective: Explain flow matching as velocity learning over a path between distributions without implying a complete design workflow.
    learning_objective_zh: 将流匹配解释为分布路径上的速度学习，而不暗示其构成完整设计工作流。
    layer: research
    prerequisites: [candidate-space-and-fragment-grammar]
    historical_topic_ids: [t12-candidate-design-space]
    lesson_id: molecular-generation/generative-model-mechanisms
  - id: multiobjective-search-and-diversity
    track_id: molecular-generation
    lesson_id: molecular-generation/flows-and-constrained-search
    title: Multiobjective search and diversity
    title_zh: 多目标搜索与多样性
    learning_objective: Allocate search effort across objectives and diversity without silently changing the selection rule.
    learning_objective_zh: 在不暗中改变选择规则的情况下，在多个目标和多样性之间分配搜索资源。
    layer: practice
    prerequisites: [design-objective-and-constraints]
    historical_topic_ids: [t12-multiobjective-search-diversity]
  - id: validity-novelty-synthesizability-and-batch-triage
    track_id: molecular-generation
    lesson_id: molecular-generation/flows-and-constrained-search
    title: Validity novelty synthesizability and batch triage
    title_zh: 有效性、新颖性、可合成性与批次分流
    learning_objective: Separate validity, novelty, synthesizability, and objective proxies when triaging a generated batch.
    learning_objective_zh: 在分流生成批次时区分有效性、新颖性、可合成性和目标代理。
    layer: practice
    prerequisites: [multiobjective-search-and-diversity]
    historical_topic_ids:
      [
        t12-validity-novelty-synthetic-screen,
        t12-generated-candidate-evaluation-batch,
      ]

  - id: modality-and-construct-selection
    track_id: biologics-design
    title: Modality and construct selection
    title_zh: 模态与构建体选择
    learning_objective: Match protein, peptide, antibody, nucleic-acid, conjugate, or degrader choices to a therapeutic hypothesis.
    learning_objective_zh: 将蛋白、多肽、抗体、核酸、偶联物或降解剂选择与治疗假设相匹配。
    layer: core
    prerequisites: [target-product-profile-design]
    historical_topic_ids: [t13-biologic-modality-construct]
    lesson_id: biologics-design/construct-identity-and-objectives
  - id: antibody-design
    track_id: biologics-design
    lesson_id: biologics-design/antibody-peptide-design
    title: Antibody design
    title_zh: 抗体设计
    learning_objective: Connect antibody sequence and structural choices to epitope, specificity, developability, and validation plans.
    learning_objective_zh: 将抗体序列和结构选择与表位、特异性、可开发性和验证计划关联起来。
    layer: research
    prerequisites: [modality-and-construct-selection]
    historical_topic_ids: [t13-sequence-structure-function-objective]
  - id: peptide-design
    track_id: biologics-design
    lesson_id: biologics-design/antibody-peptide-design
    title: Peptide design
    title_zh: 多肽设计
    learning_objective: Define peptide sequence and conformational objectives together with stability and delivery constraints.
    learning_objective_zh: 将多肽序列和构象目标与稳定性和递送约束共同定义。
    layer: research
    prerequisites: [modality-and-construct-selection]
    historical_topic_ids: [t13-sequence-structure-function-objective]
  - id: nucleic-acid-therapeutics
    track_id: biologics-design
    lesson_id: biologics-design/nucleic-acids-conjugates-degraders
    title: Nucleic acid therapeutics
    title_zh: 核酸治疗
    learning_objective: Relate nucleic-acid modality, target biology, delivery, and off-target risks to a validation plan.
    learning_objective_zh: 将核酸模态、靶点生物学、递送和脱靶风险与验证计划关联起来。
    layer: research
    prerequisites: [modality-and-construct-selection]
    historical_topic_ids: [t13-biologic-modality-construct]
  - id: adc-and-degrader-modalities
    track_id: biologics-design
    lesson_id: biologics-design/nucleic-acids-conjugates-degraders
    title: ADC and degrader modalities
    title_zh: ADC 与降解剂模态
    learning_objective: Distinguish target engagement, linker or recruiter choices, exposure, and mechanism evidence for conjugates and degraders.
    learning_objective_zh: 区分偶联物和降解剂的靶点结合、连接子或招募子选择、暴露和机制证据。
    layer: research
    prerequisites: [modality-and-construct-selection]
    historical_topic_ids: [t13-biologic-modality-construct]
  - id: specificity-and-negative-selection
    track_id: biologics-design
    lesson_id: biologics-design/specificity-and-negative-selection
    title: Specificity and negative selection
    title_zh: 特异性与负向筛选
    learning_objective: Design positive and negative selection conditions that test specificity rather than a generic activity score.
    learning_objective_zh: 设计检验特异性而非通用活性评分的正向和负向筛选条件。
    layer: core
    prerequisites: [antibody-design]
    historical_topic_ids: [t13-specificity-negative-selection]
  - id: developability-and-manufacturability
    track_id: biologics-design
    lesson_id: biologics-design/developability-and-validation
    title: Developability and manufacturability
    title_zh: 可开发性与可制造性
    learning_objective: Evaluate expression, stability, aggregation, formulation, and manufacturing constraints alongside functional design.
    learning_objective_zh: 将表达、稳定性、聚集、制剂和制造约束与功能设计一同评估。
    layer: core
    prerequisites: [modality-and-construct-selection]
    historical_topic_ids: [t13-expression-developability-manufacturability]
  - id: functional-validation-design
    track_id: biologics-design
    lesson_id: biologics-design/developability-and-validation
    title: Functional validation design
    title_zh: 功能验证设计
    learning_objective: Plan functional validation that distinguishes intended activity, context dependence, and safety-relevant alternatives.
    learning_objective_zh: 规划可区分预期活性、语境依赖性和安全相关替代解释的功能验证。
    layer: practice
    prerequisites:
      [specificity-and-negative-selection, developability-and-manufacturability]
    historical_topic_ids: [t13-functional-validation]

  - id: reaction-record-and-condition-contract
    track_id: synthesis-and-automation
    title: Reaction record and condition contract
    title_zh: 反应记录与条件契约
    learning_objective: Define reactants, products, conditions, yields, provenance, and missing fields for a reaction record.
    learning_objective_zh: 为反应记录定义反应物、产物、条件、产率、来源和缺失字段。
    layer: core
    prerequisites: [data-contract-assembly]
    historical_topic_ids: [t14-reaction-record-condition-unit]
    lesson_id: synthesis-and-automation/reaction-to-lab
  - id: atom-mapping-and-reaction-classes
    track_id: synthesis-and-automation
    lesson_id: synthesis-and-automation/reaction-mapping-and-route-search
    title: Atom mapping and reaction classes
    title_zh: 原子映射与反应类别
    learning_objective: Inspect atom mappings and reaction classes as hypotheses with known representation errors.
    learning_objective_zh: 将原子映射和反应类别作为具有已知表示误差的假设来检查。
    layer: research
    prerequisites: [reaction-record-and-condition-contract]
    historical_topic_ids: [t14-atom-mapping-transformation-class]
  - id: retrosynthetic-disconnection
    track_id: synthesis-and-automation
    lesson_id: synthesis-and-automation/reaction-mapping-and-route-search
    title: Retrosynthetic disconnection
    title_zh: 逆合成断键
    learning_objective: Propose and compare disconnections while preserving route assumptions and unavailable precursors.
    learning_objective_zh: 提出并比较断键策略，同时保留路线假设和不可得前体。
    layer: core
    prerequisites: [atom-mapping-and-reaction-classes]
    historical_topic_ids: [t14-retrosynthetic-disconnection]
  - id: chemoselectivity-and-protecting-groups
    track_id: synthesis-and-automation
    lesson_id: synthesis-and-automation/reaction-mapping-and-route-search
    title: Chemoselectivity and protecting groups
    title_zh: 化学选择性与保护基
    learning_objective: Identify chemoselectivity and protecting-group constraints that a retrosynthetic graph can hide.
    learning_objective_zh: 识别逆合成图可能隐藏的化学选择性和保护基约束。
    layer: research
    prerequisites: [retrosynthetic-disconnection]
    historical_topic_ids: [t14-retrosynthetic-disconnection]
  - id: route-feasibility-material-and-safety
    track_id: synthesis-and-automation
    lesson_id: synthesis-and-automation/route-feasibility-and-feedback
    title: Route feasibility material and safety
    title_zh: 路线可行性、原料与安全
    learning_objective: Assess material availability, route length, safety, and operational constraints before selecting a synthesis plan.
    learning_objective_zh: 在选择合成计划前评估原料可得性、路线长度、安全性和操作约束。
    layer: core
    prerequisites: [retrosynthetic-disconnection]
    historical_topic_ids: [t14-route-feasibility-material-safety]
  - id: forward-reaction-and-lab-feedback
    track_id: synthesis-and-automation
    lesson_id: synthesis-and-automation/route-feasibility-and-feedback
    title: Forward reaction and lab feedback
    title_zh: 正向反应与实验反馈
    learning_objective: Compare predicted reaction conditions with laboratory observations and use failures to revise a route.
    learning_objective_zh: 将预测反应条件与实验室观察比较，并利用失败修订路线。
    layer: practice
    prerequisites: [route-feasibility-material-and-safety]
    historical_topic_ids: [t14-forward-reaction-lab-feedback]

  - id: dmta-decision-loop
    track_id: active-learning
    title: DMTA decision loop
    title_zh: DMTA 决策循环
    learning_objective: Define the design make test analyze loop, its evidence inputs, and its next experimental decision.
    learning_objective_zh: 定义设计、制备、测试、分析循环及其证据输入和下一项实验决策。
    layer: core
    prerequisites: [target-product-profile-design]
    historical_topic_ids: [t15-experiment-pool-budget-feasibility]
    lesson_id: active-learning/dmta-loops
  - id: experiment-pools-and-budgeting
    track_id: active-learning
    title: Experiment pools and budgeting
    title_zh: 实验池与预算
    learning_objective: Construct a feasible experiment pool with budget, capacity, timing, and exclusion constraints.
    learning_objective_zh: 构建具有预算、容量、时间和排除约束的可行实验池。
    layer: core
    prerequisites: [dmta-decision-loop]
    historical_topic_ids: [t15-experiment-pool-budget-feasibility]
    lesson_id: active-learning/experiment-pools-and-budgets
  - id: acquisition-functions-and-uncertainty
    track_id: active-learning
    lesson_id: active-learning/acquisition-delays-and-stopping
    title: Acquisition functions and uncertainty
    title_zh: 采集函数与不确定性
    learning_objective: Compare exploitation, exploration, uncertainty, and calibration assumptions in an acquisition policy.
    learning_objective_zh: 比较采集策略中的利用、探索、不确定性和校准假设。
    layer: research
    prerequisites:
      [experiment-pools-and-budgeting, calibrated-predictive-uncertainty]
    historical_topic_ids: [t15-acquisition-policy-uncertainty]
  - id: batch-diversity-and-pareto-allocation
    track_id: active-learning
    title: Batch diversity and Pareto allocation
    title_zh: 批次多样性与 Pareto 分配
    learning_objective: Allocate a batch across diversity and multiple objectives under a stated selection rule.
    learning_objective_zh: 在明确选择规则下，在多样性和多个目标之间分配一个批次。
    layer: practice
    prerequisites: [acquisition-functions-and-uncertainty]
    historical_topic_ids: [t15-batch-diversity-multiobjective-allocation]
    lesson_id: active-learning/diversity-uncertainty-feedback
  - id: time-ordered-feedback-updates
    track_id: active-learning
    lesson_id: active-learning/acquisition-delays-and-stopping
    title: Time ordered feedback updates
    title_zh: 时间有序反馈更新
    learning_objective: Update a decision state with delayed experimental outcomes without leaking future observations.
    learning_objective_zh: 使用延迟实验结果更新决策状态，而不泄漏未来观察。
    layer: research
    prerequisites: [batch-diversity-and-pareto-allocation]
    historical_topic_ids: [t15-time-ordered-feedback-update]
  - id: stopping-rules-and-policy-evaluation
    track_id: active-learning
    lesson_id: active-learning/acquisition-delays-and-stopping
    title: Stopping rules and policy evaluation
    title_zh: 停止规则与策略评估
    learning_objective: Predeclare stopping rules and evaluate an experiment-selection policy against opportunity cost.
    learning_objective_zh: 预先声明停止规则，并根据机会成本评估实验选择策略。
    layer: practice
    prerequisites: [time-ordered-feedback-updates]
    historical_topic_ids: [t15-stopping-rule-policy-evaluation]

  - id: scientific-task-and-authority-boundaries
    track_id: scientific-agents
    title: Scientific task and authority boundaries
    title_zh: 科学任务与权限边界
    learning_objective: Define a bounded scientific task, permitted actions, unresolved decisions, and human authority.
    learning_objective_zh: 定义受限科学任务、允许行动、未解决决策和人工权限。
    layer: core
    prerequisites: [aidd-decision-framing]
    historical_topic_ids: [t16-scientific-task-action-boundary]
    lesson_id: scientific-agents/agents-and-tools
  - id: retrieval-augmented-generation
    track_id: scientific-agents
    title: Retrieval augmented generation
    title_zh: 检索增强生成
    learning_objective: Separate retrieved context, source scope, and model generation from a verified scientific conclusion.
    learning_objective_zh: 将检索语境、来源范围和模型生成与已验证科学结论区分开来。
    layer: core
    prerequisites: [source-scope-review]
    historical_topic_ids: [t16-source-retrieval-evidence-grounding]
    lesson_id: scientific-agents/retrieval-tools-feedback
  - id: tool-input-output-contracts
    track_id: scientific-agents
    title: Tool input output contracts
    title_zh: 工具输入输出契约
    learning_objective: Specify typed inputs, outputs, failure states, and validation rules for a scientific tool call.
    learning_objective_zh: 为科学工具调用定义类型化输入、输出、失败状态和验证规则。
    layer: core
    prerequisites: [data-contract-assembly]
    historical_topic_ids: [t16-tool-input-output-contract]
    lesson_id: scientific-agents/retrieval-tools-feedback
  - id: agent-planning
    track_id: scientific-agents
    title: Agent planning
    title_zh: 智能体规划
    learning_objective: Compare a fixed pipeline with an adaptive plan while keeping task boundaries and stop conditions explicit.
    learning_objective_zh: 比较固定流程与自适应计划，同时保持任务边界和停止条件明确。
    layer: research
    prerequisites:
      [scientific-task-and-authority-boundaries, tool-input-output-contracts]
    historical_topic_ids: [t16-scientific-task-action-boundary]
    lesson_id: scientific-agents/retrieval-tools-feedback
  - id: execution-trace-and-state-recovery
    track_id: scientific-agents
    title: Execution trace and state recovery
    title_zh: 执行轨迹与状态恢复
    learning_objective: Inspect a tool trace to recover inputs, outputs, state changes, and unobserved failures.
    learning_objective_zh: 检查工具轨迹以恢复输入、输出、状态变化和未观察到的失败。
    layer: practice
    prerequisites: [tool-input-output-contracts]
    historical_topic_ids: [t16-trace-recovery]
    lesson_id: scientific-agents/retrieval-tools-feedback
  - id: verifiers-and-human-review
    track_id: scientific-agents
    title: Verifiers and human review
    title_zh: 验证器与人工审查
    learning_objective: State what a verifier can check and which scientific, safety, or authority decisions require human review.
    learning_objective_zh: 说明验证器能够检查的内容，以及哪些科学、安全或权限决策需要人工审查。
    layer: core
    prerequisites:
      [
        scientific-task-and-authority-boundaries,
        execution-trace-and-state-recovery,
      ]
    historical_topic_ids: [t16-human-review-authority-evaluation]
    lesson_id: scientific-agents/retrieval-tools-feedback
  - id: tool-to-experiment-boundaries
    track_id: scientific-agents
    lesson_id: scientific-agents/retrieval-tools-feedback
    title: Tool to experiment boundaries
    title_zh: 工具到实验的边界
    learning_objective: Distinguish a tool call, a simulated observation, and a wet experiment with its own authority and evidence.
    learning_objective_zh: 区分工具调用、模拟观察和具有自身权限与证据的湿实验。
    layer: research
    prerequisites: [verifiers-and-human-review]
    historical_topic_ids: [t16-scientific-task-action-boundary]

  - id: generalization-unit-and-estimand
    track_id: evaluation-and-reproducibility
    title: Generalization unit and estimand
    title_zh: 泛化单位与估计量
    learning_objective: Define the independent unit and target population to which a result is intended to generalize.
    learning_objective_zh: 定义结果意图泛化到的独立单位和目标人群。
    layer: core
    prerequisites: [endpoint-and-loss-design]
    historical_topic_ids: [t17-generalization-unit]
    lesson_id: evaluation-and-reproducibility/honest-evaluation
  - id: split-construction-and-leakage-audit
    track_id: evaluation-and-reproducibility
    title: Split construction and leakage audit
    title_zh: 划分构建与泄漏审查
    learning_objective: Construct and audit splits for entity, time, group, and preprocessing leakage.
    learning_objective_zh: 针对实体、时间、分组和预处理泄漏构建并审查数据划分。
    layer: core
    prerequisites: [generalization-unit-and-estimand]
    historical_topic_ids: [t17-split-leakage-audit]
    lesson_id: evaluation-and-reproducibility/split-and-leakage-cases
  - id: baseline-recipe-parity
    track_id: evaluation-and-reproducibility
    title: Baseline recipe parity
    title_zh: 基线配方一致性
    learning_objective: Compare baseline data, representation, selection rule, and compute recipe before interpreting a reported margin.
    learning_objective_zh: 在解读报告的优势前比较基线的数据、表示、选择规则和计算配方。
    layer: core
    prerequisites: [ridge-fitting-and-validation-selection]
    historical_topic_ids: [t17-baseline-model-selection-protocol]
    lesson_id: evaluation-and-reproducibility/assay-shift-diagnosis
  - id: selection-locks-and-test-isolation
    track_id: evaluation-and-reproducibility
    lesson_id: evaluation-and-reproducibility/split-and-leakage-cases
    title: Selection locks and test isolation
    title_zh: 选择锁定与测试集隔离
    learning_objective: Keep model selection, threshold choices, and test interpretation isolated under a frozen protocol.
    learning_objective_zh: 在冻结协议下保持模型选择、阈值选择和测试集解释彼此隔离。
    layer: practice
    prerequisites: [baseline-recipe-parity]
    historical_topic_ids: [t17-baseline-model-selection-protocol]
  - id: metric-estimand-and-uncertainty
    track_id: evaluation-and-reproducibility
    title: Metric estimand and uncertainty
    title_zh: 指标估计量与不确定性
    learning_objective: Match a metric and uncertainty interval to the endpoint, independent unit, and decision.
    learning_objective_zh: 将指标和不确定性区间与终点、独立单位和决策相匹配。
    layer: core
    prerequisites: [generalization-unit-and-estimand]
    historical_topic_ids: [t17-metric-endpoint-uncertainty]
    lesson_id: evaluation-and-reproducibility/metrics-and-uncertainty
  - id: ood-shift-and-transportability
    track_id: evaluation-and-reproducibility
    title: OOD shift and transportability
    title_zh: 分布外变化与可迁移性
    learning_objective: Specify the distribution shift and assumptions required to transport a result beyond observed data.
    learning_objective_zh: 明确将结果迁移到观察数据之外所需的分布变化和假设。
    layer: research
    prerequisites:
      [split-construction-and-leakage-audit, metric-estimand-and-uncertainty]
    historical_topic_ids: [t17-ood-transportability]
    lesson_id: evaluation-and-reproducibility/assay-shift-diagnosis
  - id: reproduction-scope-and-limitations
    track_id: evaluation-and-reproducibility
    lesson_id: evaluation-and-reproducibility/assay-shift-diagnosis
    title: Reproduction scope and limitations
    title_zh: 复现范围与局限
    learning_objective: State the inputs, protocol scope, observed outputs, and limitations of a reproduction attempt.
    learning_objective_zh: 陈述复现尝试的输入、协议范围、观察到的输出和局限。
    layer: practice
    prerequisites: [baseline-recipe-parity, metric-estimand-and-uncertainty]
    historical_topic_ids: [t17-reproduction-reporting-receipt]

  - id: evidence-package-assembly
    track_id: candidate-nomination
    title: Evidence package assembly
    title_zh: 证据包组装
    learning_objective: Assemble target, screening, ADMET, and evaluation evidence while retaining conflicts and unknowns.
    learning_objective_zh: 组装靶点、筛选、ADMET 和评估证据，同时保留冲突和未知。
    layer: core
    prerequisites:
      [
        target-tractability-and-risk,
        multi-parameter-admet-optimization,
        virtual-screening-and-repurposing-transfer,
        metric-estimand-and-uncertainty,
      ]
    historical_topic_ids: [t18-evidence-package-claim-chain]
    lesson_id: candidate-nomination/capstone
  - id: cross-domain-tradeoffs
    track_id: candidate-nomination
    lesson_id: candidate-nomination/capstone-workbook
    title: Cross-domain tradeoffs
    title_zh: 跨领域权衡
    learning_objective: Compare efficacy, safety, exposure, synthetic feasibility, and evidence gaps against the product profile.
    learning_objective_zh: 根据产品概况比较疗效、安全性、暴露、合成可行性和证据缺口。
    layer: core
    prerequisites: [evidence-package-assembly]
    historical_topic_ids: [t18-crossdomain-tradeoff-decision]
  - id: counterevidence-led-failure-analysis
    track_id: candidate-nomination
    title: Counterevidence led failure analysis
    title_zh: 由反证驱动的失败分析
    learning_objective: Preserve counterevidence and diagnose failure modes before promoting a candidate claim.
    learning_objective_zh: 在提升候选项主张前保留反证并诊断失败模式。
    layer: research
    prerequisites:
      [evidence-package-assembly, mechanism-hypothesis-and-counterevidence]
    historical_topic_ids: [t18-counterevidence-failure-analysis]
    lesson_id: candidate-nomination/capstone
  - id: nomination-readiness
    track_id: candidate-nomination
    title: Nomination readiness
    title_zh: 提名准备度
    learning_objective: Decide whether a candidate is ready for a bounded next experiment and state the evidence gap.
    learning_objective_zh: 判断候选项是否准备好进入受限的下一项实验，并说明证据缺口。
    layer: practice
    prerequisites:
      [cross-domain-tradeoffs, counterevidence-led-failure-analysis]
    historical_topic_ids: [t18-nomination-readiness-next-experiment]
    lesson_id: candidate-nomination/capstone
  - id: next-experiment-design
    track_id: candidate-nomination
    title: Next experiment design
    title_zh: 下一项实验设计
    learning_objective: Specify the next experiment, its control, expected decision update, and observation that would change course.
    learning_objective_zh: 明确下一项实验、其对照、预期决策更新和会改变方向的观察。
    layer: practice
    prerequisites: [nomination-readiness]
    historical_topic_ids: [t18-nomination-readiness-next-experiment]
    lesson_id: candidate-nomination/evidence-to-validation
  - id: governance-and-dual-use-boundaries
    track_id: candidate-nomination
    lesson_id: candidate-nomination/capstone-workbook
    title: Governance and dual-use boundaries
    title_zh: 治理与双重用途边界
    learning_objective: Identify openness, biosecurity, governance, and authority boundaries that require scoped human review.
    learning_objective_zh: 识别需要范围化人工审查的开放性、生物安全、治理和权限边界。
    layer: research
    prerequisites:
      [
        nomination-readiness,
        verifiers-and-human-review,
        licence-and-permitted-use,
      ]
    historical_topic_ids: [t18-openness-biosecurity-governance-boundary]
