rubric: Choose the deepest state the material demonstrably reaches for the topic as the taxonomy describes it, reading the passage rather than a title or link, and choose the shallower state when the evidence is ambiguous. 'executable' needs a runnable task in the repository about this topic with declared inputs and outputs. 'assessed' needs an exercise with a worked answer, rubric or verification target about this topic and does not require anything runnable. Every executable or assessed reading states whether its runnable task rests on real data, on authored inputs, or on nothing runnable.
ordinal_mapping: This audit scores depth ordinally, so a recorded 'assessed' also claims 'executable'. A reading of 'assessed' with nothing runnable is therefore compared as 'worked'. The reviewer's 'public-data' basis is recorded here as 'real-data'.
not_evidence_of: This is an automated second reading of teaching depth. It is not reader evidence, not a human expert review, and not a measure of learning. The first three batches had no Python environment, so notes that local execution failed because RDKit was unavailable describe the sandbox. It also excluded the scripts directory, so the note that an advertised checker script is missing describes the sandbox, not the repository, where the script is published.
