coverage:
  - topic_id: t03-training-validation-selection
    depth: executable
    run_basis: unverified
    evidence: [splitters-tutorial]
    reviewed_scope: Working With Splitters notebook
    note: The notebook provides a runnable Colab workflow for selecting and applying dataset splitters.
  - topic_id: t07-property-task-split-design
    depth: executable
    run_basis: unverified
    evidence: [splitters-tutorial]
    reviewed_scope: Random, scaffold, and fingerprint split explanations, code, and outputs
    note: The notebook compares several molecular split mechanisms on a defined dataset.
  - topic_id: t17-split-leakage-audit
    depth: worked
    evidence: [splitters-tutorial]
    reviewed_scope: Splitter rationale and molecular partition examples
    note: The notebook demonstrates how similarity-aware partitions change evaluation, but it is not treated as proof that every leakage route is closed.
  - topic_id: t09-binding-mode-pose-hypothesis
    depth: executable
    run_basis: real-data
    evidence: [protein-ligand-tutorial]
    reviewed_scope: Protein-ligand interaction notebook complex inputs, docking, and outputs
    note: The notebook constructs protein-ligand inputs and executes a defined docking workflow.
  - topic_id: t09-affinity-ranking
    depth: executable
    run_basis: unverified
    evidence: [protein-ligand-tutorial]
    reviewed_scope: Protein-ligand affinity fitting and held-out predictions
    note: The notebook trains an interaction model and reports predictions for held-out examples.
  - topic_id: t12-candidate-design-space
    depth: executable
    run_basis: unverified
    evidence: [molgan-tutorial]
    reviewed_scope: MolGAN molecular graph generation notebook
    note: The notebook supplies a runnable Colab route for a bounded graph-based molecular-generation task.
  - topic_id: t05-omics-perturbation-representation
    depth: executable
    run_basis: unverified
    evidence: [single-cell-notebook]
    reviewed_scope: A tutorial running an scvi-tools workflow over an AnnData single-cell object, learning a probabilistic latent representation of cells from counts downstream of quality-control preprocessing, with the package positioned beside Scanpy for the surrounding analysis
    note: The cell is the modelled unit and the representation is inferred rather than hand-built. The tutorial states that it sits downstream of quality control and adapts an upstream package tutorial, so the preprocessing decisions are inherited rather than taught here.
  - topic_id: t13-biologic-modality-construct
    depth: worked
    evidence: [adc-notebook]
    reviewed_scope: A tutorial defining an antibody-drug conjugate as a monoclonal antibody joined to a cytotoxic payload through a chemical linker, with sections on design and optimisation and on computational approaches, and runnable cells using cheminformatics and structure viewers
    note: The construct is defined by its three parts and the function each serves, which is the topic. The expression system is not addressed and the runnable cells inspect components rather than assemble a construct.
  - topic_id: t13-expression-developability-manufacturability
    depth: explained
    evidence: [adc-notebook]
    reviewed_scope: The same tutorial treating the drug-to-antibody ratio as a property that governs design and optimisation of the conjugate
    note: One developability quantity is explained as a design variable. Stability, aggregation, immunogenicity and manufacturing route are not addressed.
