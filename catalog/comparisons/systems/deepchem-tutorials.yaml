caveats:
  - The tutorial directory lists more than fifty notebooks, spanning areas no other provider in this set covers, including antibodies, antibody-drug conjugates, PROTACs, single-cell omics, protein language models, binding-site druggability, quantum chemistry, materials and polymers. Eight have been reviewed, so this record substantially understates the provider and omitted topics stay unverified rather than absent.
  - The two notebooks read on 2026-09-10 carry substantial explanatory prose, unlike the code-only companion repositories elsewhere in this set, but neither contains an exercise, so neither is scored at assessed.
  - Tutorial notebooks retrieve or rely on external datasets such as PDBbind and Tox21; no blanket data licence or redistribution claim is made.
  - No separate solution or formal assessment surface was verified, and the notebooks were inspected but not executed during this audit.
last_verified: 2026-09-11
