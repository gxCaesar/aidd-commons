caveats:
  - The entire public surface is a proposal. The landing page describes a planned book with a tentative table of contents and a tentative 2023 release, and the repository behind it contains no chapter. Every cell in this record is therefore capped at 'mentioned', which is a statement about what has been published rather than about what the authors know.
  - Absence is deliberately not recorded against this provider. A table of contents that omits a topic is not evidence that an unwritten book would omit it, so omitted topics stay 'unverified'.
  - The public page labels its table of contents tentative; no chapter body, notebook, dataset, assessment, solution, or licence surface was opened.
  - Topic states are limited to mentioned, and public page availability is not treated as evidence that the textbook itself is freely accessible.
