    access: opened
    reviewed_on: 2026-09-11
  - id: quick-start
    url: https://tdcommons.ai/start/
    title: Therapeutics Data Commons Quick Start
    observed_scope: Therapeutic scope, problem-task-dataset hierarchy, data-loader example, split outputs, processors, metrics, oracles, and benchmark groups.
    access: opened
    reviewed_on: 2026-09-04
  - id: official-repository
    url: https://github.com/mims-harvard/TDC
    title: Therapeutics Data Commons official repository
    observed_scope: Public code repository, tutorials, data loaders, data functions, splits, evaluators, installation, and project scope.
    access: opened
    reviewed_on: 2026-09-04
  - id: repository-license
    url: https://github.com/mims-harvard/TDC/blob/main/LICENSE
    title: Therapeutics Data Commons repository licence
    observed_scope: MIT terms for repository software and associated documentation.
    access: opened
    reviewed_on: 2026-09-04
  - id: repository-readme
    url: https://raw.githubusercontent.com/mims-harvard/TDC/master/README.md
    title: Therapeutics Data Commons repository README
    observed_scope: Read in full on 2026-09-10. The three-tier problem, task and dataset organisation, splits returned by a call taking method, seed and fractions with a scaffold option, a named metric evaluator, more than ten named generation oracles for goal-oriented and distribution learning, benchmark groups with split type and seed, and leaderboard submission.
    access: opened
    reviewed_on: 2026-09-10
caveats:
  - This pass read the repository README only. The tutorial notebooks, including the oracle tutorial, were not opened, so states here rest on documented interfaces rather than on an executed example. Omitted topics stay unverified rather than absent.
  - Public retrieval through TDC does not establish a uniform licence, redistribution right, or unrestricted commercial-use status for every upstream dataset.
  - Individual dataset pages, leaderboard submissions, and task-specific uncertainty protocols were outside this review scope.
last_verified: 2026-09-11
