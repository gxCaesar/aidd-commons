evidence:
  - id: school-lectures
    url: https://aidd.ochem.eu/lectures
    title: AIDD school agendas and lecture slide index
    observed_scope: The Lectures page read in full, carrying published agendas for the First school at Helmholtz Munich, the Second at Lugano, the Third at Leuven, the Fourth at Aalto, the Fifth at Gothenburg and the Final school at Berlin, together with 109 links to downloadable lecture slide decks and workshop materials. Lecture titles and speakers were observed. No slide deck was opened, because the files are served from the ai-dd.eu domain behind a bot challenge that refused retrieval from this environment.
    access: opened
    reviewed_on: 2026-09-11
  - id: site-navigation
    url: https://aidd.ochem.eu/lectures
    title: AIDD project site navigation and lectures feed
    observed_scope: The complete public navigation reviewed on 2026-09-11, being Home, Partners, Fellows, Articles, Lectures, News, Newsletters, Contact, AIDD Workshop, Conferences and Presentations. There is no course, module, lesson or notebook page. The Lectures page is a reverse-chronological feed of talk and workshop announcements with dates and speaker names, not learning material.
    access: opened
    reviewed_on: 2026-09-11
  - id: official-about
    url: https://aidd.ochem.eu/
    title: Advanced Machine Learning for Innovative Drug Discovery — About
    observed_scope: Project goal, doctoral training context, research-topic breadth, courses and schools, open-source intent, and official GitHub link.
    access: opened
    reviewed_on: 2026-09-04
  - id: official-github
    url: https://github.com/aidd-msca
    title: AIDD Marie Skłodowska-Curie Action GitHub organization
    observed_scope: Public organization identity and visible public software repositories; individual repository terms were not generalized to the network.
    access: opened
    reviewed_on: 2026-09-04
caveats:
  - The reviewed About page names a structured curriculum, online courses, and six schools but does not expose item-level course content for a deeper topic audit.
  - A review on 2026-09-11 concluded from the first screen of the Lectures page that no course material was published anywhere on this site. That conclusion was wrong and is corrected here. Reading the page in full found published agendas for all six AIDD schools and 109 downloadable lecture slide decks and workshop materials. The error came from stopping partway down a long page, and the earlier eligibility question it raised is withdrawn.
  - The slide decks are served from the ai-dd.eu domain behind a bot challenge that refused retrieval from this environment, so lecture titles and speakers were observed but no deck was opened. Every school-lecture cell is therefore scored 'mentioned' as a limit of this review's reach, not as an observation about the depth of the material. A reviewer able to open the decks should expect to raise these scores rather than confirm them.
  - The GitHub organisation aidd-msca was reviewed on 2026-09-11 and holds 26 repositories, which are publication-accompanying research code plus one pip-installable library. It is not course material and no topic is scored from it.
  - The project states an open-source software commitment, but no single network-wide software or content licence was verified; individual repositories have separate terms.
last_verified: 2026-09-11
