id: build-ai-drug-discovery-pipelines
name: Build AI Drug Discovery Pipelines
provider_class: curriculum
canonical_url: https://github.com/nrflynn2/ml-drug-discovery
summary: A code-and-data companion repository for a commercial book, with runnable chapter notebooks spanning cheminformatics, machine learning, structure, generation, DTI, and active learning.
audiences: [learners]
languages: [en]
metadata_evidence: [project-readme]
access:
  content: { value: mixed, evidence: [project-readme] }
  code: { value: open, evidence: [project-readme] }
  data: { value: open, evidence: [project-readme] }
  solutions: { value: unverified }
licenses:
  - name: Apache License 2.0
    scope: Public repository code and notebooks; companion-book prose, repository data, and external assets require separate review
    evidence: [project-readme, repository-license]
correction_url: https://github.com/nrflynn2/ml-drug-discovery/issues
correction_evidence: [project-readme]
coverage_default:
  depth: unverified
  evidence: []
  reviewed_scope: No topic-specific evidence was encoded for omitted taxonomy topics in this dated review.
  note: Omitted topics remain unverified and must not be treated as absent.
coverage:
  - topic_id: t07-regression-formulation
    depth: executable
    run_basis: unverified
    evidence: [solubility-notebook]
    reviewed_scope: Chapter 4 solubility notebook
    note: The notebook supplies a runnable linear-model property workflow with declared splits and outputs.
  - topic_id: t07-property-task-split-design
    depth: executable
    run_basis: unverified
    evidence: [solubility-notebook]
    reviewed_scope: Chapter 4 train, validation, test, and scaffold-split assets
    note: The notebook uses a defined scaffold-aware partition in a runnable property task.
  - topic_id: t07-classification-formulation
    depth: executable
    run_basis: unverified
    evidence: [cyp-notebook]
    reviewed_scope: Chapter 5 CYP inhibition classification notebook
    note: The notebook implements a defined classification task with code and outputs.
  - topic_id: t07-calibration
    depth: executable
    run_basis: unverified
    evidence: [cyp-notebook]
    reviewed_scope: Chapter 5 model-calibration workflow
    note: The notebook includes an executable calibration section for the classification case.
  - topic_id: t08-metabolism-ddi-risk
    depth: executable
    run_basis: unverified
    evidence: [cyp-notebook]
    reviewed_scope: Chapter 5 cytochrome P450 inhibition case
    note: The notebook uses a CYP inhibition endpoint in a runnable metabolism and interaction-risk modelling case.
  - topic_id: t11-docking-scoring-protocol
    depth: executable
    run_basis: real-data
    evidence: [active-structure-notebook]
    reviewed_scope: Chapter 9 structure-based design and docking workflow
    note: The notebook provides a runnable docking stack and iterative scoring workflow; its free-energy section has no accompanying code.
  - topic_id: t15-experiment-pool-budget-feasibility
    depth: executable
    run_basis: real-data
    evidence: [active-structure-notebook]
    reviewed_scope: Chapter 9 candidate pool, budget, docking, and active-learning loop
    note: The notebook defines a finite selection setting with iterative outputs.
  - topic_id: t15-acquisition-policy-uncertainty
    depth: executable
    run_basis: unverified
    evidence: [active-structure-notebook, ch09-local-read]
    reviewed_scope: Chapter 9 four acquisition functions, greedy, expected improvement, probability of improvement and uncertainty, with predictive uncertainty estimated by keeping dropout active at inference and averaging 100 Monte Carlo passes over the pool, and a Gaussian-process surrogate available as an alternative
    note: Uncertainty is computed rather than assumed, and the helper restores the model's training mode in a finally block so a later prediction cannot silently sample dropout. The 2026-09-04 review recorded only that a bounded loop existed.
  - topic_id: t15-time-ordered-feedback-update
    depth: executable
    run_basis: unverified
    evidence: [active-structure-notebook]
    reviewed_scope: Chapter 9 iterative update workflow
    note: The notebook carries selected observations forward through ordered active-learning rounds.
  - topic_id: t05-complex-interaction-representation
    depth: executable
    run_basis: unverified
    evidence: [dti-notebook]
    reviewed_scope: Chapter 11 dual-graph drug-target affinity notebook
    note: The notebook constructs paired molecular and target inputs for a runnable affinity task.
  - topic_id: t09-affinity-ranking
    depth: executable
    run_basis: unverified
    evidence: [dti-notebook]
    reviewed_scope: Chapter 11 drug-target affinity workflow
    note: The notebook fits and evaluates a defined drug-target affinity model.
  - topic_id: t12-candidate-design-space
    depth: executable
    run_basis: real-data
    evidence: [generative-notebook]
    reviewed_scope: Chapter 10 character-level autoencoder and variational autoencoder trained on 1,584,663 MOSES molecules to give a continuous, samplable latent space, with a SmilesPE tokenizer vocabulary and reconstruction accuracy as the stated metric
    note: The design space is constructed rather than enumerated, and the chapter states that a deterministic autoencoder fails to generate valid molecules, which is why the variational model is used. The 2026-09-04 review had only the chapter inventory.
  - topic_id: t12-validity-novelty-synthetic-screen
    depth: executable
    run_basis: unverified
    evidence: [generative-notebook, unsupervised-notebook]
    reviewed_scope: Chapter 10 stating that deterministic autoencoders fail to produce valid molecules, which drives the choice of a variational model; Chapter 7 kernel density estimation used for novelty detection and occupancy analysis alongside combinatorial and retrosynthetic library design
    note: Validity and novelty are treated as separate checks and novelty is computed rather than asserted. This review did not observe memorisation or synthesizability scored as their own quantities.
  - topic_id: t05-protein-sequence-structure-representation
    depth: executable
    run_basis: real-data
    evidence: [protein-transformer-readme]
    reviewed_scope: Chapter 12 supplying a protein language model trained by masked-token prediction, a Transformer antibody classifier and ESM-2 mutation scoring, with training, evaluation and tuning scripts, B-cell receptor parquet datasets and three notebooks
    note: The representations are sequence-level. Despite the chapter title naming structure prediction, the released code produces language-model embeddings, a classifier and mutation scores rather than structures, so no structural representation is credited here.
  - topic_id: t10-complex-cofolding-hypothesis
    depth: executable
    run_basis: real-data
    evidence: [multimodal-notebook]
    reviewed_scope: Chapter 13 calling a co-folding affinity model per ligand and a diffusion pose predictor returning twenty ranked poses, then comparing recovered poses against the chain A co-crystal by root-mean-square deviation
    note: The complex hypothesis is generated and then checked against an experimental structure. The chapter states that pose confidence is an unbounded logit and not an affinity estimate, so the two outputs are not conflated.
  - topic_id: t09-binding-mode-pose-hypothesis
    depth: executable
    run_basis: real-data
    evidence: [multimodal-notebook]
    reviewed_scope: Chapter 13 twenty poses per ligand ranked by confidence, with pose confidence correlating at -0.245 against measured potency while predicted affinity correlates at 0.80
    note: The measured contrast is the teaching content, since it shows a pose score failing to track potency while an affinity head tracks it.
  - topic_id: t09-binder-classification
    depth: executable
    run_basis: unverified
    evidence: [multimodal-notebook]
    reviewed_scope: Chapter 13 gating on a binary binder probability at 0.5 before any potency value is read, with four compounds near the threshold whose gate decision flips between replicates
    note: The gate is declared before the continuous estimate is used, and its instability near the threshold is reported rather than smoothed.
  - topic_id: t09-screening-selection-repurposing-transfer
    depth: executable
    run_basis: real-data
    evidence: [unsupervised-notebook]
    reviewed_scope: Chapter 7 self-organising maps and UMAP over fingerprint similarity to surface repurposing candidates from a drug repurposing hub file, alongside a COVID Moonshot activity set of 2,062 compounds
    note: The transfer argument rests on structural similarity implying shared activity, which the chapter states rather than tests. No prospective or held-out confirmation of a repurposing candidate was observed.
  - topic_id: t12-multiobjective-search-diversity
    depth: worked
    evidence: [unsupervised-notebook]
    reviewed_scope: Chapter 7 clustering for library curation and diversity, dimensionality reduction by two methods, and combinatorial and retrosynthetic library design
    note: Diversity-aware selection is executed. This review observed no Pareto treatment and no reinforcement-learning comparison, so the topic is covered in part.
  - topic_id: t17-metric-endpoint-uncertainty
    depth: executable
    run_basis: unverified
    evidence: [multimodal-notebook]
    reviewed_scope: Chapter 13 bootstrap confidence intervals on the rank correlation, a replicate-stability measurement repeating one ligand three times, and stated range compression and per-target bias
    note: The uncertainty reported is over the correlation and over repeated calls to the same model, and the chapter names the systematic errors separately rather than folding them into the interval.
  - topic_id: t18-counterevidence-failure-analysis
    depth: executable
    run_basis: unverified
    evidence: [multimodal-notebook]
    reviewed_scope: Chapter 13 retaining a dimensionally incoherent response field with its systematic factor of 1.364, the statement that pose confidence is an unbounded logit rather than an affinity, one ligand falling below the gate, four ligands whose gate decision is unstable between replicates, and stated range compression and per-target bias
    note: The failures are kept in the executed notebook beside the result they qualify, which is what distinguishes this from a limitations paragraph.
  - topic_id: t18-nomination-readiness-next-experiment
    depth: worked
    evidence: [multimodal-notebook]
    reviewed_scope: Chapter 13 a predeclared gate under which a potency value is only read once a binder call passes, applied to two compound sets
    note: A go rule is declared before the numbers are read. This review observed no hold or stop rule and no named independent experiment for the next decision.
  - topic_id: t14-retrosynthetic-disconnection
    depth: mentioned
    evidence: [unsupervised-notebook]
    reviewed_scope: Chapter 7 retrosynthetic library design named alongside combinatorial design
    note: Retrosynthetic construction is used to build a library rather than taught as a comparison between disconnection strategies.
  - topic_id: t07-interpretability-sar
    depth: executable
    run_basis: real-data
    evidence: [rna-target-notebook]
    reviewed_scope: Chapter 6 gradient-boosted models over conformer-aware three-dimensional descriptors for HIV TAR RNA binders, interpreted with SHAP values and partial derivatives
    note: The explanation is computed on a fitted model rather than asserted from chemistry. This review observed no analogue-pair evidence and no statement that the attributions are not causal atom effects.
  - topic_id: t07-chemical-standardisation
    depth: executable
    run_basis: unverified
    evidence: [rna-target-notebook, ligand-filter-notebook]
    reviewed_scope: Chapter 6 protomer and tautomer enumeration before descriptor calculation, with multiple conformers generated, aligned and Boltzmann weighted; Chapter 2 by contrast loading molecules directly from a supplied file with ambiguous stereochemistry and valence warnings and no salt, charge or duplicate handling
    note: The ionisation and conformer treatment is executed where the endpoint needs it. The two chapters differ on whether standardisation happens at all, and this record credits the chapter that performs it.
  - topic_id: t08-safety-toxicity-endpoint
    depth: executable
    run_basis: real-data
    evidence: [herg-notebook]
    reviewed_scope: Chapter 3 hERG channel blockade over 587 compounds as a cardiotoxicity endpoint, modelled as a binary class with continuous pIC50 also supplied, evaluated by precision, recall, F1 and Matthews correlation on an imbalanced set of roughly 70 percent positives
    note: A toxicity liability is treated as its own modelled endpoint with metrics chosen for imbalance. Dose context and organ-level evidence are not addressed.
  - topic_id: t17-baseline-model-selection-protocol
    depth: executable
    run_basis: unverified
    evidence: [herg-notebook]
    reviewed_scope: Chapter 3 a dummy classifier as the cheap baseline, cross-validation with several metrics, grid and randomised hyperparameter search, and both scaffold and random split columns supplied in the dataset
    note: The baseline is executed rather than named, and two split definitions ship with the data so the reader can see the choice. No locked-test boundary or headroom estimate was observed.
  - topic_id: t05-small-molecule-representation
    depth: executable
    run_basis: real-data
    evidence: [drug-process-notebook, rna-target-notebook, deep-learning-notebook]
    reviewed_scope: Chapter 1 ECFP6 fingerprints reduced by principal components over FDA-approved drugs grouped by naming stem; Chapter 6 conformer- and protomer-aware three-dimensional descriptors; Chapter 8 2048-bit Morgan fingerprints as network input
    note: Three representation families are built and used in downstream tasks across the book. This review observed no side-by-side comparison of them on one endpoint.
  - topic_id: t07-endpoint-definition
    depth: executable
    run_basis: real-data
    evidence: [rna-target-notebook, deep-learning-notebook]
    reviewed_scope: Chapter 6 association and dissociation rate constants and the dissociation constant kept as separate targets with log transforms; Chapter 8 pooling three activity measurement types into one affinity target with an activity threshold of 6.3
    note: Chapter 6 separates kinetic endpoints that a single potency number would hide. Chapter 8 pools measurement types instead, so the two chapters make opposite choices and neither states the trade-off.
  - topic_id: t11-physical-model-system-state
    depth: worked
    evidence: [rna-target-notebook]
    reviewed_scope: Chapter 6 multiple conformers generated and aligned, protomer and tautomer states enumerated, and conformer energies Boltzmann weighted before aggregation into descriptors
    note: The molecular state is treated as an ensemble rather than a single structure. No dynamics, solvent model or trajectory is produced.
  - topic_id: t04-cleaning-exclusion-rules
    depth: executable
    run_basis: real-data
    evidence: [ligand-filter-notebook, unsupervised-notebook]
    reviewed_scope: Chapter 2 a rule-of-five filter with stated limits on mass, partition coefficient and hydrogen-bond counts allowing at most one violation, applied to a 212,670-compound library, with alert lists referenced; Chapter 7 activity labelling at a 5 micromolar threshold giving 782 active, 1,144 inactive and 136 unknown compounds
    note: Thresholds are declared before filtering and the surviving counts are visible. Chapter 2 references further alert sets whose filtering was not executed in the reviewed code.
  - topic_id: t03-prediction-target-loss
    depth: executable
    run_basis: real-data
    evidence: [deep-learning-notebook]
    reviewed_scope: Chapter 8 a single regression head over 2048-bit fingerprints predicting a pooled negative-log affinity across 7,280 EGFR compounds, split into 5,384 training, 599 validation and 1,297 test
    note: The target, the input and the output head are declared together. This review observed no baseline comparison in that chapter and no statement of the mismatch introduced by pooling three measurement types.
  - topic_id: t01-entity-glossary
    depth: mentioned
    evidence: [drug-process-notebook]
    reviewed_scope: Chapter 1 grouping approved drugs by naming stem into chemical classes such as anaesthetics, antibiotics and antivirals
    note: Chemical classes are used as labels for a classification demonstration rather than taught as distinctions between molecules, assays, targets and candidates.
  - topic_id: t03-training-validation-selection
    depth: executable
    run_basis: unverified
    evidence: [herg-notebook, deep-learning-notebook]
    reviewed_scope: Chapter 3 cross-validation over several metrics with grid and randomised hyperparameter search against a dummy baseline; Chapter 8 a declared train, validation and test split of 5,384, 599 and 1,297 compounds
    note: Selection is executed on validation rather than described. Neither chapter states a locked-test boundary.
  - topic_id: t17-split-leakage-audit
    depth: mentioned
    evidence: [herg-notebook]
    reviewed_scope: Chapter 3 shipping both a scaffold split and a random split as columns of the supplied dataset
    note: The existence of two split definitions makes the choice visible, but no leakage audit or comparison between them was observed.
  - topic_id: t16-tool-input-output-contract
    depth: executable
    run_basis: real-data
    evidence: [multimodal-notebook]
    reviewed_scope: Chapter 13 one request per ligand against two model services, raw response fields inspected cell by cell, a unit conversion verified against the returned value, cached results supplied so the notebook runs without live calls, and a response field identified as dimensionally incoherent
    note: The response contract is read and checked rather than trusted, and the incoherent field is reported rather than silently corrected.
  - topic_id: t07-property-decision-use
    depth: executable
    run_basis: unverified
    evidence: [multimodal-notebook]
    reviewed_scope: Chapter 13 a declared gate on binder probability at 0.5, with potency read only for compounds that pass, applied to two compound sets
    note: The decision rule precedes the prediction it consumes. No cost or consequence model accompanies the gate.
  - topic_id: t09-target-assay-screen-unit
    depth: worked
    evidence: [multimodal-notebook]
    reviewed_scope: Chapter 13 eighteen inhibitors from one radiometric assay in a single paper treated separately from sixteen compounds drawn from a free-energy benchmark
    note: The two sets are kept apart and their provenance is stated, which is what allows the reported per-target bias to be read as a property of the pairing.
  - topic_id: t17-ood-transportability
    depth: worked
    evidence: [multimodal-notebook]
    reviewed_scope: Chapter 13 the same models applied to two unrelated targets with per-target bias and range compression reported as observed limits
    note: Transfer is examined across two targets rather than asserted. No declared shift or external population is constructed.
  - topic_id: t03-computational-uncertainty
    depth: worked
    evidence: [multimodal-notebook, deep-learning-notebook]
    reviewed_scope: Chapter 13 bootstrap intervals on a rank correlation and a replicate-stability measurement repeating one ligand three times, with four compounds whose gate flips between replicates; Chapter 8 seeds fixed across libraries and a stated runtime of a few minutes without a GPU
    note: Variability between repeated calls to the same service is measured and tied to a decision that flips. Compute cost is stated once rather than related to a decision.
  - topic_id: t17-reproduction-reporting-receipt
    depth: worked
    evidence: [deep-learning-notebook, multimodal-notebook]
    reviewed_scope: Chapter 8 seeds fixed across Python, the array library, the deep-learning framework and the accelerator; Chapter 13 cached result files supplied so the notebook reproduces without live service calls
    note: Reproducibility is addressed through seeds and cached inputs. No environment manifest, version pin or hash receipt was observed.
  - topic_id: t11-free-energy-endpoint-network
    depth: mentioned
    evidence: [active-structure-notebook]
    reviewed_scope: Chapter 9 a free-energy section present in the chapter with no accompanying code, as recorded in the 2026-09-04 review
