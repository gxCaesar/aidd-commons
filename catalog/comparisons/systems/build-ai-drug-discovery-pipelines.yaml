caveats:
  - Correction of 2026-09-10. Stopping rules and policy evaluation were briefly recorded as absent for this provider on the strength of a web retrieval that stopped before the active-learning section. Reading the notebook in full through the repository API showed a configuration-grid comparison with learning curves, so the cell is now executable. An absent state must rest on a surface that was read to its end, and that one was not.
  - The proxy-oracle table for the active-learning section is named for a different structure than the one the docking section prepares. That is an observation about a filename rather than about the data it holds, which was not opened, so the two sections are not assumed to form one continuous pipeline in either direction.
  - The Chapter 9 active-learning section uses a proxy oracle that looks up pre-computed docking scores rather than running the expensive scorer each round. That is a legitimate teaching device and it is recorded here because it bounds what the loop demonstrates, which is the mechanics of iterative selection rather than a discovery.
  - Every chapter in the published inventory has been read, Chapter 9 last on 2026-09-10. Forty-two topics are recorded as absent from those surfaces. One topic remains unverified, batch diversity and allocation, because the acquisition loop exists but its selection mechanism was not resolved from the retrieved content, and a negative finding there would need the selection code itself.
  - The repository states that it supplies runnable code and section titles while the explanations, illustrations, equations and pseudocode stay in the commercial book. No chapter reviewed here carries an exercise, a quiz or a self-check, so no topic is scored at assessed for this provider. That is a property of what is published openly, not a judgement of the book.
  - Chapter 12 is titled for protein structure prediction, but its released code trains a protein language model, an antibody classifier and a mutation scorer. No structure is produced, so no structural or pocket topic is credited from it.
  - Nine of the thirteen chapters have now been reviewed. Chapters 1, 2, 3, 6 and 8 remain unread, so this record still understates the provider and omitted topics stay unverified rather than absent.
  - Public notebooks contain runnable code and section titles but omit explanatory paragraphs, figures, equations, and pseudocode from the commercial companion book.
  - The Apache-2.0 statement is not extended to companion-book prose, repository data, or external datasets without separate evidence.
  - The Chapter 9 free-energy section has no accompanying code and is not scored as executable free-energy coverage.
