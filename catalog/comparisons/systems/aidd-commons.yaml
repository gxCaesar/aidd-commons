- topic_id: t03-inductive-bias-selection
  depth: assessed
  run_basis: authored
  evidence:
  - ml-neural-representations
  - ml-student-sandbox-notebook
  - ml-student-sandbox-page
  reviewed_scope: The representations lesson arguing the choice from the input-output relation, and the constructed sandbox fitting a linear arm and a decision-stump arm on the same records under one selection rule of lowest validation error with ties to the less constrained candidate, then scoring both on the same held-out records against the same train-mean baseline, where ridge reaches MAE 4.5, the stump 0.5 and the constant 3.5
  note: The difference is traced to extrapolation rather than to capacity. The test features lie outside the training range where the constructed response turns over, so the linear arm must extrapolate while the stump repeats a leaf constant. The notebook states that two test entities cannot rank families and that reversing the regime reverses the ordering, and its fifth exercise asks the reader to say what would have to change about the records.
