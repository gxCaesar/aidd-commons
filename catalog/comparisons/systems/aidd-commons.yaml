  reviewed_scope: The probability lesson treating a loss as a claim about observation noise, and the constructed sandbox varying only the optimiser after the configuration is fixed, three declared starting points crossed with three step budgets, reporting compute as gradient evaluations of 300, 1200 and 3000, whether the starts agree on the decision at the 0.5 threshold, and the largest remaining probability spread of 0.41990136775635795, 0.06683611848057949 and 0.012222954285608406
  note: The cheapest budget is the only one where the starting points disagree on the decision, so compute buys decision stability before it buys probability agreement. The notebook states that the spread across starts measures how far the search travelled rather than how much six records constrain the answer, and its sixth exercise asks why that spread is still not an uncertainty estimate.
