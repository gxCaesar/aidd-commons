id: chembl-training
name: ChEMBL Quick Tour
provider_class: curriculum
canonical_url: https://www.ebi.ac.uk/training/online/courses/chembl-quick-tour/
summary: An EMBL-EBI self-paced course introducing ChEMBL content, curation, search, access routes, and bioactivity information.
audiences: [chemistry-students, pharmacology-students, life-science-researchers]
languages: [en]
metadata_evidence: [course-overview]
access:
  content: { value: open, evidence: [course-overview] }
  code: { value: unverified }
  data: { value: open, evidence: [data-access] }
  solutions: { value: unverified }
licenses:
  - name: Creative Commons Attribution 4.0 International
    scope: EMBL-EBI course materials except where a page supplies separate licensing details
    evidence: [course-overview]
coverage_default:
  depth: unverified
  evidence: []
  reviewed_scope: No topic-specific evidence was encoded for omitted taxonomy topics in this dated review.
  note: Omitted topics remain unverified and must not be treated as absent.
coverage:
  - topic_id: t02-assay-endpoint-controls
    depth: explained
    evidence: [course-overview, curation]
    reviewed_scope: Course overview and ChEMBL curation lesson
    note: The course explains bioactivity records, assays, targets, compounds, confidence, and curated source relationships.
  - topic_id: t04-entity-identity-resolution
    depth: explained
    evidence: [course-overview, data-access]
    reviewed_scope: Course learning outcomes and data-access lesson
    note: The course teaches searching and retrieving compound, target, assay, and activity information through several access routes.
  - topic_id: t04-data-contract
    depth: explained
    evidence: [curation, data-access]
    reviewed_scope: Data curation and access lessons
    note: The reviewed lessons describe record relationships, curation fields, source links, and website, service, and download access modes.
  - topic_id: t04-provenance-versioning
    depth: explained
    evidence: [curation]
    reviewed_scope: ChEMBL data-curation lesson
    note: The lesson explains extraction from scientific literature and links among documents, assays, targets, compounds, and activities.
