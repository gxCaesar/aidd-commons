caveats:
  - Every taxonomy topic now carries a direct observation. Forty are recorded as absent, meaning not found across the thirty-two talktorials read on 2026-09-10. Absent contributes nothing to either bound, so those cells narrow this provider's upper bounds rather than its lower ones. They describe a computer-aided drug-design notebook collection and must not be read as a claim that the provider has no such material anywhere, nor as a judgement of the collection against a scope it never claimed.
  - The rendered pages for T017 on advanced visualisation and T020 on trajectory analysis both exceed this review's retrieval limit. T020 was later resolved through its repository README, a smaller surface, which is cited where it is used. T017 remains unread, and no topic was recorded as absent on its account.
  - Dataset access and third-party terms were not inferred from the public notebook and code availability.
  - The molecular-dynamics page warns about long runtimes without a GPU and current Windows limitations; no universal low-compute claim is made.
  - The official index enumerates 34 talktorials, with identifiers running from T001 to T038 and T029 to T032 absent. This record now rests on 32 of them, so only T017 and T020 remain unread.
  - T018, T004, T006 and T013 show a Quiz heading or section whose questions were not retrievable in this review, so their topics are scored at executable rather than assessed. A later review with the questions in hand may raise them.
  - Two surfaces exceeded this review's retrieval size limit and were not read, T017 on advanced visualisation and T020 on trajectory analysis. T020 is recorded as an explicit unverified observation. T017 has no clear taxonomy topic to attach and is named here instead. Neither is absent.
  - Quiz sections are counted as assessed because they supply an exercise that tests the learner. The reviewed quizzes do not publish answers or a rubric, and no graded or verified completion route was observed.
  - The 2026-09-10 tranche raised three cells that the 2026-09-04 review had scored lower. That is a correction of this project's review depth, not an upstream change by the provider.
