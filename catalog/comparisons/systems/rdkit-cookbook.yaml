id: rdkit-cookbook
name: RDKit Cookbook
provider_class: specialist-reference
canonical_url: https://www.rdkit.org/docs/Cookbook.html
summary: A community-maintained collection of tested Python recipes for common cheminformatics operations using RDKit.
audiences: [cheminformatics-practitioners, python-users]
languages: [en]
metadata_evidence: [cookbook]
access:
  content: { value: open, evidence: [cookbook] }
  code: { value: open, evidence: [cookbook] }
  data: { value: unverified }
  solutions: { value: not_applicable, evidence: [cookbook] }
licenses:
  - name: BSD 3-Clause License
    scope: RDKit core code; externally sourced Cookbook examples retain source-specific attribution and may require separate review
    evidence: [rdkit-license, cookbook]
coverage_default:
  depth: unverified
  evidence: []
  reviewed_scope: No topic-specific evidence was encoded for omitted taxonomy topics in this dated review.
  note: Omitted topics remain unverified and must not be treated as absent.
coverage:
  - topic_id: t05-small-molecule-representation
    depth: worked
    evidence: [cookbook]
    reviewed_scope: Cookbook introduction and rendered molecule, substructure, stereochemistry, and representation recipes
    note: The page provides concrete Python recipes with inputs and rendered or textual outputs for RDKit molecular objects.
  - topic_id: t07-chemical-standardisation
    depth: worked
    evidence: [cookbook]
    reviewed_scope: Neutralizing Molecules, Largest Fragment, Isomeric SMILES without isotopes, and Detect Chemistry Problems recipes with input structures and printed outputs
    note: Charge, mixture and identifier operations are demonstrated as runnable recipes with outputs. The page does not freeze a rule set for a property dataset, which is what the topic asks for, so it is not scored deeper.
  - topic_id: t14-atom-mapping-transformation-class
    depth: worked
    evidence: [cookbook]
    reviewed_scope: Reversing Reactions, which decomposes a product into reactants using a fully atom-mapped Pictet-Spengler reaction SMARTS, and Reaction Fingerprints and Similarity
    note: Atom maps are explicit in the reaction SMARTS and a named transformation class is worked through end to end. No dataset-level transformation taxonomy is built.
  - topic_id: t04-entity-identity-resolution
    depth: mentioned
    evidence: [cookbook]
    reviewed_scope: Molecule Hash Strings, which enumerates the MolHash functions and computes canonical hashes for one structure
    note: Chemical identity hashing appears, but none of the protein, assay, disease or sample identifier resolution the topic names, and no retention of unmatched entities or ambiguity.
