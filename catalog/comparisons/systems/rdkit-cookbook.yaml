    depth: absent
    evidence: [cookbook]
    reviewed_scope: The complete Cookbook section list reviewed on 2026-09-11, covering drawing, bonds, rings and aromaticity, stereochemistry, molecule manipulation, substructure matching, descriptors, writing molecules, reactions, error messages and miscellaneous recipes
