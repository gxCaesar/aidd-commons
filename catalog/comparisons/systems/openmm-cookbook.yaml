evidence:
  - id: collection-index
    url: https://openmm.github.io/openmm-cookbook/latest/cookbook.html
    title: OpenMM Cookbook and tutorial index
    observed_scope: The complete listing of 15 cookbook entries and 14 tutorials, covering first simulations, temperature and pressure, system serialisation, topology merging, hydrogens for nonstandard molecules, Lennard-Jones mixing, tabulated potentials, external forces, position and dihedral restraints, energy contributions, interaction energies, charge querying, minimisation reporting, input loading, system building, parameter selection, replica exchange, expanded ensemble, alchemical free energy, coarse-grained polymers, nuclear quantum effects, REST, constant potential electrodes, umbrella sampling and machine-learning potentials.
    access: opened
    reviewed_on: 2026-09-11
  - id: parameter-tutorials
    url: https://openmm.github.io/openmm-cookbook/latest/notebooks/tutorials/simulation_parameters.html
    title: Selecting Values for Simulation Parameters, with umbrella sampling and alchemical free energy
    observed_scope: The parameter-selection tutorial read in full, separating physical accuracy from numerical accuracy and working through the speed-against-accuracy trade-off for cutoffs, tolerances and time step. The umbrella-sampling tutorial mentions equilibration and convergence, and the alchemical tutorial uses MBAR to report uncertainty. All are rendered notebooks offered for download and Colab.
    access: opened
    reviewed_on: 2026-09-11
  - id: landing-page
    url: https://openmm.github.io/openmm-cookbook/latest/
    title: OpenMM Cookbook and Tutorials
    observed_scope: Collection purpose, new-user audience, Cookbook and tutorial distinctions, downloadable notebooks, local execution, and Colab routes.
    access: opened
    reviewed_on: 2026-09-04
    version: "v0.9 documentation"
  - id: tutorial-index
    url: https://openmm.github.io/openmm-cookbook/latest/tutorials.html
    title: OpenMM Tutorials index
    observed_scope: Introductory simulation sequence and advanced topics including replica exchange, enhanced sampling, alchemical free energy, and machine-learned potentials.
    access: opened
    reviewed_on: 2026-09-04
    version: "v0.9 documentation"
  - id: getting-started
    url: https://openmm.github.io/openmm-cookbook/dev/notebooks/tutorials/getting_started.html
    title: Getting Started with OpenMM
    observed_scope: OpenMM architecture, system setup, force fields, integrator, barostat, input coordinates, simulation, and data reporting links.
    access: opened
    reviewed_on: 2026-09-04
    version: "development documentation"
  - id: official-repository
    url: https://github.com/openmm/openmm-cookbook
    title: OpenMM Cookbook official repository
    observed_scope: Public notebook source, build process, Colab injection, required files, versioned releases, and CI distinction between Cookbook notebooks and tutorials.
    access: opened
    reviewed_on: 2026-09-04
