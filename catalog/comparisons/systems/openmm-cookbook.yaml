id: openmm-cookbook
name: OpenMM Cookbook and Tutorials
provider_class: tutorial-collection
canonical_url: https://openmm.github.io/openmm-cookbook/latest/
summary: A collection of rendered notebooks and tutorials for learning OpenMM and performing common molecular-simulation tasks.
audiences: [molecular-simulation-practitioners, new-openmm-users]
languages: [en]
metadata_evidence: [landing-page, official-repository]
access:
  content: { value: open, evidence: [landing-page] }
  code: { value: open, evidence: [landing-page, official-repository] }
  data: { value: unverified }
  solutions: { value: unverified }
licenses: []
coverage_default:
  depth: unverified
  evidence: []
  reviewed_scope: No topic-specific evidence was encoded for omitted taxonomy topics in this dated review.
  note: Omitted topics remain unverified and must not be treated as absent.
coverage:
  - topic_id: t11-physical-model-system-state
    depth: explained
    evidence: [getting-started]
    reviewed_scope: Official getting-started tutorial
    note: The tutorial introduces system construction, force fields, integrators, pressure and temperature control, coordinates, and simulation state.
  - topic_id: t11-dynamic-simulation-observable
    depth: executable
    run_basis: real-data
    evidence: [landing-page, tutorial-index, official-repository]
    reviewed_scope: Public notebook delivery, introductory simulation tutorials, and repository execution description
    note: The rendered collection provides downloadable and Colab notebooks for simulation setup, execution, reporting, and advanced examples.
  - topic_id: t11-free-energy-endpoint-network
    depth: mentioned
    evidence: [tutorial-index]
    reviewed_scope: Official advanced tutorial index
    note: The index includes an alchemical free-energy tutorial, but its endpoint and network treatment were not reviewed deeply enough for a stronger state.
  - topic_id: t11-convergence-protocol-uncertainty
    depth: executable
    run_basis: real-data
    evidence: [parameter-tutorials]
    reviewed_scope: The Selecting Values for Simulation Parameters tutorial read in full, with the umbrella-sampling and alchemical free-energy tutorials
    note: Parameter selection is framed as an explicit speed-against-accuracy trade-off separating physical from numerical accuracy, cutoffs, tolerances and time step. Umbrella sampling covers equilibration and convergence, and the alchemical tutorial reports MBAR uncertainty. Replicate dependence and force-field sensitivity are not tested as such, so the topic is covered by runnable material rather than fully.
  - topic_id: t02-therapeutic-decision-context
    depth: absent
    evidence: [collection-index]
    reviewed_scope: The complete cookbook and tutorial index reviewed on 2026-09-11, being 15 cookbook entries and 14 tutorials covering force fields, thermostats and barostats, restraints and external forces, energy analysis, parameter selection, multistate sampling, alchemical free energy, umbrella sampling, coarse-grained models, nuclear quantum effects and machine-learning potentials
    note: No cookbook entry or tutorial in the reviewed index addresses any topic in this track. The collection teaches how to set up, run and analyse molecular simulations. The reviewed surface is the index of entry titles together with the parameter-selection, umbrella-sampling, alchemical and machine-learning-potential tutorials read in full.
