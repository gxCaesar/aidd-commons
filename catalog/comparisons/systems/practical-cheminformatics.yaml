coverage:
  - topic_id: t07-regression-formulation
    depth: executable
    run_basis: unverified
    evidence: [qsar-notebook]
    reviewed_scope: QSAR in 8 Lines notebook
    note: The notebook declares molecular inputs and a property target and runs a compact regression workflow with outputs.
  - topic_id: t07-interpretability-sar
    depth: executable
    run_basis: unverified
    evidence: [free-wilson-notebook]
    reviewed_scope: A Free-Wilson analysis decomposing an analogue series against a declared core, one-hot encoding the R-groups, fitting a ridge model on a train and test split, and then reading the fitted coefficients back onto each substituent as its contribution
    note: The explanation is the model's own coefficients over an analogue series rather than an attribution heuristic, so a claimed substituent effect can be checked by adding the analogue. The 2026-09-04 review recorded only a mention.
  - topic_id: t15-acquisition-policy-uncertainty
    depth: executable
    run_basis: unverified
    evidence: [active-learning-notebook]
    reviewed_scope: Active Classification notebook
    note: The notebook implements an iterative active-learning policy with an oracle and comparative outputs.
  - topic_id: t10-complex-cofolding-hypothesis
    depth: executable
    run_basis: real-data
    evidence: [cofolding-notebook]
    reviewed_scope: A notebook that downloads a protein-ligand complex from the PDB, extracts the ligand to SMILES and the protein to a sequence, co-folds the pair with OpenFold-3, superimposes the predicted and experimental chains and reports a protein alpha-carbon RMSD and then a separate ligand RMSD by maximum-common-substructure alignment
    note: The prediction is checked against the experimental structure it was built to reproduce, and the protein and ligand deviations are reported separately rather than as one number. The 2026-09-04 review recorded this as worked.
  - topic_id: t17-metric-endpoint-uncertainty
    depth: worked
    evidence: [cofolding-notebook]
    reviewed_scope: Co-folding RMSD calculation and comparison
    note: The worked case computes a structural comparison metric; it does not establish broad uncertainty treatment.
  - topic_id: t12-candidate-design-space
    depth: worked
    evidence: [generation-notebook]
    reviewed_scope: SMILES-RNN analogue-generation notebook
    note: The notebook demonstrates a concrete string-based generation workflow and resulting candidate surface.
  - topic_id: t05-complex-interaction-representation
    depth: executable
    run_basis: real-data
    evidence: [interaction-fingerprint-notebook]
    reviewed_scope: A notebook computing ProLIF interaction fingerprints for a fragment hit from an ERK2 structure and its docked analogues, plotting them as a heatmap and then clustering compounds by the interactions they make
    note: The complex is reduced to a typed per-residue interaction profile which is then used as the clustering feature, so the representation is consumed rather than only displayed.
  - topic_id: t09-binding-mode-pose-hypothesis
    depth: executable
    run_basis: real-data
    evidence: [interaction-fingerprint-notebook]
    reviewed_scope: The same notebook measuring how far each docked analogue departs from the reference fragment pose by maximum-common-substructure RMSD, plotting the distribution and retaining only analogues below one angstrom
    note: Pose preservation is quantified against an experimental reference and a numeric cut is declared before the interaction analysis proceeds. Whether the retained poses are correct is not established by the filter.
