evidence:
  - id: notebook-index
    url: https://github.com/PatWalters/practical_cheminformatics_tutorials
    title: Practical Cheminformatics notebook index
    observed_scope: The complete set of notebook directories and filenames, covering RDKit fundamentals, SMILES and SMARTS, machine-learning models and cross-validation, SAR analysis including Free-Wilson and matched pairs, docking interaction analysis, a SMILES RNN, active learning, clustering, reactions, tautomer energies, patent analysis and ChEMBL data work.
    access: opened
    reviewed_on: 2026-09-11
  - id: tutorial-index
    url: https://raw.githubusercontent.com/PatWalters/practical_cheminformatics_tutorials/main/README.md
    title: Practical Cheminformatics With Open Source Software
    observed_scope: Forty-one-notebook inventory, Colab and local routes, correction request, and topic groupings.
    access: opened
    reviewed_on: 2026-09-04
