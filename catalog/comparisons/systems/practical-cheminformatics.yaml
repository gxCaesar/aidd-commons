    url: https://raw.githubusercontent.com/PatWalters/practical_cheminformatics_tutorials/main/LICENSE
    title: Practical Cheminformatics repository licence
    observed_scope: MIT terms for repository software and associated documentation.
    access: opened
    reviewed_on: 2026-09-04
  - id: qsar-notebook
    url: https://raw.githubusercontent.com/PatWalters/practical_cheminformatics_tutorials/main/ml_models/QSAR_in_8_lines.ipynb
    title: Build and Test a QSAR Model in 8 Lines of Python
    observed_scope: Declared SMILES and property inputs, regression pipeline, runnable code, and notebook outputs.
    access: opened
    reviewed_on: 2026-09-04
  - id: active-learning-notebook
    url: https://raw.githubusercontent.com/PatWalters/practical_cheminformatics_tutorials/main/active_learning/active_classification.ipynb
    title: Active Classification
    observed_scope: Candidate pool, oracle, acquisition loop, iterations, runnable code, and comparative outputs.
    access: opened
    reviewed_on: 2026-09-04
  - id: cofolding-notebook
    url: https://raw.githubusercontent.com/PatWalters/practical_cheminformatics_tutorials/main/biotite/evaluate_cofolding.ipynb
    title: Evaluating Co-folding Results with Biotite
    observed_scope: External co-folding service workflow, supplied result archive, structural alignment, RMSD worked case, and caveats. Re-read in full through the repository API on 2026-09-10, which resolved the specifics, a PDB complex downloaded and split into a ligand SMILES and a protein sequence, co-folding with OpenFold-3, chain superposition through plinder, and a protein alpha-carbon RMSD reported separately from a ligand RMSD computed by maximum-common-substructure alignment. A dependency conflict requiring a kernel restart is stated up front. No exercises.
    access: opened
    reviewed_on: 2026-09-10
  - id: generation-notebook
    url: https://raw.githubusercontent.com/PatWalters/practical_cheminformatics_tutorials/main/generative/SMILES_RNN.ipynb
    title: Generative Molecular Design with SMILES-RNN
    observed_scope: Analogue-generation objective, model workflow, code, and generated-molecule outputs.
    access: opened
    reviewed_on: 2026-09-04
  - id: interaction-fingerprint-notebook
    url: https://github.com/PatWalters/practical_cheminformatics_tutorials/blob/main/docking/prolif_analysis.ipynb
    title: Interaction fingerprints for docked analogues
    observed_scope: Read in full through the repository API. Reference fragment from an ERK2 structure with docked analogues, maximum-common-substructure RMSD against the reference with a one-angstrom filter, ProLIF interaction fingerprints, heatmap and clustering by interaction profile. No exercises.
    access: opened
    reviewed_on: 2026-09-10
  - id: free-wilson-notebook
    url: https://github.com/PatWalters/practical_cheminformatics_tutorials/blob/main/sar_analysis/free_wilson.ipynb
    title: Free-Wilson analysis
    observed_scope: Read in full through the repository API. Core definition and alignment, R-group decomposition, one-hot encoding, ridge regression on a train and test split, predicted against observed plots, and fitted coefficients rendered as per-substituent contributions. No exercises.
    access: opened
    reviewed_on: 2026-09-10
caveats:
  - The repository tree lists more than forty notebooks across fundamentals, clustering, SAR analysis, machine learning, docking, generation, reactions, quantum chemistry and active learning. Nine have now been reviewed, so this record still understates the provider and omitted topics stay unverified rather than absent.
  - No notebook reviewed here carries an exercise or a quiz, so no topic is scored at assessed for this provider.
  - The co-folding notebook relies on ApherisFold-Lite and a supplied result pointer, so it is recorded as worked rather than self-contained executable coverage.
  - Repository availability does not establish uniform access or licence terms for ChEMBL, BindingDB, co-folding services, or downloaded assets.
