caveats:
  - "MAGI is an agent with a retrospective evaluation, not a standalone released benchmark. Its paper promises code and trained global ADMET models under an open-source licence upon publication, but supplies no release URL or named code licence. Current code, weights and access remain unverified."
  - "Four campaigns use published GSK series and four use Sanofi RetroDMTA data. The AstraZeneca programme remains confidential. The nine campaigns must not all be described as private."
  - "Objective attainment tracked scorer accuracy and applicability. Proposal endpoints are predictions, while reference and held-out endpoints are study measurements. One backend and trajectory per condition, with no static-objective control, do not isolate orchestration's causal contribution. Temporal cutoffs cannot exclude pretraining exposure."
  - "Four blinded chemists could not reliably distinguish agent proposals from held-out compounds and found the SAR reasoning plausible but incomplete. This record did not run the replay or establish experimental activity for new proposals."
