caveats:
  - "The model is a pretrained backbone and not a ready-made predictor. The card states that users are expected to fine-tune it on their own labelled datasets for specific ADMET endpoints, so the record carries no ADMET prediction from this model."
  - "The pretraining is fully unsupervised and uses no dedicated testing dataset, and the card reports no numerical benchmark result, so the representation's quality is not established by the record."
  - "The card states that predictions are statistical estimates and should not be used as substitutes for experimental measurement in safety-critical drug development decisions."
  - "The training pool is described as about 11.1 million unique canonical SMILES after pooling and deduplication, with a ZINC15 and ChEMBL base pool plus the Biogen ADMET, ExpansionRX and ChEMBL-MT additions, and the card states the pool is scaffold-balanced by Bemis-Murcko scaffolds for the train and validation split. The record did not open the corpora themselves, so the record carries the sizes and the deduplication rule rather than a check of the files."
  - "The decoder's recommended maximum SMILES length is 512 tokens, and longer structures are to be truncated or omitted."
  - "The card describes the deployment target as Linux with NVIDIA GPUs, and recommends compute capability 7.0 or newer with 32 gigabytes of memory for training."
