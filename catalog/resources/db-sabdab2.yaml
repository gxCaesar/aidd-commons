caveats:
  - The source warns that unprocessed search and full-structure downloads can include low-resolution structures, residue anomalies, and pathogenic antibodies.
  - "The machine learning release states its own counts: 16,415 structures from 8,992 PDB identifiers, corresponding to 5,556 unique antibodies, of which 12,841 are paired-chain, 3,427 single-domain heavy, 63 single-domain light and 84 VNAR, and about 9.4 percent bind antigens made of more than one polymer chain. Each structure file holds one antibody, paired-chain or single-chain, cropped to the variable region, with any antigen chains. The record carries these as the release's own statements."
  - "The release states that the structures are post-processed for machine learning applications and are accompanied by standardised train and test splits, and it is deposited under a version number, 0.3.0. The earlier Zenodo identifier 10.5281/zenodo.20083994 now redirects to this record, which is how the release's own version history is expressed."
  - "The record did not download the release, so it carries the deposit's own statement of its contents and not a check of the files."
  - "This record no longer supplies an affinity measurement. The live interface document for the service contained zero occurrences of affinity, delta_g or affinity_method when it was read on 2026-10-21, and the former per-entry and bulk summary addresses redirect to a single-page application shell rather than serving the tabular data, so a plan that assumes an affinity field here would be reading a field that is no longer served."
