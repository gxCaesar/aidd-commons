    supports: [identifiers, summary]
caveats:
  - The pretrained tokenizer and checkpoint are loaded from a Hugging Face model card that states no licence, so the terms of the released weights are not established by the GPL file in the repository and remain unverified.
  - The README gives the pretraining scale as 22.3 million single-cell transcriptomes and the paper abstract repeats that figure, but neither names a source corpus, and the worked example uses local Muris files, so the training data is unverified.
  - The README contains no licence section, so the GPL terms come from the repository LICENSE file alone.
