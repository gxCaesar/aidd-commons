caveats:
  - The README states that the model is pretrained on the GGA and GGA+U static and relaxation trajectories from Materials Project, and that the MPtrj dataset used for the pretraining is available at the address it names.
  - No opened page states a licence for the pretrained CHGNet weights. The repository ships the 0.3.0 checkpoint next to a BSD-3-Clause file whose copyright notice covers CHGNet source, and the project site states no terms for the weights, so the weight licence stays unverified.
  - The MPtrj training corpus is published by the Materials Project under the Materials Project terms of use rather than under the model's BSD-3-Clause licence, and the README states that users of the dataset agree to abide by those terms. The figshare page for the dataset returned HTTP 403 during this review, so the dataset's own licence text was not inspected.
  - The 0.3.0 model card records the training corpus as the MPtrj dataset with a 9-0.5-0.5 train-validation-test split and reports mean absolute errors for energy, force, stress and magnetisation, but the opened pages give no further definition of that test split.
  - The README describes the 0.2.0 checkpoint as deprecated and kept for compatibility with the Nature Machine Intelligence paper, and the r2scan checkpoint as transfer-learned from the MP-R2SCAN dataset, whose provenance is not described on the opened pages.
  - The README states the pretrained dataset uses GGA+U DFT with MaterialsProject2020Compatibility corrections applied, so the pretrained labels are not directly comparable to raw MPtrj values.
  - The publisher page for the Nature Machine Intelligence article was not opened during this review, so the citation is recorded as the README states it and not from the article itself.
