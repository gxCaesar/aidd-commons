caveats:
  - The release states that the model was trained on protein sequences from UniRef, MGnify and the Joint Genome Institute with the sequence clustering and the two-stage schedule the ESMC card sets out, and the repository states that the ESM Atlas dataset is released openly.
  - Only the ESMFold2 model card names a training corpus, the Protein Data Bank and the AlphaFold DB; the repository README names no Cambrian collection, so the data recipe stays unverified.
  - The README states that the models are available under the MIT licence but assigns no separate terms to the ESM Atlas dataset or to the binder design system.
  - The ESMC 6B and sparse autoencoder model cards show a second licence label, other, next to mit, and link an Acceptable Use Policy that the cards do not explain.
