caveats:
- The knowledgebase is downloadable without an account over both the FTP tree and the REST interface, and the release file read on 2026-10-23 states that the current release is 2026_03 of 02-Sep-2026. The licence page renders in the browser and returned only the site fallback message to a static reader, so the terms the database is offered under were not established and the record carries no licence.
