caveats:
  - The database holds predicted structures. A prediction is not an observation of the conformation a protein adopts, and the confidence values are the database's own estimates.
  - The page states that data is available for academic and commercial use under a CC BY 4.0 licence, and that EMBL-EBI expects attribution for its online services, databases and software.
  - The page reports two counts of the predictions held, one for the database as a whole and one for the latest release, so a count taken from the page needs its sentence.
  - The page states that AlphaFold data are provided by Google DeepMind and that the AlphaFold data are copyright DeepMind Technologies Limited, with separate copyright statements for data provided by third parties.
  - The per-accession record is read from the archive's own API route, whose page is rendered in the browser and was not read as text on 2026-10-22.
acknowledgements:
  - Google DeepMind
  - EMBL-EBI
  - "Bertoni D. et al. AlphaFold Protein Structure Database 2025: a redesigned interface and updated structural coverage, Nucleic Acids Research (2025)"
