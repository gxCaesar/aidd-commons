id: db-alphafold-db
name: AlphaFold Protein Structure Database
kind: database
summary: Public archive of predicted protein structures for the UniProt proteome, served with a global and a per-residue confidence value and with downloadable model files.
canonical_url: https://alphafold.ebi.ac.uk/
identifiers:
