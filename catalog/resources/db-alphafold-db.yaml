    value: "alphafold.ebi.ac.uk/api/prediction/{accession}"
    url: https://alphafold.ebi.ac.uk/api-docs
stages: [data-intake, structure-prediction]
modalities: [protein]
tasks: [structure-retrieval]
relations: []
status: { value: active, evidence: [homepage] }
access_level: { value: source_available, evidence: [homepage] }
openness:
  inference_code: { value: unverified }
  training_code: { value: unverified }
  weights: { value: available, evidence: [homepage] }
  architecture: { value: unverified }
  data_recipe: { value: unverified }
  training_data: { value: unverified }
  evaluation_code: { value: unverified }
