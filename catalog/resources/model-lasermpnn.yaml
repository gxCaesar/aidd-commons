caveats:
- 'The source and repository model_weights directory are public, and the LICENSE grants MIT terms for software and documentation. Training data follow separate Zenodo routes: the ligand-encoder script retrieves SPICE-2.0.1.hdf5 from record 10975225 and the protonated-PDB script retrieves all_data.zip from record 15035128. Neither script states the data terms, so the software grant is not treated as a licence for those external corpora.'
- The README carries no data-availability statement. It names two dataset-download scripts, one for the ligand-encoder training dataset and one for the protonated PDB training dataset, and states that LASErMPNN was trained on protonated structures, but it gives no corpus name, record count, filtering procedure or split size for either.
- The default checkpoint is named laser_weights_0p1A_nothing_heldout.pt and the README says other weights are in the model_weights directory. It gives no separate checkpoint download URL, so the weights are reachable through the repository rather than through a stated download.
- The retrained comparison model is described against the streptavidin heldout split and a reconstruction of the LigandMPNN training dataset, which names a split but not its size.
- The README gives two conda environment files, one for CUDA 11 and one for CUDA 12, and names PyTorch, torch-scatter, torch-cluster and ProDy as the minimum inference dependencies without dated releases.
- The paper is recorded from the DOI and the repository's own README. The article's text was not opened, so the reported hit rates and the measured affinities are not carried here.
