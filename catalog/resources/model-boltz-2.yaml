caveats:
  - The training documentation states that the structure model was trained on the PDB and the OpenFold self-distillation set, that the pre-processed training data can be downloaded, and that the processing pipeline is documented at the foot of the page.
  - The README states that the two affinity outputs are trained on largely different datasets but names neither dataset, so the affinity training data stays unverified.
  - The README marks updated training code and updated evaluation code for Boltz-2 as still to come.
  - The evaluation sets named on the page, FEP+, CASP16 and the MF-PCBA test set, are described as test sets, and the page states no terms for them.
