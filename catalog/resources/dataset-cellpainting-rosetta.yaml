caveats:
  - "A bucket listing is a manifest, not a licence grant. The licence is the one the gallery README states, and it applies to the whole gallery rather than to a single object."
  - "The gallery publishes both a full-feature and a variable-selected imaging release for this batch. Which one an analysis reads changes the feature set, and the two are not interchangeable: the variable-selected release carries no empty or infinite cell in any imaging feature, while the full-feature release contains features that do."
  - "The preprocessed releases are the gallery's own normalisation. A study that needs the raw images, the unnormalised feature table or the per-well annotations must read the study's associated data repository, which this record does not verify."
  - "Only the LUAD-BBBC041-Caicedo batch was read for the cross-modality comparison. The study's other four batches cover different cell lines and different perturbation types, and nothing measured on one of them transfers to another without being re-measured."
acknowledgements:
  - "The Cell Painting Gallery is hosted on the AWS Registry of Open Data, and the gallery asks that this hosting be acknowledged."
