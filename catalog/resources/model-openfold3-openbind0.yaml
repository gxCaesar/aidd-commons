caveats:
  - This record identifies the OpenBind-0 default checkpoint, not the original AlphaFold2-based OpenFold repository or every OpenFold3 preview parameter set. Deprecated preview2 parameters require a compatible package release below 0.5.0.
  - The repository still describes a research preview and lists final-model work as ongoing. The current default must not be described as completed parity with every AlphaFold3 capability.
  - The release states that code, weights, training recipes and data are public, but the complete current-default training-corpus inventory and its asset-level access and terms were not checked end to end. Training data therefore remain unverified in this record. Linked benchmark scripts were not inspected, leaving evaluation code unverified.
  - Inference-time chemical steering changes predicted ligand geometry. Pose accuracy and chemical validity remain separate from binding affinity and experimental activity.
  - Comparisons span different training cutoffs and target regimes. More recent training data and fragment fine-tuning do not uniformly repair difficult pocket and conformational failures. The record supplies no universal ranking and ran no inference or benchmark.
