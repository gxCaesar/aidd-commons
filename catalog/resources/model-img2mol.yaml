caveats:
  - 'No training entry point ships in this repository: the complete file tree holds the inference modules, two example notebooks, a checkpoint download script, the environment files and the benchmark maps, so the README phrase "for training and inference" is not matched by a runnable training script.'
  - No evaluation script ships either; the repository supplies the benchmark collections and their image-to-SMILES maps instead.
  - The README names no training corpus. The benchmark collections are described in benchmark_data/README.md with sizes and rendering libraries, but that document covers the evaluation collections and not the data the released weights were trained on.
  - The benchmark archives and the checkpoint are hosted on Google Drive, and the collections obtained from earlier work are credited without a licence statement in the opened pages.
  - The non-commercial restriction on the checkpoint appears only in the README; the LICENSE file covers the source and states nothing about the parameters.
