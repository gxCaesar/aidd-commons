caveats:
  - The nequip.net listing gives one licence field, CC-BY-4.0, for the model package and does not separate code terms from weight terms, so the MIT terms recorded here come from the repository licence file alone.
  - The foundation potentials are pre-trained on OMat24 and fine-tuned on sAlex and MPtrj. The documentation describes sAlex as a subsample of Alexandria, and no opened page states the redistribution terms for that corpus, so the openness of the complete training corpus is unverified.
  - Two different assets share the OMat24 name. The OMat24 dataset on the Hugging Face Hub is tagged cc-by-4.0, while the OMat24 checkpoint collection published by the same organisation is tagged other and carries a bespoke OMat24 License that incorporates the FAIR Acceptable Use Policy by reference, is non-transferable, and requires a copy of the agreement to be given to third parties. Neither statement covers the sAlex part of the NequIP training corpus.
  - The documentation cites the foundation potentials paper under the title "Fast and Accurate Foundation Models for Equivariant Machine-Learned Interatomic Potentials", while the arXiv page for the same identifier 2607.28461 gives the title "Fast and Accurate Equivariant Foundation Models for Atomistic Simulation".
  - The Zenodo record states that the MP models train solely on MPTrj of about 1.5 million frames and are only recommended for benchmarking and not production work, and that the OAM models are pre-trained on OMat24 of about 101 million frames and then fine-tuned on sAlex of about 10.5 million frames and MPTrj.
