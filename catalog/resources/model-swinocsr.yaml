caveats:
- The openness claims here rest on the repository's own file listing and README, read on 2026-10-23; the code was not run, and no claim is made that the released scripts reproduce the published numbers.
- 'The repository declares no licence: the GitHub licence field is null and no LICENSE file appears in the file tree, so the terms for the code, the bundled dataset archives and the trained checkpoints are unverified and every openness dimension is left unverified.'
- The repository does ship inference, training and evaluation scripts, among them run_ocsr_on_images.py, model/Swin-transformer-celoss/main.py, model/eval.py and the pycocoevalcap metric package, but without a licence their availability for use is not established.
- The trained models and the label files are hosted on Kaggle; those pages rendered only their titles when opened on 2026-10-21, with no description, file list or terms of use, so the checkpoint contents and their licence are unverified.
- The README names the DeepSMILES split files, for example Data/500wan/500wan_shuffle_DeepSMILES_train.pkl, but documents no corpus composition, no source for the molecules and no data terms, and the repository also ships .rar dataset archives whose licence is not stated.
- The article's own data and code availability statements were not read because the publisher page redirected to a sign-in flow, so this record relies on the repository pages only.
- The repository is public and clonable and carries no licence file, so the code is obtainable while the terms under which it may be reused are unstated. The repository has not been pushed to since 2022.
