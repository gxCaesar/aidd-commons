caveats:
  - "The repository ships no pretrained weights of its own. The surrogate and oracle models a user loads, such as ESM-2 or Chemprop, come from their own projects under their own licences, so the weights dimension is unverified for this record."
  - "The framework names the roles of an active-learning loop and separates them in code, but it does not state what a run's result licenses. A campaign that selects a candidate with an acquisition function has not thereby established that the candidate is worth making."
  - "The README gives no data-availability statement and no numerical benchmark results, and the documented case studies are named rather than reported, so the framework's own performance is not established here."
  - "The documented oracle is a scorer over a held-out pool or a live scorer, and the page enumerates no concrete oracle beyond that, so a reader who wants a real laboratory in the loop must supply it."
  - "The paper is recorded from its arXiv identifier and the repository's own README. The article's text was not opened, so the reported comparisons between acquisition strategies are not carried here."
