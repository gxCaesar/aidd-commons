caveats:
- The openness claims here rest on the repository's own file listing and README, read on 2026-10-23; the code was not run, and no claim is made that the released scripts reproduce the published numbers.
- The opened README exposes a test-set model-selection path alongside a validation alternative; do not use test-selected checkpoints in new labs.
- The repository is public and clonable and carries no licence file, so the code is obtainable while the terms under which it may be reused are unstated. The repository has not been pushed to since 2021.
