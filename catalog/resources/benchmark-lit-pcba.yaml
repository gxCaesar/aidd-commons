caveats:
  - The text the canonical page returned on 2026-10-23 states no licence term, and the page renders its content in the browser, so a terms page this review did not open may carry one. The page was re-opened on 2026-10-24 and still states no licence or reuse term, and the record therefore carries an access level without a licence.
  - "The site states its own count as 15 target sets, 7,761 actives and 382,674 unique inactives selected from high-confidence PubChem BioAssay data, and it offers two direct download links, the full data and an unbiased AVE variant, neither of which asks for an account."
  - "The site's data content page names the per-target input files, the protein and ligand MOL2 structures with their PDB identifiers, the active and inactive SMILES files with PubChem identifiers, and separate training and validation SMILES files, and it names the citation to Tran-Nguyen and Rognan. The record carries the count and the file list as the site's own statements and not as a measurement."
  - "The site's citation names two authors, and the published paper carries three, Tran-Nguyen, Jacquemard and Rognan, under DOI 10.1021/acs.jcim.0c00155. The record carries the published byline and notes the difference."
  - "The site carries the copyright line of the Laboratoire d'Innovation Therapeutique and states no reuse terms beyond it, so a reader who needs a grant to redistribute the files has to ask the laboratory."
