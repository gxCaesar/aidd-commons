    label: GTEx Portal API documentation
    supports: [identifiers]
  - id: terms-page
    url: https://gtexportal.org/home/termsPage
    label: Terms page read 2026-10-23
    supports: [caveats]
  - id: license-page
    url: https://gtexportal.org/home/license
    label: The GTEx Portal Data License, read 2026-10-24 from the portal's own licence route, whose text is carried in the portal's application bundle
    supports: [caveats]
caveats:
  - The text the canonical page returned on 2026-10-23 states no licence term, and the page renders its content in the browser, so a terms page this review did not open may carry one.
  - Only open-access files are offered through the portal downloads. Raw DNA/RNA sequences and full donor metadata are protected-access data housed in AnVIL and require a separate application.
  - "No terms statement for the GTEx data could be read on 2026-10-21. The portal pages render their content in the browser and returned no licence text to an automated fetch, so the licence and the redistribution terms stay unverified here rather than being asserted from a summary."
  - "The portal's licence route renders in the browser, and its text is carried inside the portal's own application bundle, which is where the licence was read on 2026-10-24. The record therefore quotes the portal's own wording rather than a third party's summary of it."
  - "The portal names the GTEx analysis releases by their dbGaP accession, from the pilot through the later releases, and states that protected data are available in the AnVIL repository. The open tier and the protected tier are separate resources with separate conditions, and this record describes the portal."
acknowledgements: []
last_verified: "2026-10-24"
