licenses:
  - name: GTEx Portal Data License
    scope: "The portal's own data licence, published on its licence page and read on 2026-10-24. It charges no fees or royalties, requires the user to acknowledge the GTEx Portal as the source with a stated phrase naming the portal and the dbGaP accession, requires a user who republishes or redistributes the data either to keep the most current version or to make known that the product does not reflect the most current data, disclaims any warranty of merchantability or fitness for purpose, and reserves the right to change the type and format of the machine-readable data. It restricts no use, so the data are freely usable, and it is not a standard open licence."
    evidence: [license-page]
evidence:
  - id: download-overview
    url: https://gtexportal.org/home/downloads/adult-gtex/overview
    label: Rendered Adult GTEx overview distinguishing open and protected data
    supports: [name, kind, summary, identifiers, stages, modalities, tasks, caveats]
  - id: api-root
    url: https://gtexportal.org/api/v2/
    label: GTEx Portal V2 API service description
    supports: [name, kind, summary, stages, modalities, tasks]
  - id: api-documentation
