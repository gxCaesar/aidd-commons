caveats:
  - The install script downloads AlphaFold2 parameters from a Google storage bucket and installs PyRosetta from the RosettaCommons release channel, so a full run depends on separately licensed components.
  - The README states that PyRosetta requires a licence for commercial purposes and gives no licence for the ProteinMPNN weights that the user must supply.
  - The README describes an inference pipeline and states no training procedure or training corpus for it.
acknowledgements:
  - "The repository README credits ColabDesign, ProteinMPNN and PyRosetta."
