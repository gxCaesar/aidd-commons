id: tool-bindcraft
name: BindCraft
kind: software
summary: BindCraft is a binder design pipeline that runs AlphaFold2 backpropagation with ProteinMPNN and PyRosetta, filters the resulting designs and stops once a target number of candidates has passed the filters.
