  label: Direct, unauthenticated probe of every listed REST endpoint, 2026-09-12
  supports:
  - caveats
caveats:
- Studies, groups, individuals, interventions, and measured outputs are separate entities; pooled records should not erase their provenance or independent unit.
- 'Study metadata is genuinely public without authentication: fetching all 803 studies from `pkdata/studies/` on 2026-09-12 found 88 carrying the database''s own per-study `licence: "open"` field, and `pkdata/interventions/` returned 4,762 real dosing records with no login. But `pkdata/outputs/` and `pkdata/timecourses/`, the endpoints holding the actual measured PK parameter values, returned zero records under every filter tried, for every study regardless of its own licence field. The underlying NAR paper (PMC7779054) states why independent of this probe: some information is restricted to a limited group of users due to copyright. Do not treat this database as a no-login source of actual PK values without first obtaining and documenting an authenticated access path.'
