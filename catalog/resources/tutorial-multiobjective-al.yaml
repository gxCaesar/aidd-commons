caveats:
- The notebook source is public and MIT-licensed. Its DOCKSTRING input is downloaded separately from Figshare; the repository licence does not establish the dataset's terms, which require their own review.
- The only documented setup is a conda environment file whose contents the README does not reproduce, and the page gives no command for running either notebook.
- The record names the two notebooks and the publications they accompany. The papers' own text was not opened, so the reported retrieval improvements and the comparisons against a greedy acquisition are not carried here.
- A notebook that has been read is a published procedure, not a result. Nothing in the record establishes that a compound selected by either notebook is worth making.
