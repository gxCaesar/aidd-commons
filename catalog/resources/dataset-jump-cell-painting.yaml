caveats:
  - The canonical page could not be read by an automated fetch on 2026-10-24, because the server presents a self-signed certificate in its chain, so the consortium's own project site remains unread by this review and the record's terms rest on the consortium's repository instead.
  - The consortium's README carries a Zenodo badge pointing at record 552371375, and both the record page and its API entry returned HTTP 404 on 2026-10-24, so the archival DOI the README advertises is not established and the record does not carry it as an identifier.
  - The consortium's README states that the collection is a set of Cell Painting image datasets generated by the consortium, that it is hosted under the AWS Open Data Sponsorship Program, and it names the partner organisations whose scientists created the data. The record does not read the object store's own terms.
  - "No licence or terms statement could be read for the JUMP Cell Painting data or the Cell Painting Gallery on 2026-10-21. The public gallery is an object-store listing with no terms attached, and the project site points to a separate hub that returned nothing to an automated fetch, so on that day the licence stayed unverified rather than being assumed from the fact that the files are openly readable. The consortium's own repository licence was read on 2026-10-24 and is what the record now carries, and the gallery listing itself still carries no terms."
