caveats:
  - The README states that the training data and the checkpoints are downloaded, that the released archives hold target structures, multiple sequence alignments and a small-molecule dictionary, and that the large model expects additional distillation datasets that are to be released.
  - The README states that the large model expects additional distillation datasets that are to be released later, so the published training material is partial.
  - The released training archives hold target structures, MSAs and a small-molecule dictionary, and the README states no licence terms for them.
  - The checkpoint model card states no training-data description beyond naming a Boltz-2 base model.
