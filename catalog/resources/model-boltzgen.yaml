id: model-boltzgen
name: BoltzGen
kind: model
summary: BoltzGen is a generative binder design model that takes a design specification and returns ranked candidate designs for protein, peptide, antibody and small-molecule targets.
canonical_url: https://github.com/HannesStark/boltzgen
