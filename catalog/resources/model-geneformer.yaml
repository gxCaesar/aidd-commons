caveats:
  - The README states that the model is pretrained on a corpus of about thirty million human single-cell transcriptomes, and the repository holds no corpus files.
  - The GitHub repository displays no licence and the LICENSE file path returned HTTP 404 when opened on 2026-10-21, so the Apache-2.0 term comes from the linked Hugging Face model card and is not shown to cover the repository source code.
  - The model card names the pretraining corpora Genecorpus-30M and Genecorpus-104M and a roughly 14 million-cell cancer continual-learning corpus, but the model repository file listing holds only model weights, code, and configuration files with no corpus files, and the card gives no per-sample provenance for those cells.
  - The repository README links the Nature paper through a readcube copy and shows no DOI for it, so the DOI in this record comes from the Europe PMC record rather than from the project page.
