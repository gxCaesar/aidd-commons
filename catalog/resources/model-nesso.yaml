caveats:
  - "The README carries no training-data statement at all. It gives no dataset, no label, no preprocessing, no split and no description of how the model was constructed, and it defers the method and the evaluations to the technical report, so the data recipe and the training data both stay unverified."
  - "The weights are published without a checkpoint name, a download command or a statement about whether the model fetches them automatically, so the reader has to find them from a link on the page rather than from an instruction."
  - "The accelerated kernels are stated to be CUDA 12 only, and a reader on CPU or on another CUDA version must use the default installation or pass --no_kernels at runtime, so the published performance figures may not be reachable on every machine."
  - "Two capabilities are stated as still pending on the page, pocket conditioning and structural templating, so the model as published is the plain sequence-and-ligand route."
  - "The page states no units, no sign convention, no confidence measure and no result-file schema for the affinity output, and points to a separate document for the output format."
  - "The paper is recorded from the technical report the model card and the repository both cite. The report's text was not opened, so the reported accuracy and speed are not carried here."
