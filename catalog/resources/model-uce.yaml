caveats:
  - The Figshare record holding the 33-layer model files returned HTTP 403 when opened on 2026-10-21, so the terms of the released weights were not read; the MIT file covers the repository code only.
  - Neither the repository nor the paper abstract names the pretraining corpus. The paper reports an Integrated Mega-scale Atlas of 36 million cells and more than 1,000 named cell types as a product of the model without stating that this atlas is the training set.
  - The README states that the evaluation scripts download the four-layer model files automatically but gives no location for them, so the four-layer checkpoint provenance is also unverified.
