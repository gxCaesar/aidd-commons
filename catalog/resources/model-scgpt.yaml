caveats:
  - The README states that the whole-human model is pretrained on 33 million normal human cells and the brain model on 13.2 million brain cells, and it links the download for each.
  - The README lists "Provide the pretraining code with generative attention masking" as an open item and describes a separate integrate-huggingface-model branch as preliminary support for the pretraining workflow, so the release state of the training code is not settled by the opened pages.
  - The MIT LICENSE file carries the copyright line "Copyright (c) 2022 suber" rather than the scGPT authors, so this record follows the file as the repository licence without resolving who holds it.
  - The model zoo lists cell counts per population and the paper abstract reports a corpus of more than 33 million cells, but no named public corpus is identified as the pretraining data; CellxGene appears in the README only as a source for the reference-mapping feature.
