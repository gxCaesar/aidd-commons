caveats:
  - The README states that "The proteinflow package and data are released and distributed under the BSD 3-Clause License", while the LICENSE file itself is the standard BSD 3-Clause text without a data-specific clause, and the upstream terms of the PDB and SAbDab structures it repackages are not restated.
  - The documentation lists precomputed releases dated up to 2023-12-21, so the packaged datasets are dated snapshots rather than current PDB contents and must be regenerated to track new structures.
  - The documentation names no licence and describes the project only as open source, so the licence above rests on the repository README and LICENSE file.
  - The documentation lists a default test proportion of 0.05 in the API defaults while the worked example passes a test split of 0.5, so the split recipe has to be read from the code before a split is reproduced.
  - Model training is outside this repository, which links a separate ProteinFlow-models repository for a modelling use case, and the documentation mentions metric functionality that is installed only through the processing extra without naming an evaluation entry point.
acknowledgements:
  - The precomputed datasets are generated from Protein Data Bank and SAbDab structures, and the terms of those upstream sources are outside the licence scope recorded here.
