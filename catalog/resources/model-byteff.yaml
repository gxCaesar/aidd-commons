caveats:
  - "The public repository and bundled BDTorsion data are downloadable under Apache-2.0, but the README offers use of the ByteFF model through a free API trial and asks readers to contact the authors by email. This request route establishes gated model access; it does not establish downloadable pretrained weights or grant the API service under the code licence."
  - "The repository is archived and no longer maintained, and the README directs readers to ByteFF2 for current models, code and documentation. A reader who wants the maintained artefact should use that record."
  - "The README lists no downloadable pretrained checkpoint and gives no checkpoint URL. Hosted access is offered through a free API trial, which is a service under its own terms and not a set of weights a reader can run."
  - "The three training phases are stated as pretraining on partial Hessian data, training on partial Hessian and torsion data, and finetuning on energy-force data, and the page names the contents of each kind, but it gives no molecule count and no chemical-space inventory, so the size of the parameterisation corpus is not established."
  - "The repository provides no installation command, dependency list or runnable example, and delegates preparation and training to two README files under its scripts directory that the page did not reproduce."
  - "The benchmark data the repository ships is the BDTorsion benchmark, and the page asks a user to follow the Apache 2.0 licence and cite the paper when using it."
