caveats:
  - "The weights are versioned separately from the force-field names, and the page names two releases: ByteFF-26, the 2026 version trained on the THEMol dataset, and ByteFF-Pol-25, the 2025 release of the polarisable model. A reader has to choose one, and the page does not say which a downstream use should take."
  - "The README does not state the training procedure for either force field beyond a reference to the ByteFF paper's joint-training workflow, and the repository's training code was not established by the page, so the data recipe is unverified."
  - "The README gives no installation command for the force fields themselves, only that the dependencies are in pyproject.toml and that a user should run uv sync."
  - "Running ByteFF2 requires a patched OpenMM at version 8.3.1 and a separate OpenMM-VelocityVerlet, both built from source with the repository's own install script, and GROMACS 2025.3 built from source, so the route a reader follows is a build rather than an install."
  - "The polarisable force field is described as trained on high-level quantum-chemistry data without experimental calibration, which the record carries as the record's own statement and not as an independent measurement."
