caveats:
  - The reviewed LICENSE file states Apache-2.0 while the README states the library is made available under the MIT open source license; this record follows the licence file and preserves the conflict rather than treating the README as controlling terms.
  - The LICENSE file's Appendix stops after the phrase "specific language governing permissions and" and replaces the standard Apache notice boilerplate with "Copyright 2025 Open Molecular Software Foundation".
  - The opened repository does not establish endpoint-specific data provenance, split design, or released model weights.
  - The repository's most recent commit shown is dated 13 October 2026, and the release page lists v0.2.0 as the latest tag.
