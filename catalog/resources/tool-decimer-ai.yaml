caveats:
  - The repository is a GitHub fork of OBrink/DECIMER.ai, and the Zenodo software archive 8139383 documents that upstream project under the same name.
  - The README Zenodo badge points to https://zenodo.org/badge/latestdoi/486488537; neither that identifier nor 4864885 resolved to a live record on 2026-10-21, returning 404 and 410 respectively, so the only resolvable software archive for this project is record 8139383.
  - The hosted service states "© 2025 DECIMER Project. All rights reserved" and links a privacy policy and an impressum; the opened page states no terms of use for the service, and the repository MIT licence does not state that it covers the hosted service.
  - 'No training code ships in this repository: the file tree is a Laravel application with Docker files, and the README places the segmentation, transformer and classifier implementations in separate component repositories.'
  - The container requirements pin TensorFlow and RDKit, but neither the Docker entrypoint nor any other opened page names a checkpoint file, a checkpoint version or the origin of the served model weights, so the weights are unverified.
