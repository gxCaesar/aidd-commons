caveats:
  - The text the canonical page returned on 2026-10-23 states no licence term, and the page renders its content in the browser, so a terms page this review did not open may carry one. The page was re-opened on 2026-10-24 and still renders its content in the browser with no terms in the returned text, so the record carries the portal's terms rather than a page-specific one.
  - The DepMap team's statement of the terms is a statement about the data it hosts, and the record applies it to the PRISM repurposing files because they are reached through that portal and because no separate PRISM terms page was found. A reader who needs a grant for this project specifically has to ask the Broad.
  - The same forum thread records that the portal now puts a captcha layer in front of its file downloads, that the bulk download path redirects to a captcha-protected location, and that the team's answer offers a no-captcha endpoint for the file list. The files are therefore reachable but not by an unattended script.
  - The primary and secondary releases are pooled cancer cell-line chemical-perturbation viability screens with distinct stated compound, cell-line, and dose scopes.
