caveats:
  - The README marks the Plinder pose-model checkpoint as to be provided, so no Plinder weights are established as released.
  - No licence or usage terms are stated for the CrossDocked2020 pockets or for the checkpoints hosted on Google Drive.
  - The code builds on the GFlowNet library at github.com/recursionpharma/gflownet, which is a different repository from GFNOrg/gflownet.
  - The OpenReview forum for the ICML 2025 paper asks for browser verification and was not opened, so the venue statement rests on the repository README alone.
acknowledgements:
  - The README asks users to cite the CGFlow, RxnFlow and TacoGFN papers and credits the Recursion GFlowNet repository and SemlaFlow as prior work.
