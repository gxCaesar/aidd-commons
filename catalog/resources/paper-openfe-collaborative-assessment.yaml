caveats:
  - "The article's own text was not opened, and the figures the search result reported for this paper, a weighted RMSE of 1.73 kilocalorie per mole on the public set and 2.44 on the private set over fifteen companies, more than seventeen hundred ligands, fifty-eight public systems and thirty-seven private ones, are recorded here as the article's own reported figures rather than as a measurement this project made."
  - "The public systems' network files are released under CC BY 4.0, and the private set is not released, so a reader can reproduce the public side of the assessment and not the private side."
  - "The assessment is a benchmark of calculations rather than a measurement of binding, and the record carries no experimental value beside each computed estimate."
