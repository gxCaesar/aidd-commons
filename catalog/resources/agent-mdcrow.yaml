caveats:
- The README states that an API key for a language-model provider is necessary, and it names OpenAI, TogetherAI, Fireworks and Anthropic as the supported providers, so a reader without a provider key cannot run it and the record carries no verified access level.
- The repository hosts no pretrained checkpoint and gives no weights-download procedure. The language models are provider-hosted, and the simulation engine is OpenMM, whose licence is its own.
- The README carries no data-availability statement, names no dataset and gives no repository-hosted data download procedure.
- The README states the licence nowhere; the grant is read from the LICENSE file, which a reader of the README alone would not find.
