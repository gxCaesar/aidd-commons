caveats:
- The README gives no installation, setup or code-execution command, so the record cannot establish that the repository runs. It shows version badges for Python and PyTorch and a link to a web interface, which is a service rather than a command.
- The README names no downloadable checkpoint, model-weight URL or acquisition instruction. The LiTEN-Base, LiTEN-FF, LiTEN-Micro, LiTEN-ADMET and LiTENCLIP names are described as system modules, and the README does not state that pretrained versions of them are available.
- The README states that the platform is continuously updated and that more features and public services will be released progressively. That is a statement of intent, and the record does not treat it as a release.
- The README names PharmaBench, Biogen, ADMETLAB 3.0, DUD-E and LIT-PCBA as benchmarks without giving access links, and carries no data-availability statement.
- The record's access level stays unverified because the repository's own licence covers its source while the route a reader would use, the web interface, is a service under its own terms.
