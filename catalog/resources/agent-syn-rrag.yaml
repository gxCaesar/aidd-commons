caveats:
  - "The README reports its own measurements. On the 150 targets it reports reactant accuracy of 48.0 percent for the full Syn-RRAG pipeline, 46.0 percent for the SFT Llama baseline and 14.7 percent for native Gemini-2.5-Pro, and it reports validity of 100.0 percent, elemental consistency of 100.0 percent and structural compatibility of 99.3 percent from its rule checks at Top-1. It reports the standalone SFT backbone on the WIPO-2M held-out test of about ten thousand products at Top-1/3/5/10 of 44.5, 65.1, 70.8 and 75.9 percent. These are the repository's numbers and not a measurement this project made."
  - "The README defines reactant accuracy as requiring every reference reactant component to appear in the pooled predicted reactants and reagents after RDKit canonicalization, and it pools the two fields because a model may classify a true reactant as a reagent. The README also warns that Top-1, Top-3 and Top-5 taken from a completed Top-10 run are prefixes of the final pooled ranking and need not equal independent runs with a smaller sample count. A reader who compares a prefix number against an independent-run number is comparing two different procedures."
  - "The README's evaluation set is 150 targets randomly sampled from the product-disjoint WIPO-2M held-out test set, and the three wet-lab-confirmed targets in the demo file are a separate short demonstration rather than part of that set. The README states that the framework was experimentally validated by successfully synthesising three virtually screened drug candidates on an automated platform; the record did not read the paper, so it carries the README's statement and not a check of the synthesis."
  - "The README states that the pipeline's reranking and protocol refinement are driven by an external model over an OpenAI-compatible endpoint, with a default reranking model of gemini-2.5-flash and separate credentials for the main model and the reranking model. The code is open, but the default configuration is not self-contained, and a reader who runs it needs those endpoints and their terms."
  - "Training is reproduced by applying a patch to LLaMA-Factory at the pinned commit 2b27283ba0566eda9ec7ac335642807189c87e70, because the patch modifies internal data loading, SFT workflow and trainer files. The patch is environment-specific and has to be adapted, and the README recommends CUDA 12.8 and four GPUs."
  - "The reaction database, FAISS index, index map and the WIPO and USPTO-50K training archives are hosted on a Figshare collection reached through a secret link, and the released checkpoints are hosted on ModelScope. The record could not open either host's terms, so the licence of those assets stays unverified and only the repository's own MIT licence is recorded."
  - "The record establishes what the framework is, how it may be obtained and what its own authors report. It does not establish that a protocol it produces is executable, and no synthesis was run here."
