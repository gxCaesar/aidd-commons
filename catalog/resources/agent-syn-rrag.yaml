id: agent-syn-rrag
name: Agentic-Syn-RRAG
kind: agent
summary: "Retrieval-augmented framework for single-step retrosynthesis and synthesis-protocol generation that runs a Generate-Retrieve-Refine workflow: a locally served supervised-fine-tuned model proposes candidate reactions by reaction-state beam search, RXNGraphormer embeddings drive a FAISS search over patent precedents, a reranking model selects the closest records, and a main model refines the proposal against that evidence into a structured protocol."
