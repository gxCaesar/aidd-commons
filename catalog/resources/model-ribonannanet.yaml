caveats:
  - The repository describes itself as training code and releases no weights of its own; it points to Kaggle notebooks that load pretrained checkpoints and names no Hugging Face repository, so the weights dimension stays unverified.
  - "Two weight locations outside the official repository were found while checking: multimolecule/ribonanzanet, whose card calls itself an unofficial implementation licensed under AGPL-3.0, and roos23/RibonanzaNet, which shows no licence tag and no model card."
  - The linked Kaggle competition page returned only its title, so no data licence or terms could be read from it, and the MIT licence above covers the repository source only.
  - The README describes cross-validation with fold 0 of 6 and out-of-fold predictions written to a local folder, but names no separate evaluation script, so the evaluation dimension stays unverified.
