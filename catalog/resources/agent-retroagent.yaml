caveats:
  - "The README states that the agent is trained end to end with reinforcement learning on the Qwen3-4B-Instruct-2507 base model using the slime framework (Megatron plus SGLang) on a single eight-GPU H200 node, with the policy optimised by GSPO under sequence-level clipping. The record did not run the training, and the released configuration targets that one node."
  - "The README specifies the reward as a base of +1 for a completed route, reduced by a budget penalty of 0.02 per single-step model call beyond twenty calls and a depth penalty of 0.02 per step beyond depth twenty, each capped at 0.3, and by 0.05 per turn with a failed or unparseable tool call, with -1.0 for an incomplete route and -1.5 when a trajectory produced no valid tool call. These are the released constants; a reader who changes them is no longer running the released configuration."
  - "The README states that the weights are published on a Hugging Face repository that holds the weights only, and that repository is published under the Apache License 2.0. The repository also says the building-block and reaction-template data are distributed under the terms stated on the dataset card, and the card labels the DESP-sourced data CC BY 4.0 and the SCScore data MIT."
  - "The README names the data sources the preparation script fetches: a DESP archive on figshare under doi 10.6084/m9.figshare.25956076, an LLM-Syn-Planner dataset, a PDVN archive, the SCScore model, and building blocks originating from eMolecules with route data derived from Retro*. The record did not run the script, so the corpora the model was actually trained on are not established here."
  - "The README describes the evaluation target sets as uspto-190 and chembl-1000, and states that targets appearing in either evaluation set are excluded from the training pool. The record did not check that exclusion against the released files."
  - "A route the agent proposes is a proposal. The record establishes the method, its training recipe and how it may be obtained; it does not establish that a synthesised route is executable or correct."
