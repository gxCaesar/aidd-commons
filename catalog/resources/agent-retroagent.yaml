licenses:
  - name: MIT
    scope: "The repository carries an MIT licence file for the code. The NOTICE file states that the single-step retrosynthesis model vendored under external/desp/ is derived from DESP, from Yu et al., Double-Ended Synthesis Planning with Goal-Constrained Bidirectional Search, NeurIPS 2024, that it remains subject to that project's original licence and attribution, and that the notice points to the upstream repositories for their terms rather than naming a licence. The MIT grant therefore does not reach that vendored component."
    evidence: [retroagent-license, retroagent-notice]
  - name: "Apache-2.0"
    scope: "The Hugging Face weights repository states the Apache License 2.0 and says it is inherited from the Qwen3-4B-Instruct-2507 base model, and it states that the code is released separately under the MIT licence. The Apache grant covers the released weights and the base model it inherits from, not the repository's code."
    evidence: [retroagent-weights]
  - name: "CC BY 4.0"
    scope: "The weights repository labels the DESP-sourced data as CC BY 4.0."
    evidence: [retroagent-weights]
