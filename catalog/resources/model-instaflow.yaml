caveats:
  - The pre-trained weights are released under CC BY-NC 4.0 and inherit the CreativeML Open RAIL-M terms of Stable Diffusion 1.5, so the MIT source licence does not extend to them.
  - The README names no training corpus for the text, noise and image triplets, so training-data provenance is unverified.
  - The README asks users to disable the safety checker when reproducing the paper's MS COCO FID numbers, so those numbers are not produced under the default sampling path.
acknowledgements:
  - The README asks users to cite the InstaFlow ICLR 2024 paper and provides the corresponding BibTeX entry.
