caveats:
  - "The benchmarking workflow is available only in the source repository and is not shipped with the PyPI package, so a reader who installs the published package gets the metrics but not the benchmark data or the evaluation driver."
  - "The README names the PXM series datasets, the RecentPDB low-homology dataset and a legacy dataset, and describes the construction of the low-homology set in terms of filtering, homology scans, clustering and subset labelling. It lists no split name, sample count or release manifest in the page that was read."
  - "The pipeline can rebuild the evaluation dataset from scratch over a chosen time window, which is what makes the benchmark's own dependence on its time window checkable, and the README says so."
  - "The README names no roster of benchmarked models. AlphaFold3, Protenix and Boltz appear as input formats the preparation utility accepts, not as the set of models evaluated."
  - "The Chemical Component Dictionary is taken from Biotite's bundle rather than downloaded, and reference structures are RCSB PDB CIF files, so the tool's inputs come from two other projects' terms."
