caveats:
  - "The page states the headline pretraining size as 266 million single-cell profiles, and the six rows it lists, an unfiltered and a filtered version of CellxGene 2025-01, scBaseCamp 2025-02 and Tahoe-100M, sum to about 269 million. The record carries both figures rather than reconciling them, because the page does not."
  - "The filtered corpora discard the cells with the fewest detected genes, and the page says this can affect cohort selection, so the second pretraining stage is not the same population as the first."
  - "The page gives no formal pretraining objective, loss or masking procedure. It describes the models as perturbation-trained with two-stage pretraining and downstream adaptation, and the record does not supply a more precise statement than that."
  - "The page reports no numerical benchmark result. It names the evaluations, DepMap essentiality, MSigDB hallmarks, cell-type classification across five tissues, and perturbation prediction in unseen contexts, and points to the preprint, so the record carries the names of the evaluations and not their outcomes."
  - "The current codebase supports only the flash attention implementation with the attention mask disabled, and the Triton backend and the custom attention masks used in training the smaller two models are no longer supported, so the released inference path is not the path the smaller models were trained with."
  - "The page states that some training corpora are not publicly downloadable and require an access request, so a reader can obtain the weights without being able to obtain every corpus behind them."
