caveats:
  - "The README names the training and finetuning datasets, QM9, MP20, GEOM-Drugs, QMOF150, OMol25, Matbench and MPtrj, and a script that downloads them from Hugging Face, but the page states no filtering, splitting or curation procedure for any of them, so the recipe behind the named corpora is not established."
  - "The README carries no formal data-availability paragraph. Availability is operational: the datasets come from the download script, the checkpoints from the Zenodo record, and the same record carries ten thousand generated samples as MP20 CIF files and QM9 and GEOM-Drugs PDB files."
  - "The checkpoints are published in many variants, joint and dataset-only, at several model sizes, with and without pretraining, and for several property heads, and the README says the pretraining checkpoints carry both the EMA and the non-EMA generative weights. A reader has to choose one, and the record does not say which a downstream use should take."
  - "The installation instructions require a pinned Triton CPU source checkout, a fork of torch-scatter on some platforms and a roughly thirty gigabyte CUDA image, so the route a reader follows is a build rather than an install."
  - "The paper is recorded from its arXiv identifier and the repository's own README, and the Zenodo record names the venue as ICLR FM4Science 2026. The article's text was not opened, so the reported speedups and transfer results are not carried here."
  - "The Zenodo record publishes thirty-five checkpoint files and the sample archives, and the individual checkpoints run from about four hundred megabytes to about four and a half gigabytes, so the choice of one is a large download and the record does not say which a downstream use should take."
