licenses:
  - name: "CC BY-NC 4.0"
    scope: "The LICENSE file of the repository states the Creative Commons Attribution-NonCommercial 4.0 International license and the line 'You may not use the material for commercial purposes.' The repository README instead states that everything in the repository is licensed under CC-BY-NC-SA 4.0 and adds a 60-day trial licence for internal evaluation and a separate agreement for continued commercial use. The two first-party files therefore state different terms, and the record carries the one the LICENSE file states."
    evidence: [raygun-license]
  - name: "CC BY-NC-SA 4.0"
    scope: "The version stated by the repository README, which also describes the governmental, nonprofit and charitable permission and the 60-day trial licence. It contradicts the LICENSE file, so the two terms are recorded as two readings of the same repository rather than one."
    evidence: [raygun-readme]
