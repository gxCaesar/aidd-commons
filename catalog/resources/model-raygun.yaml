    label: Raygun LICENSE file (reviewed 2026-10-23)
    supports: [caveats]
caveats:
  - "The README and the LICENSE file state different licences for the same repository, CC-BY-NC-SA 4.0 and CC BY-NC 4.0 respectively, so a reader who needs a commercial right has to settle that with the authors."
  - "The README names four checkpoints and the training set each was trained on: raygun_8_8mil_800M on 8.8 million UniRef50 sequences, raygun_4_4mil_800M on 4.4 million, raygun_2_2mil_800M on 2.2 million and raygun_100k_750M on 100,000. It does not state the filtering procedure that produced those UniRef50 subsets beyond the counts."
  - "The README states the installation depends on NumPy, pandas, fair-esm, PyYAML, h5py, einops and PyTorch, and that Lightning and Hydra are used for training. It gives no dated release for any of them."
  - "The paper is recorded from the DOI and the repository's own README and Zenodo record. The article's own text was not opened, so the reported functional retention and the measured affinities are not carried here."
  - "The README documents the model access through the raygun.pretrained imports and gives no separate checkpoint download URL, and it points the trained sequences and benchmarks at a Zenodo record rather than at the checkpoints themselves."
acknowledgements: []
