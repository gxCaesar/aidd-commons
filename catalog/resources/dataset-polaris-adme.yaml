caveats:
  - The dataset page reports 3,521 datapoints in its summary field and 3,516 molecules after curation, and does not reconcile the two figures.
  - The dataset page states no train, validation or test partition, and the published curation notebook configures molecule curation, distribution inspection, outlier detection and stereoisomer activity-shift detection without defining a benchmark split.
  - The upstream source repository README names the six assays and the vendor libraries the compounds were selected from, but states no licence for the source CSV and does not document per-column provenance beyond the assay names.
  - The measurements come from one laboratory group working under a consistent set of conditions over 20 months, so the values are single-laboratory measurements rather than multi-site measurements.
  - The release is openly downloadable under the stated CC BY 4.0 licence, but no opened page declares it as a training release or a benchmark split for a specific model, so the training-data dimension stays unverified.
acknowledgements:
  - The dataset is published by Biogen on the Polaris Hub, the measurements come from Fang et al. (2023), and the curation was performed with the open auroris curation module.
