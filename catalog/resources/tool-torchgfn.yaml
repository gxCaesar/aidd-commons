caveats:
  - The README names example environments but no downloadable dataset, and the repository lists no pretrained checkpoint.
  - A benchmark directory is present but the README shows no benchmark results, so what the benchmark code measures is unverified.
  - This repository is a different project from GFNOrg/gflownet, which carries a different licence; the two are recorded as separate resources.
acknowledgements:
  - The README asks users to cite the torchgfn paper when using the library.
