caveats:
  - The Hugging Face repository holding train_pubchem.csv and train_uspto.zip declares apache-2.0 but its README is empty, so the per-column provenance of the derived files and the upstream PubChem and USPTO terms are not documented. The same repository also hosts the molnextr_best.pth checkpoint and the benchmark archives under that one tag.
  - The Zenodo checkpoint record 13304899 names no training dataset, so the link between that archive and the two training files named in the README is not stated on the record itself.
  - The Zenodo record 13857412 is classified as a Publication and holds only the article PDF; it does not archive the code.
  - The repository LICENSE file is the Apache 2.0 template with the copyright placeholder never filled in, so it records no holder or year for the source.
  - The README cites the paper with the Zenodo DOI 10.5281/zenodo.13857412 in its BibTeX block rather than the journal DOI.
acknowledgements:
  - The Zenodo checkpoint record 13304899 lists Yufan Chen of the Hong Kong University of Science and Technology as distributor, and record 13857412 lists Chen, Leung, Huang, Sun, Chen and Gao with Chen and Gao as supervisors.
