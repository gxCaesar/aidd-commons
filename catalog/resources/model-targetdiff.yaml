caveats:
- The README states that the available supervised checkpoint was trained on PDBBind 2016 and directs readers to PDBBind's own portal for its data. CrossDocked training and evaluation files and model checkpoints follow separate Google Drive links, with the original CrossDocked2020 data available from the linked Pittsburgh server. The MIT software grant does not establish the terms of those external assets.
- The openness claims here rest on the repository's own file listing and README, read on 2026-10-23; the code was not run, and no claim is made that the released scripts reproduce the published numbers.
- The repository's licence file is named LICIENCE. Reading that file establishes MIT terms for the source and documentation; separately obtaining the data and model assets remains necessary, so the access level is source_available.
