licenses:
  - name: Apache-2.0
    scope: covers the Protenix source code and the Protenix-v1 model parameters, protenix_base_default_v1.0.0 and protenix_base_20250630_v1.0.0, per the project README and the LICENSE file; the project statement is not version-specific and the Protenix-v2 restriction below carves the v2 parameters out of it
    evidence: [readme, license]
  - name: Proprietary, no open-source licence
    scope: "covers the Protenix-v2 model parameters only: the project states they are proprietary and confidential information of the rights holder, are not released under any open-source licence, and may not be reproduced, distributed, sublicensed, disclosed or otherwise transferred to any third party without the express prior written consent of the rights holder"
    evidence: [readme]
