caveats:
  - The Protenix-v2 model parameters are proprietary and confidential, are not released under any open-source licence and may not be redistributed; only the v1 parameters are distributed under Apache-2.0, even though the supported-models table still lists protenix-v2 as a supported model.
  - The README states training-data cutoffs and an open training-data pipeline, but neither the pipeline guide nor the download script states licence terms for the underlying structures.
  - The training-data download script pulls processed archives from a project bucket, and the per-component provenance of those archives is not documented on the opened pages.
