caveats:
- The source and examples are public under the repository's MIT software grant, but the usable model runtime depends on separately acquired assets. The README instructs readers to run LigandMPNN get_model_params.sh and install Boltz, or download nise.sif from a separate Hugging Face repository. The NISE licence does not establish the terms of those upstream parameters, training data or container assets.
- The README carries no data-availability statement and names no training corpus, sample date, filtering procedure or split, so the data recipe and the training data both stay unverified.
- The README enumerates no individual checkpoint, weight file or download URL for LASErMPNN, LigandMPNN or Boltz. It documents model access through the LigandMPNN get_model_params.sh script and through a prebuilt execution container, which is an environment rather than a stated checkpoint.
- The protocol depends on LASErMPNN or LigandMPNN for sequence design and on Boltz-1x or Boltz-2x for structure and binding evaluation, and it names only the 1x and 2x variants. No dated upstream release is stated for any of them.
- The paper is recorded from the DOI and the repository's own README. The article's text was not opened, so the reported hit rates and the measured affinities are not carried here.
