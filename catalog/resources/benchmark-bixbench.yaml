caveats:
  - The dataset card documents revised questions and flattened rows in v1.5; results from v1.0 and v1.5 are not interchangeable.
  - Agentic execution requires the configured container and model services; automated scripts can incur substantial API costs. No capsules, containers or trajectories were downloaded or executed here.
  - The grader has distinct multiple-choice and open-answer branches and writes grading columns back into its input CSV. Use a working copy if following upstream instructions.
  - Public evaluation questions are not designated model-training data by this entry. Dataset-card licence metadata does not settle every capsule's third-party terms.
