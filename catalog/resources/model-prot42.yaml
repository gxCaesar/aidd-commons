caveats:
- The arXiv full-text page identifies CC BY 4.0 for the preprint. This establishes the article's terms and does not establish a model or source-code licence.
- The abstract states that the models are publicly available and the paper body points to the Hugging Face organisation inceptionai, but that organisation page states that it "is not operational and only created to reserve the inceptionai domain/user name" and lists no public model, so no weights or code location was confirmed.
- The paper directs readers to the inceptionai Hugging Face organisation, whose page states that it is not operational and lists no public models or datasets. The pages read therefore offer no Prot42 model material, which establishes closed access on these named distribution pages; this is not a claim that no release could exist elsewhere. No model, weight or code licence is established.
- The paper names UniRef50 as the pretraining corpus and the STRING and PDIdb 2010 databases as fine-tuning data, but no Prot42-specific data or code release was located, so these are named corpora rather than verified availability.
- A Hugging Face model search returned no Prot42 model and a GitHub repository search returned no Prot42 repository.
