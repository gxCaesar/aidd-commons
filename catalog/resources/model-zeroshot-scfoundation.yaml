caveats:
  - The study evaluates models released by other projects. The weights it loads come from the scGPT and Geneformer repositories, whose own terms apply to them, and the MIT licence here covers only this repository's notebooks.
  - The README names the tasks as cell type clustering and batch integration and the baselines as scVI and a highly variable gene heuristic, but it does not name the individual datasets inside the Figshare data.zip archive, so the composition of the evaluation set is not verifiable from the opened pages.
  - The preprint abstract reports limited reliability in zero-shot settings and does not name baselines, datasets, splits, or metrics; the released notebooks are the only place where the baseline implementations are shown.
