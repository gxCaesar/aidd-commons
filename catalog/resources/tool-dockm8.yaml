caveats:
  - "The paper's own evaluation reports median relative enrichments of 100 percent on DEKOIS 2.0, 82.59 percent on DUD-E and 8.85 percent on Lit-PCBA. Those are the paper's reported figures and not a measurement this project made."
  - "The paper states that no pose-selection or consensus strategy excels universally and that workflows have to be tailored to the target. A reader who takes the best number from the evaluation and applies it to an unrelated target is using the number the paper warns against."
  - "The paper describes DockM8 as, in its own words, the most comprehensive open-source platform to integrate the complete consensus structure-based virtual screening pipeline, and it reports over 55 million configurable protocols. That is the paper's characterisation of its own scope, and this record does not turn it into an independent comparison of platforms."
  - "The repository's analysis directory is described as carrying the download and extraction scripts, the analysis pipeline and committed literature baselines, and as sufficient to reproduce all figures from the paper. The record did not run them. The repository also states that DockM8 runs on Linux only, with Python 3.10 on Ubuntu 22.04."
  - "The record establishes the platform's scope and its licence. It does not establish that any pose a reader obtains is correct, and no docking was run here."
  - "The evaluation used DEKOIS 2.0, DUD-E and Lit-PCBA. The last of them is a benchmark this project already carries a record for, and the record does not compare DockM8's enrichment on it with any other platform's."
