caveats:
  - "The inspected paper provides construction details and task descriptions but no benchmark-package download or code licence. Packaged release and access remain unverified. Public evaluation data do not establish training-data availability."
  - "The 25 tasks come from July–September 2026 studies selected from 404,019 PubMed records. Agents acquire public data rather than receive bundled files. Reported cutoffs, date filters and source restrictions reduce leakage risk without proving absence of prior exposure or answer-bearing sources."
  - "Each condition is repeated three times. Across eight models, data and tools improve average pass rate by 47 percentage points. The best open-weight and closed-weight results are 81.3 and 94.7 percent. These are descriptive model comparisons, not a causal effect of weight accessibility."
  - "Passing measures agreement with the published reference within the scoring tolerance, not comprehensive methodological correctness. A correct answer need not follow a correct analysis. This record did not run the tasks."
