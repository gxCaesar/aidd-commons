caveats:
  - "No source-code repository was located for this model: a GitHub repository search for PPI-Llama2 returned no results, and the model card states no code link, so the code dimensions stay unverified."
  - The weights repository is manually gated, so the published files are reachable only after the stated conditions are accepted, and the conditions themselves were not displayed on the opened page.
  - The weights are derived from Meta's Llama2, whose own licence terms the model card does not restate.
  - The card states that the model was trained on protein-protein interaction sequences without naming the corpus or how it was assembled, so the data dimensions stay unverified.
  - The OpenReview forum page for the paper returned a browser-verification screen instead of the record, so the paper text was not read; the abstract comes from the ICLR 2024 session listing.
