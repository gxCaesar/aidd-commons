caveats:
  - "The full text links a public Apache-2.0 evaluation toolkit. Its external pretrained model weights are downloaded separately. This record has not established that the repository packages every input and output needed to reproduce the paper."
  - "The benchmark evaluates structure-prediction models used as verifiers and compares representative open-source generative methods on ten protein targets under one fixed protocol, with metrics for per-sequence success, performance inside a fixed 24-hour budget and cluster-level success for structural diversity."
  - "The paper's own central finding is that filtering rules, success definitions and throughput-aware evaluation produce different conclusions about efficiency, success rate and diversity, and that the choice of verifier carries substantial verifier-dependent bias with limited agreement even under identical filtering protocols."
  - "The paper reports per-method comparisons. Its generative-method success criteria are computational filters, not newly measured wet-lab hit rates. Verifier analysis on the Cao energy-designed binder dataset may not fully generalize to deep generative designs. This record did not run the benchmark."
