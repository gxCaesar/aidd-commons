caveats:
  - The README names its tutorials through the link labels combosciplex, Norman, and Kang but does not state which dataset any released checkpoint was trained on, so the training corpus is unverified.
  - Pre-trained models and datasets are delivered from a single Google Drive collection whose per-file terms are not stated on the opened page, and the BSD-3-Clause file covers the repository code only.
  - The paper abstract reports that the genetic screen used a Perturb-seq experiment and that newly generated combination data were used, without naming the datasets or giving splits.
