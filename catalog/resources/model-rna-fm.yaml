caveats:
  - The README states that "This source code is licensed under the MIT license" and separately lists RNA-FM as MIT in a related-model table whose scope is not defined, while the checkpoint host cuhkaih/rnafm that the README names for download declares license apache-2.0. Both statements are recorded and neither is withdrawn.
  - The model card at the ml4bio/RNA-FM weights link returned HTTP 401 without authentication, so the licence of that copy could not be confirmed and the Hugging Face model API returned the same status for it.
  - The README names RNAcentral100 as the pretraining corpus and the 15 percent masked-token objective, but pins no corpus snapshot, so the exact pretraining set cannot be reconstructed from the repository.
  - The repository documents the model description and inference scripts but names no training script and no benchmark evaluation harness, so the training and evaluation dimensions stay unverified.
