caveats:
- The repository lists no LICENSE file and states no licence string, so access level and licence terms stay unverified.
- The README names no training dataset and no checkpoint, so neither the training corpus nor any released weights can be established from the opened page.
- The README's clone command points at github.com/AlgoMole/MolFM rather than this repository, and the two paths were not compared here.
- The OpenReview entry asks for browser verification and was not opened, so the venue attribution rests on the repository README and the NeurIPS poster page.
- The repository is public and clonable and carries no licence file, so the code is obtainable while the terms under which it may be reused are unstated. The repository has not been pushed to since 2024.
