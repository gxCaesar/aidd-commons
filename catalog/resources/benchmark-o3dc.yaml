caveats:
  - The text the canonical page returned on 2026-10-23 states no licence term, and the page renders its content in the browser, so a terms page this review did not open may carry one.
  - "The page was re-opened on 2026-10-24 and still states no licence. The site's own resources are a stylesheet, the application bundle, the benchmark catalogue at data/benchmarks.json, a contact address and a Cloudflare challenge widget, and the application bundle contains no occurrence of licence, copyright, terms of use or attribution. The index is therefore readable and reusable, and it states no terms of its own."
  - "The catalogue lists entries with a name, a category, an author or maintainer, a repository, a citable site, a description, task labels, a required caveat and a live leaderboard or submission URL. Each entry names the project that owns the benchmark, and the index is a directory of other people's resources rather than a distribution of them."
