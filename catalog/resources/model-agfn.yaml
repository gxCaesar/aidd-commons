caveats:
  - The README states that the model was trained on 6.75 million Enamine compounds, which is the catalogue the corpus was drawn from and how large it was.
  - The AGFN-large checkpoint is trained on 6.75 million Enamine compounds, and the README gives no provenance, licence or usage terms for that set.
  - Only the AGFN-large checkpoint is released; the README states that weights for the smaller AGFN models are still to come.
  - The repository-level MIT licence covers the code and is not stated to cover the pretrained checkpoint or the Enamine compounds.
