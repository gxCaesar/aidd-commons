caveats:
  - The README states that the MACE-MP models are trained on the raw DFT energies of the Materials Project trajectories and that the PolarMACE checkpoints are trained on the OMol25 dataset.
  - The README's License section links to a file named MIT.md that the repository does not ship; the licence text is in LICENSE.md.
  - The release notes for the mace-mp-0, mace_mp_0b, mace_mp_0b2, mace_mp_0b3 and mace_mpa_0 tags carry no licence statement, so the MIT status of the MACE-MP and MACE-MPA checkpoints rests on the two README tables, while the newer release notes state ASL explicitly.
  - "The two README tables disagree on the element count of the MACE-OMOL-0 checkpoint: the mace-foundations table gives 83 elements and the MACE README table gives 89."
  - Training-data availability is claimed for the MACE-MP checkpoints, which the README states are trained on MPtrj selected from Materials Project relaxation trajectories. MACE-MPA-0 adds sAlex, a subsample of Alexandria, whose redistribution terms are not stated on any opened page, so the openness of that part of the corpus is unverified.
  - The two README tables name the OMAT, OMOL, MATPES and SPICE corpora for the non-MP checkpoints without stating their licences or their redistribution terms, so the training-data claim in this record is limited to the MPtrj-trained MACE-MP checkpoints.
  - The figshare page for the MPtrj dataset returned HTTP 403 during this review, so the dataset's own licence text was not inspected.
  - The repository ships a preprocessing script that converts xyz configurations into a training-ready HDF5 file, and the model tables name the level of theory per checkpoint, but no opened page documents the full procedure used to select and label the training structures.
  - The README states that the MACE-MP models are trained on MPTrj raw DFT energies from VASP outputs and are not directly comparable to Materials Project or CHGNet energies, which carry MP2020Compatibility corrections for some transition metal oxides, fluorides and anions.
