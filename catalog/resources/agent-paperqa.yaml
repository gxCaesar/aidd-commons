caveats:
  - PaperQA2 names a system family, not a pinned package; the repository moved to calendar versioning in December 2025.
  - The local-document workflow requires supplied documents and configured language/embedding models. Default services may require API credentials and payment; no service was invoked here.
  - The README distinguishes public local-document use from research-paper searches using tools and licensed access that cannot all be shared. Cited answers are not independently validated scientific findings.
