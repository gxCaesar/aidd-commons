id: benchmark-multipardigm-docking
name: Multi-Paradigm Docking Benchmark
kind: benchmark
summary: Benchmark that scores six physics-based docking approaches and four co-folding models on the same systems with RMSD and PoseBusters tables, and publishes the poses and the per-system ranking scores so that a reader can read the result inside one similarity stratum rather than in one aggregate.
