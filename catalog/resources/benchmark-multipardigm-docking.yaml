caveats:
  - "The deposit holds RMSD and PoseBusters result tables for six docking approaches, Vina, GNINA, ICM, ICM-RTCNN, SurfDock and UniDock2, with the ligand poses in SDF archives, the inputs as Vina and GNINA PDBQT files and precomputed ICM docking maps, and co-folding tables for AlphaFold 3, Boltz-1, Chai-1 and Protenix with each method's top-five protein-ligand complexes in CIF archives and per-system ranking_scores.csv files."
  - "The record carries the deposit's own inventory. It did not run any docking engine or co-folding model, and it does not report a ranking of the systems."
  - "The benchmark's own point, as the index that lists it puts it, is that results have to be read inside a similarity stratum, because aggregate numbers mislead when a co-folding model has memorised training-like targets. A reader who takes the aggregate tables alone loses the benchmark's main finding."
