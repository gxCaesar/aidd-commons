caveats:
  - The repository states that version 2 was retrained from scratch with Chemprop v2 and without RDKit fingerprints, so its predictions do not exactly match the version 1 models in the Zenodo archive or in the published paper.
  - The version 2 Chemprop checkpoints are bundled in the package resources and carry no licence statement beyond the repository MIT file, while the version 1 weights and the Therapeutics Data Commons data and benchmark splits in the Zenodo archive are under Creative Commons Attribution 4.0.
  - The README names the Therapeutics Data Commons ADMET datasets as the training source and the Zenodo archive ships the TDC data, features and five-split benchmark files, but the opened pages do not document the curation, filtering or split rules used to build the released benchmark splits.
  - The repository's most recent commit shown is dated 22 February 2026, where the package version was bumped to 2.0.1.
