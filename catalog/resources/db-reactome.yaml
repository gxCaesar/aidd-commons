caveats:
- The license agreement read on 2026-10-23 states that all data in the Reactome database and the files derived from that data are under the Creative Commons Public Domain Dedication, and that a user may copy, modify and distribute them, even for commercial purposes, without asking for permission. The pathway illustrations, the icon library and the branding material are under CC BY 4.0 instead, so the grant differs by artefact.
