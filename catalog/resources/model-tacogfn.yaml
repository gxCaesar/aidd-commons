caveats:
  - The README states no licence or usage terms for the CrossDocked2020 and ZINCDock-15M datasets or for the Figshare package that holds the trained weights, pharmacophores and pocket graphs.
  - The code modifies the GFlowNet library at github.com/recursionpharma/gflownet, which is a different repository from GFNOrg/gflownet.
  - The repository is also reachable at github.com/tsa87/TacoGFN-SBDD, which is the path the CGFlow README links to.
acknowledgements:
  - The README states the code modifies the GFlowNet library for graph and molecular data maintained by Recursion.
