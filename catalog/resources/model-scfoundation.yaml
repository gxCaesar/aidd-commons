caveats:
  - The repository code is Apache-2.0 while the weights are governed by a separate non-commercial research licence, so the two terms are not interchangeable and a reader must pick the one that matches the asset being used.
  - The README gives the pretraining scale as over 50 million human single-cell transcriptomes and ships DataSupplement1.xlsx and DataSupplement2.xlsx with the collection workflow, but it does not name the source datasets, so the corpus composition is not verifiable from the opened pages.
  - The online inference and command-line tooling is hosted at aigp.biomap.com, and the opened pages state no terms for that service.
acknowledgements:
  - The repository acknowledgements list scvi-tools, SAVER, DeepCDR, SCAD, GEARS, DeepSpeed, Docker, einops, MMF, NumPy, Pandas, PyTorch, PyTorch Lightning, PyYAML, Scipy, and tqdm, and note that third-party software referred to in that section may be governed by separate terms and conditions.
