caveats:
  - "The repository is public and carries no licence file, so the framework is openly readable without a stated grant and the record carries no licence name."
  - "The framework's own repository holds the datasets, the approach environments, the benchmark logs and the result tables, and its own last activity is dated 9 October 2026."
  - "The paper's stated scope is more than twenty representative approaches evaluated under consistent conditions across multiple datasets and partitioning strategies, and the paper says the literature-based comparisons it set out to fix were difficult to interpret because of inconsistencies in datasets, preprocessing pipelines and evaluation protocols. It says nothing about how graph-based approaches compare with descriptor or fingerprint baselines, so a reader who takes its ordering as a field-wide ranking reads more into it than the paper claims."
  - "The record did not run the framework."
