caveats:
  - REINVENT 4 is distinct from the archived REINVENT 3.2 repository; configuration, environment and prior-model instructions must match the selected version.
  - The README links public priors on Zenodo, but that archive was not successfully inspected in this review; weights, their terms and training-data availability remain unverified here.
  - Some optional scoring components and tests require a proprietary OpenEye licence. A software licence does not grant access to every scorer.
  - Upstream test instructions warn that MAIN_TEST_PATH must not already exist because test cleanup removes that directory. No upstream tests or generation workflows were run here.
