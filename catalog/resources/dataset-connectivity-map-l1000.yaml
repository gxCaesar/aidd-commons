caveats:
  - The text the canonical page returned on 2026-10-23 states no licence term, and the page renders its content in the browser, so a terms page this review did not open may carry one.
  - CLUE announced retirement of its site and tools effective 2026-01-31; a reachable historical page does not establish a functioning query service. The notice points public data users to GEO.
  - The historical nine-cell-line Touchstone reference is not the scope of every public LINCS release. Select the GEO accession, data level, perturbation and cell metadata explicitly.
  - "Within one series (checked on GSE70138), an older dated Level 2 release can use simplified, non-joinable column labels (for example `A375-trt_cp-5`) that do not appear anywhere in the current inst_info/sig_info metadata files, verified by fetching it directly and finding zero matching labels; only a release whose column IDs are real inst_id/sig_id values (checked: the 2017-03-06 files) joins to compound identity, dose and time. Always verify a fetched file's column IDs against its own metadata before assuming a join."
  - "The 978-landmark-gene Level 2 files for GSE70138 are a few hundred MiB and directly measured; the full 12,328-gene Level 4 (Z-score) and Level 5 (aggregated signature) releases for the same series are 14 GB and 5.4 GB respectively (checked 2026-09-12), well outside a CPU-first teaching scale, and include computationally inferred genes alongside the measured landmark set."
  - "The GEO series record for this release states no per-series licence, so the licence and the reuse terms of the archived files stay unverified. The archive's general submission and download conditions are not a statement about this series."
