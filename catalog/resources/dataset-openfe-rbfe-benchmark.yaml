caveats:
  - "The record carries eight files, one per system, each a bzip2-compressed JSON list holding the chemical systems, the ligand atom mappings, the transformations and the per-repeat and per-generation estimates. One file was read on 2026-10-23 and held 44 mappings, 22 of them solvent and 22 complex, and 132 estimates whose magnitudes run from about minus 47 to plus 53 kilocalorie per mole. The other seven were not read, so the record carries that one file's shape rather than a claim that all eight match it."
  - "The deposited values are computed estimates, not measurements, and the record does not carry an experimental value beside each one, so a reader cannot compute the error of a single edge from the record alone."
  - "The paper reports that the calculation used the openff 3.0.0 alpha1b and OPC3 force fields, and the deposited file names carry that same version string. The licence of those force fields is not part of this grant."
