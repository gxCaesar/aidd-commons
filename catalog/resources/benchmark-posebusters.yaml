caveats:
  - Paper benchmark data are downloaded from the separate Zenodo record under CC BY 4.0; the MIT repository licence covers code, and neither grant settles upstream structure-source terms.
  - "DiffDock's RMSD-only success rate on the Astex Diverse set (72%, poses within 2A of the crystallographic ligand, no validity requirement) is not the same statistic as the combined RMSD<=2A-and-PB-valid rate the paper reports for the same method on the same set (47%); reporting only the first number overstates what the second establishes. The gap between classical docking (Gold, AutoDock Vina) and the best deep-learning method (DiffDock) on the combined metric also widens sharply on the paper's own harder, less-overlapping PoseBusters Benchmark set (47%->12% for DiffDock, versus a much smaller shift for the two classical tools), which the paper's own text attributes to generalisation rather than to physical validity alone. Verified by fetching the paper directly (arXiv abstract and full HTML text), not from a search snippet."
