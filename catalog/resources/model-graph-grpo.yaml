caveats:
  - The README states that the base graph model is pretrained on ZINC250k for the molecular tasks, and ZINC is a public corpus.
  - The Hugging Face collection page lists the Apache-2.0 identifier, states no further conditions and carries an empty README, so the scope of the weight licence is only as wide as that identifier.
  - The README states no licence or usage terms for the ZINC250k, Planar, Tree or SBM datasets.
  - The README describes the model as a DeFoG-style discrete flow model whose released DeFoG weights can be used directly, so the two checkpoint sets are not independent artifacts.
acknowledgements:
  - The README acknowledges DeFoG, Flow-GRPO, mol_opt, GDPO, PyTDC and AutoDock Vina.
