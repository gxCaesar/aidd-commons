id: db-iedb
name: Immune Epitope Database
kind: database
summary: Curated immune epitope database with experimental and submitted data exports for epitope, antigen, assay, and receptor entities.
canonical_url: https://cedar.iedb.org/database_export_v3.php
identifiers:
  - scheme: api
    value: "IEDB Query API"
    url: https://query-api.iedb.org/docs/swagger/
stages: [biologics-design, data-intake]
modalities: [protein, peptide, antibody, t-cell-receptor]
tasks: [epitope-evidence-retrieval, immunogenicity-data-retrieval]
relations: []
status: { value: active, evidence: [export-page] }
access_level: { value: open_source, evidence: [export-page] }
openness:
  inference_code: { value: unverified }
  training_code: { value: unverified }
  weights: { value: unverified }
  architecture: { value: unverified }
  data_recipe: { value: unverified }
  training_data: { value: unverified }
  evaluation_code: { value: unverified }
licenses:
  - name: CC-BY-4.0
    scope: "The licence the export page itself declares, as Dublin Core metadata on that page reading http://purl.org/dc/terms/license with the value https://creativecommons.org/licenses/by/4.0/, alongside a provenance link to the SciCrunch record SCR_006604. The grant covers the IEDB database exports; the record did not read the export itself."
    evidence: [export-page]
evidence:
  - id: export-page
    url: https://cedar.iedb.org/database_export_v3.php
    label: IEDB database export page, re-opened 2026-10-24, which is publicly readable and carries its licence as Dublin Core metadata
    supports: [name, kind, summary, stages, modalities, tasks, caveats]
  - id: api
    url: https://query-api.iedb.org/docs/swagger/
    label: IEDB Query API documentation
    supports: [identifiers]
caveats:
  - IEDB records are curated from publications or submissions; a database association does not by itself establish an epitope's therapeutic mechanism or population-level response.
  - "The export page renders its content in the browser, so the only text an automated fetch receives is the page title. The licence was read from the machine-readable Dublin Core metadata the page carries, which is the page's own declaration, and the record did not download the export itself."
  - "The export page names the SciCrunch record SCR_006604 as the resource the page was generated by, and the IEDB also publishes a query API whose documentation is publicly readable. The record read the export page and the API documentation, and did not run a query against the API."
acknowledgements: []
last_verified: "2026-10-24"
