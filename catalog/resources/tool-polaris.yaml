caveats:
  - The Apache-2.0 licence covers the client library only; the hosted service is operated by Valence Labs under the Polaris Platform Agreement, which restricts redistribution of the platform and use for a competing service.
  - The client library's most recent commit shown is dated 30 July 2025, while the hosted service is live and lists datasets, benchmarks, competitions and models.
  - "The Hub's own curation guidance is incomplete: the small-molecule guidelines page marks the Data Curation paper as Planned and the Splitting Methods paper as In Progress, so no published curation or split rule is available."
  - The models page lists six models but shows no weight or checkpoint download and no model-specific licence, so the weights dimension stays unverified.
