caveats:
  - "The canonical page could not be read on 2026-10-23 (<urlopen error [SSL: CERTIFICATE_VERIFY_FAILED] certificate verify failed: certificate has expired (_ssl.c), so no terms statement was established. The page resolved on 2026-10-24, but it renders its content in the browser, so the terms come from the agency's own downloadable-data page rather than from the dashboard itself."
  - Dashboard search and integrated predictions do not establish that a record is an experimental toxicity measurement or a suitable training label.
  - The dashboard serves integrated predictions alongside the measured data. The record did not open the code behind those predictions, so the inference code and the weights stay unverified; the ctxR package it publishes is a client for the agency's APIs.
