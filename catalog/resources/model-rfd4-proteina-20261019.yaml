caveats:
  - The flow model and autoencoder form a matched pair. Components from incompatible releases do not define the same latent space and must not be mixed.
  - The model card attributes its published efficiency measurements to the previous release pair in an October 9, 2026 benchmark. Those measurements have not been repeated on the 2026-10-19 pair and do not describe its measured performance.
  - Computational filter passers per GPU-hour are not experimental binder yields. No model inference or benchmark was run for this record.
  - The published training data cover a PDB- and AlphaFold DB-derived subset, not the full training mixture. Other distilled, synthetic, small-molecule, RNA and protein-ligand components are omitted. A source snapshot date is not a universal checkpoint training cutoff, and subset availability does not establish which components trained a particular checkpoint. The training-data field therefore remains unverified for the named checkpoint pair.
  - Published metadata and the loading and sampling recipe cover the released subset. Complete reconstruction of the named pair's training population remains unverified, so the data-recipe field does not promote that subset recipe to a complete model-training recipe. Evaluation-code availability identifies the published scoring interface, not a local reproduction of the earlier comparative benchmark.
  - The released checkpoints initialize inference or fine-tuning, but do not contain the full optimizer and loop state needed to resume an interrupted training run. Optional refolding environments and weights are separate assets.
