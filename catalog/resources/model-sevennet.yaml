caveats:
  - No opened page states a licence for the SevenNet checkpoints. They are published as GitHub release assets while the repository ships an MIT licence for the code, and both the documentation and the release notes are silent on the checkpoint terms.
  - SevenNet-Omni and SevenNet-MF-ompa are trained on 15 open ab initio datasets that the documentation names only as task labels such as mpa, matpes_r2scan, omol25_low, oc20, oc22 and odac23. It names MPtrj, sAlex and OMat24 for the mpa, omat24 and multi-fidelity tasks, and sAlex is a subsample of Alexandria, whose redistribution terms no opened page states, so the openness of the full training corpus is unverified.
  - Two different assets share the OMat24 name. The OMat24 dataset on the Hugging Face Hub is tagged cc-by-4.0, while the OMat24 checkpoint collection published by the same organisation is tagged other and carries a bespoke OMat24 License that incorporates the FAIR Acceptable Use Policy by reference. Neither statement covers the sAlex part of the SevenNet training corpus.
  - The documentation states that the mpa task is trained on the combined MPtrj and sAlex datasets and is the recommended default for PBE(+U) applications, and that a different task must be selected when consistency with a specific functional, dataset or benchmark protocol is required.
  - The SevenNet README states that the core model is based on NequIP, so results attributed to SevenNet and to NequIP are not independent of that shared architecture.
  - The pretrained documentation reports F1 and RMSD on the WBM dataset and the SRME from phononDB, with a combined performance score, but the opened pages give neither the metric definitions nor the evaluation code behind them.
  - The publisher page for the Journal of Chemical Theory and Computation article was not opened during this review, so the citation is recorded as the README states it and not from the article itself.
