caveats:
  - The model card declares the model under the MIT License and names the two repository checkpoints, but the README describes the training corpus only as data generated through the workflows introduced in the MatterSim manuscript, and no opened page identifies a distributed training corpus, so the openness of the training data is unverified.
  - The model card states that the released checkpoints are trained on an internal implementation of the M3GNet architecture, and the repository does not publish that implementation.
  - The model card's Bias, Risks and Limitations section states relatively low accuracy for organic polymeric systems and a training bias toward a PBE variant with known limits across chemical space, and it recommends fine-tuning for surfaces, interfaces and long-range systems.
  - More advanced pretrained versions of MatterSim and additional materials capabilities are offered through Azure Quantum Elements, a hosted product. The opened pages state no licence for those versions, so they are not covered by the MIT terms recorded here.
  - The model card lists test sets sampled from MPtrj and from Alexandria, and the opened pages state no redistribution terms for the Alexandria subset.
