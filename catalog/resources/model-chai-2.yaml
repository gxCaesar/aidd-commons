caveats:
  - The text the canonical page returned on 2026-10-23 states no licence term, and the page renders its content in the browser, so a terms page this review did not open may carry one.
  - The chai-lab repository states licence terms for Chai-1 only and gives no code or weight terms for Chai-2, so the Chai-2 weights stay unverified.
  - The product page offers an access form for commercial organisations and limited non-commercial academic use, and states no licence grant, pricing or detailed usage conditions.
  - The product page describes Chai-1 in neither model nor access terms.
