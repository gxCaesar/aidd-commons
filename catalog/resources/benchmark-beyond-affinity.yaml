caveats:
  - "The paper's own reported pattern is that three-dimensional methods generally produce stronger affinities but may have weaker chemical validity or pose consistency, that one-dimensional methods are dependable on conventional molecular metrics but seldom reach the best affinities, and that two-dimensional methods offer a middle ground. The paper's own argument is that affinity is not a complete success criterion, because a favourable binding score can coexist with invalid chemistry or an inaccurate docking pose."
  - "The affinity the benchmark measures is a docking oracle score rather than an experimental measurement, so the ranking inherits the known biases of docking scores. The record carries the paper's framing and does not turn the oracle into a measurement."
  - "The code repository carries no licence file, so the code is openly readable without a stated grant. The repository was created in July 2025 and last updated in August 2025, while the article is a January 2026 preprint, so the record notes the two dates rather than assuming they describe the same artefact."
  - "The article states that all the code used for the benchmark is available through that repository. The record did not run it."
