caveats:
  - The linked folder is publicly viewable and lists a ckpts folder and a data folder, but states no licence, attribution rule, or other terms for the distributed files, and the MIT licence above covers the repository source only.
  - The README states that "the two models heavily overfitted the training set" and that early training steps are therefore selected for evaluation, so published numbers describe early checkpoints rather than converged ones.
  - The repository tree contains eval and evaluate directories, but the README identifies no evaluation command, so the entry point for the evaluation code is not documented.
  - The README names no training corpus, and the distributed data folder contents could not be listed beyond its name, so the training data dimension stays unverified.
