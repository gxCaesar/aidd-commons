caveats:
  - "The repository is gated, and its approval setting is automatic, so access follows a request rather than being open. The record's access level is therefore gated rather than open."
  - "The model card and the repository's files return an unauthorised status to an unauthenticated reader, so the record could not read what the repository says about its architecture, its training data, its checkpoint names or the construction of the data it ships. Every openness dimension except the access level and the licence is unverified, and that is a statement about what the record could establish, not a claim that the repository lacks them."
  - "The repository's file listing was visible to the record's unauthenticated request and names a training and a validation dataset with and without a structure representation, an inference example under the L1000 target, and a runner configuration, but the contents of those files were not read."
  - "The record carries no paper identifier for the model, because the model card that would carry it was not readable, and the identifier list holds only the repository itself."
  - "The name and the repository path are recorded as the project published them. The record did not read the model card, so the summary of what the model does rests on the repository's own metadata and on the project's public description of it."
