caveats:
- The legal notices read on 2026-10-23 state that each version of the SPDX Specification is offered in its entirety under the Community Specification License 1.0 together with the Creative Commons Attribution License 3.0 Unported, and they set the conditions under which the SPDX trademarks may be used. The separate repository that publishes the licence-list data carries no licence file, so the data files themselves are not covered by this grant on the record.
- SPDX expressions describe licences but do not resolve an upstream resource's legal scope.
