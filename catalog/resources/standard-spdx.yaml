  scope: The legal notices state that each version of the SPDX Specification is offered in its entirety under the Community Specification License 1.0 together with the Creative Commons Attribution License 3.0 Unported, and that the trademark licence is conditional on complying with that specification. The grant covers the specification documents. The separate repository that publishes the licence-list data carries no licence file, so the data files are not covered by this grant on the record.
