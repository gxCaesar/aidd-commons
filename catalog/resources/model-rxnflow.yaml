caveats:
  - The README advertises no downloadable pretrained checkpoint; the sampling example only points at a checkpoint produced by a local training run.
  - The example library ships 5,000 ZINC building blocks and the README mentions eMolecules and Enamine as alternatives, without stating terms for any of them.
  - The repository requests citations for both the ICLR 2025 paper and a 2026 bioRxiv preprint, so the two references are not interchangeable.
acknowledgements:
  - The README asks users to cite the ICLR 2025 RxnFlow paper and the bioRxiv preprint on synthesis-aware generative design.
