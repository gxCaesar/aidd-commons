caveats:
  - The text the canonical page returned on 2026-10-23 states no licence term, and the page renders its content in the browser, so a terms page this review did not open may carry one. The agency's own downloadable-data page was read on 2026-10-24 and states the open-data position directly.
  - ToxCast records are heterogeneous in vitro assays; assay endpoint, concentration-response processing, and biological interpretation must remain attached to each use.
  - "The agency's generation page states that the assay data arrive from numerous vendors in heterogeneous formats, that vendor-specific R scripts transform them into a standard computable format and load them into the tcpl database, and that generalized processing functions then process, normalize, model, qualify and visualize them. That is the documented recipe; the record did not run the pipeline."
  - "The most recent release the agency names is invitrodb v4.3, released in August 2025, with the tcpl and tcplfit2 packages published alongside it. The record did not open the versioned deposit itself, so it carries the release name and the agency's terms rather than a check of the files."
