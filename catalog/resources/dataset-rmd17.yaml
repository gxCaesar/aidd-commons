caveats:
  - The official version-4 record supports the dataset and metadata licence only; it does not establish openness claims for code, weights, architectures, training recipes, or evaluation implementations.
  - "The deposit could not be opened by an automated fetch on 2026-10-24: the Figshare article page and its API returned HTTP 403 to both a browser client and a plain HTTP client, and the DOI resolver reached the same refusal. The licence this record carries was read from the deposit on an earlier date, and the access level stays unverified rather than being inferred from the licence."
  - Molecular-dynamics frames are time-correlated. The versioned files do not turn frames within one molecular system into independent generalisation units.
