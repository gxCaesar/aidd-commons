caveats:
  - This version is distinct from the earlier BixBench question-and-capsule evaluation. The paper evaluates 20 tasks containing 138 artifacts, with the objective and high-level method supplied to the agent.
  - Artifact grading aligns identifiers and evaluates numerical or categorical agreement. A task score is the fraction of its artifacts that pass, not a binary declaration that the complete study was reproduced.
  - Agreement with published artifacts does not independently validate the original biological conclusion. A separate model judge assesses process and failure modes; its judgment is not the deterministic artifact score.
  - The runner requires a billed GCP project, provider APIs, and separately obtained Cell Ranger and Cell Ranger ARC binaries under their own terms. Public code does not make a run fee-free or dependency-free.
  - Task and grader development used model attempts and expert-reviewed artifacts. This exposure belongs to the evaluation history and must not be relabelled as untouched confirmation.
  - Inference-code availability refers to the public agent runner, not released weights for the models it calls. Task inputs and reference artifacts are evaluation assets, not a model training-data release. No benchmark or paid service was run for this record.
