caveats:
  - "Two sources use the name HELM-BERT with different pretraining corpora: the repository README describes about 75,000 peptides from ChEMBL, CREMP, CycPeptMPDB and Propedia, while the arXiv preprint reports 39,079 peptides. The hosted weights do not state which corpus they used."
  - The README states that the paper revision of the weights was pretrained on three databases with CREMP and the Warmup-Stable-Decay schedule omitted, without naming the three databases.
  - For the peptide-protein interaction task the README uses facebook/esm2_t33_650M_UR50D as the protein encoder, so the reported interaction numbers are not produced by HELM-BERT alone.
  - The README reports benchmark metrics and ships random, scaffold and aCSM split files, but names no separate evaluation script, so the evaluation dimension stays unverified.
