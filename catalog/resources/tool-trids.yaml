caveats:
  - "The arXiv abstract states that a single docking task completes in a fraction of a second, that the GPU memory footprint is a few hundred megabytes, that the method improves docking accuracy and passes physical validation, and that it was applied to a high-throughput TNF-alpha virtual screening that produced hits with novel scaffolds. Those are the abstract's own statements. The record did not run the software and does not carry them as measurements."
  - "The README lists DSDP and DSDPFlex, both from the same group and both in the Journal of Chemical Information and Modeling, as the predecessor frameworks, and the arXiv abstract identifies DSDP as the predecessor. The record does not compare TRIDS against either of them."
  - "The record establishes what the framework is and how it may be obtained. It does not establish that any pose it produces is correct, and no docking was run here."
