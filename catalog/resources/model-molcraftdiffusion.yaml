caveats:
- The README states that the zoo repositories are currently private and that access requires a Hugging Face token with permission. This establishes gated access to zoo weights, datasets and runnable example configurations. The README also names separate Zenodo archives for paper assets; their availability and terms are not established by the code licence.
- The repository LICENSE establishes MIT terms for software and documentation. The Creative Commons notice in the paper's BibTeX covers the article, and neither notice establishes the terms of private Hugging Face zoo assets or separately hosted data and checkpoints.
- The README names no individual chemical dataset, dataset size or train and validation split. The archived material is described only as the data, models and configuration files behind the platform paper, so what corpus each released checkpoint was trained on cannot be established from the page.
- The README gives one model identifier as an example and says the complete inventory is obtained through the zoo command, so the number of published checkpoints is not stated.
- The assets are cached under a default directory and verified by sha256 on every fetch, which is a stated integrity check rather than an independence check.
- A separate browser interface is mentioned. The README does not state the terms under which the service is offered, and the record did not open it.
