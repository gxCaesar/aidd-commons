caveats:
  - The README describes the model as pretrained on the transcriptomics of one hundred million human cells and provides the script for fine-tuning or training on new data.
  - The source code and the checkpoints are under a non-commercial, no-derivatives licence, so a fine-tuned derivative may not be shared, while the Zenodo training-data archive is separately under CC BY 4.0. The data terms and the model terms do not match.
  - The Zenodo record describes the archive as the datasets used in CellFM and the model card reports 19,914 samples holding 102,304,686 human cells, but neither enumerates the source atlases or the per-sample provenance, and the archive itself is 5.3 GB.
  - The repository README file is named readme.md and carries no licence section; the licence file in the repository root is named LICENSE-cc-by-nc-nd-4.0, which is why the repository page shows a generic licence label.
