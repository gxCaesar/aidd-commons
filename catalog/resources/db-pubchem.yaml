caveats:
  - The text the canonical page returned on 2026-10-23 states no licence term, and the page renders its content in the browser, so a terms page this review did not open may carry one.
  - "No terms statement for the PubChem data could be read on 2026-10-21. The usage-policy and download pages render their content in the browser or sit behind an automated-access check, so the licence and the redistribution terms stay unverified here rather than being asserted from a summary."
