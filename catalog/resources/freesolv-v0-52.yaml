caveats:
  - The v0.52 release metadata does not declare licence terms; master branch licences are not evidence for this version. The repository's current branch carries a LICENSE file specifying CC-BY 4.0 over the data and a LICENSE_code file with an MIT licence over the code, and its README states that the grant reaches the data only so far as the data is the authors' own to license and that the data derives from various sources that may carry other licences. The pinned v0.52 tag carries neither file nor a licence section in its README, so the record carries no licence and a reader who needs one for this version has to ask the laboratory.
  - The pinned database file is a semicolon-delimited text file whose header names version v0.52 and the date 6/11/17, and it carries compound identifiers, structures, experimental values with uncertainties, calculated values, reference DOIs and notes. The versioned README documents the calculation protocol for the calculated values, the GAFF force field in TIP3P water with AM1-BCC charges, the GROMACS package and the curation of experimental values from prior literature.
  - The release DOI's Zenodo metadata states no licence term, and the record does not read it as establishing one.
