caveats:
  - The README states that the specifications of the model and of the data it is trained on are packaged into one configuration file that the reader supplies.
  - The trained-model index lists no licence, attribution requirement or usage condition for the downloadable checkpoints.
  - The README states the current release is FlowMol3, published on 18 August 2025; the earlier FlowMol versions are cited separately and are not covered by this record.
  - The GEOM-Drugs corpus is described as a GEOM subset whose splits were created for MiDi, so the exact member molecules of any other GEOM release are not implied.
