caveats:
  - The ADMETlab 3.0 site states no licence for the prediction service; its only LICENSE link points to a GitHub repository path that does not exist, so the service terms are unverified.
  - The repository LICENSE file is the GNU Affero General Public License v3 while the README of the same repository names a New BSD licence for the software and its associated data and documents; both are recorded here and neither is treated as controlling.
  - The repository distributes the ADMETlab model archives described in the 2018 paper, and its README does not state that it implements the 3.0 release served by the site.
  - The site states that the prediction models are trained by the Directed Message Passing Neural Network framework on an internal database of 0.37M entries spanning 77 endpoints, and it publishes neither that database, the training code, nor the model definitions.
  - The site reports 34 ADME endpoints, 36 toxicity endpoints and 8 toxicophore rules, and separately states that the predictable endpoint count rose from 88 to 119 while the underlying database spans 77 endpoints; the page does not reconcile these figures.
  - The site's last stated update is 31 January 2024 and the repository's most recent commit shown is 20 June 2024, so maintenance beyond those dates is not established.
acknowledgements:
  - The service is run by the Computational Biology and Drug Design Group, and the site footer carries a copyright notice dated 2020.
