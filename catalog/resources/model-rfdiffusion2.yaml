id: model-rfdiffusion2
name: RFdiffusion2
kind: model
summary: RFdiffusion2 is an atom-level diffusion model for de novo enzyme and binder design that scaffolds backbones around atomic active-site descriptions; the released repository supports inference only.
canonical_url: https://github.com/RosettaCommons/RFdiffusion2
identifiers:
  - scheme: paper
    value: "Atom level enzyme active site scaffolding using RFdiffusion2; DOI 10.1101/2025.04.09.648075"
    url: https://www.biorxiv.org/content/10.1101/2025.04.09.648075v2.full-text
  - scheme: documentation
    value: "RFdiffusion2 project documentation"
    url: https://rosettacommons.github.io/RFdiffusion2/
  - scheme: model-weights
    value: "RFD_173.pt and RFD_140.pt model weights"
    url: https://files.ipd.uw.edu/pub/rfdiffusion2/model_weights/RFD_173.pt
stages: [design, evaluation]
modalities: [protein, protein-ligand-complex]
tasks: [protein-design, protein-generation]
relations: []
status: { value: unverified }
access_level: { value: open_source, evidence: [license] }
openness:
  inference_code: { value: available, evidence: [readme] }
  training_code: { value: unverified }
  weights: { value: available, evidence: [setup-py] }
  architecture: { value: available, evidence: [readme] }
  data_recipe: { value: unverified }
  training_data: { value: unverified }
  evaluation_code: { value: unverified }
licenses:
  - name: BSD-3-Clause
    scope: covers the repository source code of the Institute for Protein Design; the model weights and the Apptainer container images are downloaded from files.ipd.uw.edu and the opened pages state no terms for them
    evidence: [license]
