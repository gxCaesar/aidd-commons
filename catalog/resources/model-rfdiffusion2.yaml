caveats:
  - The repository states that only inference is supported, so the training code field stays unverified.
  - The model weights and container images are hosted at files.ipd.uw.edu, and no page opened states licence terms for them.
  - The project documentation recommends the original RFdiffusion for binder design.
  - The repository describes a benchmark crawled from 41 M-CSA enzymes but does not describe the training corpus.
