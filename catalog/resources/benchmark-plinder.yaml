licenses:
  - name: Apache-2.0
    scope: "The Apache-2.0 licence the repository carries, which its README says was changed from GPL-2.0 because the copyleft requirement came only from PLIP and that dependency is gone. The grant covers the code and the dataset generator. The dataset itself is served as a public monthly release directory and the project site states no separate terms for it."
    evidence: [repository-readme]
evidence:
  - id: repository-readme
    url: https://raw.githubusercontent.com/plinder-org/plinder/main/README.md
    label: The plinder repository README, read on 2026-10-24, which states the versioning scheme, the split construction, the download route and the licence change
    supports: [name, kind, summary, stages, modalities, tasks, identifiers, caveats]
  - id: site
    url: https://www.plinder.sh
    label: The PLINDER project site, read on 2026-10-24, which states the dataset's size and composition and the split design
    supports: [name, kind, summary, caveats]
caveats:
  - "The site states the dataset as more than 400,000 protein-ligand interaction systems across more than 11,000 SCOP domains and more than 50,000 unique small molecules, with paired unbound and AlphaFold2 predicted structures and more than 500 annotations produced by an automated curation pipeline. The record carries these as the site's own statements."
  - "The README states that the splits are pre-set and curated to minimise leakage, with test subsets of novel proteins, pockets, interactions and ligands, and it records the change from a similarity-based redundancy removal to one by protein pocket and ligand similarity. The record did not run the splits."
  - "The project site states no licence or terms of use for the dataset, so the record's access level is source available rather than open: the code is openly licensed and the data are publicly downloadable, but the grant the reader relies on for the data is not the one the site states."
  - "The dataset is versioned by the month stamp of the release, so a number reported against one release is a statement about that release and a reader who wants a comparable number has to name the version."
  - "The dataset was introduced at a workshop challenge at NeurIPS in 2024 and its paper is a preprint, so the record carries the preprint identifier and the workshop venue rather than a journal citation."
