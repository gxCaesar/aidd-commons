caveats:
  - "The dataset is public on the Open Science Framework and the project record carries no licence, so a reader who needs a grant to redistribute the files has to ask the authors. The repository's MIT licence covers the scripts that create the dataset and not the dataset itself."
  - "A cryptic site is defined here by an apo and holo structure pair, so what the dataset can be used for is bounded by that definition: a ligand that binds a pocket which is absent in the apo structure is cryptic by construction, and a pocket that is present but differently shaped is not. A reader who reads the dataset as a general set of hard targets would be reading more into it than the definition carries."
  - "The repository was created in June 2024 and last pushed in June 2026, and the paper is a Bioinformatics article, so this is a 2024 line of work rather than a 2026 one."
  - "The record did not download the dataset or run the creation scripts."
