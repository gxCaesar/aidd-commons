caveats:
  - Each row represents a context-perturbation pair. Population differential-expression probability and effect estimates are not an individualized before-and-after cell trajectory or independent causal validation.
  - The four checkpoint directories identify held-out cell lines. They are independent folds, not an ensemble. A checkpoint selected by validation AUPRC must be matched to its own training assets, gene axis and canonical split.
  - Training-data availability refers to published processed data and knowledge-source assets for the named experiment. Their upstream licences and redistribution terms remain unverified and are not supplied by the code licence.
  - Code uses CC BY-NC-SA 4.0, while checkpoints and accompanying model files use a separate noncommercial model licence and acceptable-use policy. Neither asset is an unrestricted commercial-use grant.
  - Differential-expression targets depend on preprocessing, control selection, gene filtering and statistical thresholds. The unseen-context, unseen-perturbation and joint settings support different generalization claims.
  - Rebuilding some knowledge embeddings uses an external API, while the published experiment recipes use prepared assets. No API call, checkpoint inference, training or benchmark was run for this record.
  - The linked preprint could not be opened directly because it returned HTTP 403. This record uses the opened repository and model/data cards and imports no paper-only numerical performance claim.
