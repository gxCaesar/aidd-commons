caveats:
- The pipeline needs an API key for a commercial language model and for a search service, and the example configuration selects a proprietary hosted model, so a reader without those credentials cannot reproduce a run. The record therefore carries no verified access level.
- 'The repository hosts no pretrained checkpoint and gives no weights-download procedure. The models it calls are obtained elsewhere: REINVENT4 from its own repository, Boltz for optional structure generation, and the language and search models from their providers.'
- The README names the prediction steps, affinity plus ADMET, without naming an ADMET predictor, an implementation or a checkpoint, so what the ADMET numbers are computed by is not established.
- The README carries no data-availability statement and names no training corpus. It describes inputs the pipeline retrieves at run time and results it writes to a local run directory.
- The installation instructions clone a repository named llm-dd, which is the repository the package is published from, while the canonical URL is the AgentD repository. Both are first-party, and the record carries the AgentD one.
