caveats:
  - The model card states that the model was trained on protein sequences from UniRef, MGnify and the Joint Genome Institute, that the sequences were clustered at seventy per cent identity into 83M, 372M and 2B clusters, and that the training ran in two stages, the first of a million steps with a context length of 512 and metagenomic data at sixty-four per cent of the mixture.
  - The model card names the training sequence sources as UniRef, MGnify and the Joint Genome Institute but states no licence or usage terms for them.
  - The model card lists two licence labels, mit and other, and links an Acceptable Use Policy without saying what the second label covers.
  - The project README states that source code and model weights are released for ESMC 6B, ESMFold2 and the ESMC sparse autoencoders, and does not say whether training code is included.
