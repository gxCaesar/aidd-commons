caveats:
  - The README gives no download location for a pretrained model. The only route to the trained Norman model it names is a Colab notebook that requires Colab Pro, so the availability of released weights is unverified.
  - The README has no licence section, so the MIT terms come from the repository LICENSE file alone.
  - The README names Norman et al. 2019 as the training set of the linked model, and the package downloads the norman, adamson, and dixit processed archives from public Harvard Dataverse endpoints, but the README states no dataset versions, splits, or further pretraining corpus.
