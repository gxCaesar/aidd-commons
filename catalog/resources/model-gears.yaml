    value: "Predicting transcriptional outcomes of novel multigene perturbations with gears; Nature Biotechnology 42(6):927-935 (2024), DOI 10.1038/s41587-023-01905-6"
    url: https://doi.org/10.1038/s41587-023-01905-6
  - scheme: model-weights
    value: "Model trained on Norman et al. 2019, used through the Colab notebook linked from the README"
