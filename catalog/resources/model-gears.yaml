id: model-gears
name: GEARS
kind: model
summary: Graph-based deep learning model that predicts the transcriptional response of single and multi-gene perturbations by combining a gene embedding with a knowledge graph of gene-gene relationships.
canonical_url: https://github.com/snap-stanford/GEARS
identifiers:
