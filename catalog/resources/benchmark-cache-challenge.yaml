caveats:
  - "The round the site displays is the DREAM x CACHE Target 2035 Challenge, a DEL-ML challenge targeting PGK2, with a first retrospective submission deadline of 15 September and a last date to apply of 30 September 2026. The site states that the year is carried by the surrounding dates rather than in the deadline sentence itself."
  - "The round has two phases. In the retrospective phase participants retrieve hits from an affinity selection mass spectrometry screen of 400,000 compounds, seeking the most diverse set of hidden hits; the top ten are then invited to predict novel hits prospectively from the Enamine catalogue, which the organisers procure and test experimentally at their own cost. The winners are decided on the number of novel chemical series identified in the prospective phase, with the total hit count as a secondary consideration."
  - "This is the design that separates it from a retrospective benchmark: the number a participant is judged on is produced by an experiment that happens after the prediction. The record did not submit a prediction and did not see the experimental results."
  - "Participation is through the Synapse platform and the site links a Terms of Participation document that the record did not read, so the record carries the site's own statements about the retrospective phase being free and about the data-sharing commitment, and not the participation terms."
  - "The site's own statement that all data and results will be shared openly and publicly is a commitment about the round's outcome rather than a record of released data, and the record found no released dataset to point at."
