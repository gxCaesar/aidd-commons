caveats:
  - "The arXiv page states no code or data release and gives no repository or download location, so the record carries no licence and no established access level. The paper, its experimental HTML and its TeX source are the artefacts the page offers."
  - "The targets are selected by comparing the Alpha Shape lid volume with the protein's atom-voxel volume, which identifies shallow interfaces with low concavity and adequate binding surface area, and the benchmark holds 5,780 of them drawn from CrossDocked2020. The selection rule is the benchmark's own and it decides which targets the number is about."
  - "The affinity the benchmark reports is a predicted binding affinity, so the ordering inherits the biases of the scoring function that produced it. The paper's own argument is that the generative models do worse on these low-concavity interfaces and that the difficulty is the target family rather than the architecture."
  - "The record did not run the benchmark, and it did not obtain the target list."
