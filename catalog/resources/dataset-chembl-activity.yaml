caveats:
  - One activity row is one reported value, not one independent measurement. A row carries the entity it was filed under (parent_molecule_chembl_id) separately from the form that was tested (molecule_chembl_id), so a salt formulation of a compound appears as its own molecule with its own rows, and ChEMBL's entity curation is not consistent about whether a counterion is stripped.
  - A row with a relation of ">" or "<" is a bound rather than a value, and a row with no relation symbol at all carries a number whose constraint is unstated. The number of rows is therefore not the number of measurements.
  - The REST activity endpoint does not carry the assay organism or the assay confidence score; both live on the assay record and have to be fetched separately to be read.
  - The release directory ships data files, chemical representations and schema documentation. It ships no inference implementation, no training code, no model weights and no evaluation harness, so those four dimensions are recorded as not applicable rather than as open. The curation recipe that turns a deposited paper into a standard_type row is not published as a runnable artefact in this release, so data_recipe is left unverified.
  - "The bulk artefacts of this release are large: the SQLite dump is 5,764,252,857 bytes, the MySQL dump 2,101,694,224 bytes, the PostgreSQL dump 2,088,889,426 bytes and the SDF 931,156,420 bytes, all measured from the release directory on 2026-10-21. The SDF carries structures only."
  - ChEMBL's own schema documentation states that POTENTIAL_DUPLICATE set to zero does not guarantee that a measurement is novel or independent, and that a data_validity_comment records a curator's judgement about the value rather than a correction of it.
