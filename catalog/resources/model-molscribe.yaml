caveats:
  - The training archives uspto_mol.zip and pubchem.zip are re-hosted on a model repository whose licence tag is MIT; the README gives no separate terms for the USPTO Grant Red Book and PubChem sources behind them, and the per-column provenance of the rendered images is not documented.
  - Training renders images with a modified copy of Indigo vendored under molscribe/indigo/; the repository does not state the terms that apply to that vendored code.
  - The checkpoints are hosted on the Hugging Face Hub and Dropbox rather than in the repository, so availability depends on those hosts. The Hub listing carries the three checkpoint files and the uspto_mol.zip, pubchem.zip, real.zip, perturb.zip and synthetic.zip archives, while the model repository's README file is empty.
  - The perturbed benchmark is taken from the Img2Mol repository; the relation recorded here covers that benchmark data reuse and not the Img2Mol model weights.
