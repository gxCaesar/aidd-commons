- The about page read on 2026-10-23 states that the database was built under an open-innovation agreement and asks that users cite the database paper, and it describes the contents as immunotherapeutic variable-domain sequences with their structural representatives. It names no licence, so the terms a user is given are the agreement the page mentions rather than a stated grant.
