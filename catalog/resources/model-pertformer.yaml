caveats:
  - The README has no licence section and the repository page shows only a generic licence label, so the terms come from the LICENSE file and the model card rather than from the README.
  - Neither the README, the model card, nor the paper abstract names the pretraining corpora. The abstract gives only modality counts, namely nine data types, 55 billion base pairs of bulk data, and 1.5 billion paired multi-omic observations from one million cells, and it names no benchmark datasets, splits, or metrics.
  - "The README names the preprint as 'PertFormer: Zero-shot perturbation prediction and target discovery from wild-type biology' and states the manuscript was under review, while the bioRxiv record at the cited DOI carries the title 'Multimodal foundation model predicts zero-shot functional perturbations and cell fate dynamics'. The two titles do not match."
