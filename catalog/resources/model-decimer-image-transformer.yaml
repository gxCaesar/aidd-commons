caveats:
  - The repository is a GitHub fork of Kohulan/DECIMER-Image_Transformer and its CITATION.cff points to a differently named upstream repository, github.com/Kohulan/DECIMER-Image_Transformer-2, so this fork and the upstream project are not the same artefact.
  - The application that uses this model, DECIMER.ai, links the upstream repository rather than this fork, so the relation recorded here follows the model card and the component name that both repositories share.
  - The README licence badge reads "License MIT 2.0" while the LICENSE file and the GitHub licence field both read MIT; no licence file named "MIT 2.0" is present in the repository.
  - The model card states the models were trained on images generated with RanDepict 1.1.3 but gives no corpus composition, no split and no data terms, and the README refers to "datasets of over 1 million images" without naming a corpus, so the training corpus is not documented here.
  - The CITATION.cff records the software release as DECIMER-V2 version 2.2.0 with Zenodo DOI 10.5281/zenodo.7655952 while the README model card badge links record 8300489, so two files in one repository point at different archives.
  - The checkpoints are published under CC BY 4.0 while the code is MIT, and no opened page states how the two licences combine for a user who loads a checkpoint into this code.
acknowledgements:
  - The Zenodo model card for the DECIMER V2 models lists Kohulan Rajan, Henning Otto Brinkhaus, Achim Zielesny and Christoph Steinbeck as the model creators.
