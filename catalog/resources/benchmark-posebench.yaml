caveats:
  - "The repository reports a version 1.0.0 scoring bug affecting the primary-ligand datasets Astex Diverse, DockGen-E and PoseBusters Benchmark. Its corrected version 1.1.0 reports about 15 percent lower performance on average for each benchmarked method and advises rerunning affected analyses. The notice does not state a 15-percentage-point reduction or a universal change across all datasets."
  - "The toolkit provides datasets, executable inference and relaxation scripts, alignment and scoring tools, ensemble workflows and downloadable benchmark predictions, so that a comparison can be reproduced from the released artefacts rather than taken from the figures the method authors published."
  - "The associated paper does report method comparisons under its stated datasets and metrics. Those comparisons do not define a universal method ranking. This record did not run the toolkit, and benchmark evaluation structures are not a new model's training-data release."
