caveats:
  - The Hugging Face Hub record for roitberg-group/ani2x carries the licence tag mit, but its model card body is empty, so the terms for that weight are known only from the tag. The record holds the file ani2x_state_dict.pt, and the package loads built-in models from Hugging Face repositories under the roitberg-group organisation.
  - The register of built-in datasets records the DOI and article for the ANI-2x corpus as TODO, and only the related ANI-1x and ANI-1ccx datasets carry a DOI, 10.1038/s41597-020-0473-z. No opened page states the licence or the redistribution terms for the ANI-2x corpus, so the openness of the training data is unverified.
  - The same register warns that the IonsLight, IonsHeavy and IonsVeryHeavy datasets may have incorrect energies or forces and that they are not meant to be trained on alone.
  - The README states that TorchANI 2.0 is tested against PyTorch 2.13 and CUDA 13.0, that the conda package is not maintained, and that users of a previous major version can pin version 2.2.4 to avoid the breaking changes.
  - The publisher page for the Journal of Chemical Information and Modeling article was not opened during this review, so the citation is recorded as the README states it and not from the article itself.
