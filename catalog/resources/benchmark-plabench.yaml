    supports: [identifiers, caveats]
caveats:
  - "The README states that the paper, Leakage-controlled benchmarking reveals generalization limits of deep learning for protein-ligand binding affinity prediction by Wang and Cheng, is a manuscript in submission, so the record carries the repository's own citation and not a published identifier."
  - "The README's own figures are the record's evidence here: it reports that one audited training corpus, SAIR, reaches a Tanimoto similarity of 0.85 against 32.7 percent of the unfiltered benchmark, which accounts for 2,413 removed rows, and that MixingDTA's RMSE rises from 0.462 to 0.541 on Davis and from 0.404 to 0.598 on KIBA when the evaluation moves from a warm start to a cold target. These are the benchmark's statements and not a measurement this project made."
  - "The README describes the leakage-controlled ChEMBL35 arm as retaining 4,862 ligands across 71 targets against 7,650 ligands across 84 targets unfiltered, after dropping every test ligand within an ECFP4 Tanimoto of 0.85 of any ligand in the fourteen audited training corpora and then removing the targets left with fewer than ten ligands. The filter is the benchmark's own choice and is stated."
  - "The benchmark runs nine models and every one of them is somebody else's work, so the repository asks that a reported number cite that model's own paper as well. The record did not run the benchmark."
  - "The Zenodo deposit is about 1.5 GB across six archives, and the repository's own scripts fetch and check it by a pinned checksum."
