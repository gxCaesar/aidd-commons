licenses:
  - name: MIT
    scope: "The repository's own statement that the code is MIT licensed, in its LICENSE file, which names the copyright holder as BioinfoMachineLearning. The grant covers the benchmark's own code. The third-party model weights and the benchmark data are excluded from it and keep their own terms, which the repository records per file."
    evidence: [repository-license]
  - name: Other (Open)
    scope: "The Zenodo deposit of the benchmark inputs, structures, checkpoints and predictions carries only the Zenodo licence identifier other-open, with no licence name or a rights text attached to the record, so the deposit does not itself name a standard licence. The record carries the identifier the deposit states and not a grant it does not make."
    evidence: [zenodo-record]
