id: benchmark-plabench
name: PLABench
kind: benchmark
summary: Leakage-controlled benchmark for protein-ligand binding affinity prediction that runs nine sequence- and structure-based models over the same targets under the same metrics, and reports that the reported deep-learning performance does not survive the removal of the training corpora the benchmark audited.
