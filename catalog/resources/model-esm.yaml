caveats:
  - The README names the corpus of each released model, UniRef90 for ESM-1v and CATH with UniRef50 predicted structures for ESM-IF1, and links the pretraining dataset split it publishes.
  - The openness claims here rest on the repository's own file listing and README, read on 2026-10-23; the code was not run, and no claim is made that the released scripts reproduce the published numbers.
  - Archive status applies to this repository and does not establish the lifecycle of later ESM-family products.
