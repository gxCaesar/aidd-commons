caveats:
  - The opened announcement, the arXiv abstract page and the repository file list contain no released model implementation, parameters, training code, training data or evaluation assets for AlphaProteo, so the two not_available entries record an absence found on those pages rather than a published refusal.
  - The announcement describes a phased sharing approach with external experts and gives no download route, so access is gated rather than open.
  - The repository was archived by its owner on 2026-08-24 and is read-only.
  - The licence file carries the unfilled Apache 2.0 copyright placeholder while the README names Google LLC as the copyright holder, and the README places non-software material under CC BY 4.0.
acknowledgements:
  - "The repository README asks that the model be cited as De novo design of high-affinity protein binders with AlphaProteo, arXiv 2409.08022."
