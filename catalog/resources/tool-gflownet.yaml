caveats:
  - The README calls the repository a minimum working version extracted from the internal Mila Molecule Discovery repository, so its completeness is unverified.
  - The bundled 300,000-molecule file is described without provenance, licence or redistribution terms, so training-data availability is unverified.
  - No pretrained checkpoint is listed, and the MIT licence covers the code rather than any downstream data.
  - This repository is a different project from GFNOrg/torchgfn, which carries a different licence; the two are recorded as separate resources.
